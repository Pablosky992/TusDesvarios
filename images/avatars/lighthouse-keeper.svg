<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-lighthouse-keeper" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </radialGradient>
    <filter id="glow-lighthouse-keeper" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#10b981" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Background circle -->
  <circle cx="40" cy="40" r="37" fill="url(#bg-lighthouse-keeper)" stroke="#10b981" stroke-width="2.5" filter="url(#glow-lighthouse-keeper)"/>
  <!-- Artwork -->
  <g filter="url(#glow-lighthouse-keeper)">
    <!-- Lighthouse -->
      <polygon points="40,24 35,56 45,56" fill="#34d399"/>
      <rect x="36" y="22" width="8" height="4" fill="#fef08a"/>
      <polygon points="40,20 37,23 43,23" fill="#064e3b"/>
      <!-- Beam of light -->
      <polygon points="40,23 66,16 64,30" fill="#fef08a" opacity="0.35"/>
      <polygon points="40,23 14,16 16,30" fill="#fef08a" opacity="0.35"/>
      <circle cx="40" cy="23" r="2" fill="#fff"/>
  </g>
</svg>