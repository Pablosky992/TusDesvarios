      "titulo": "Capítulo I: El Osario de Santa Eulalia",
      "texto": "Año del Señor de 1347. El invierno más atroz que la memoria de los ancianos recuerda ha sellado los puertos de montaña de los Pirineos bajo ventisqueros infranqueables. En los valles de abajo, la Peste Negra avanza devorando reinos enteros; pero en la cumbre de la Abadía de Santa Eulalia de los Riscos, los monjes mueren por causas que desafían la teología y la naturaleza: lenguas ennegrecidas por vitriolo, ojos reventados en sangre y delirios nocturnos en dialectos antediluvianos.\n\nEres fray Tomás de Aquitania, un antiguo inquisidor dominico desencantado que, tras renegar de los tormentos y las piras de la fe, se refugió en este nido de águilas como bibliotecario mayor y traductor del *scriptorium*. Esta medianoche, tras la repentina y brutal muerte del anciano Abad Bernardo —hallado congelado, ciego y con una mueca de espanto ante el facistol del coro—, has descendido a solas al osario subterráneo con la pesada llave de hierro forjado que heredaste en secreto.\n\nTras el fresco desconchado del Juicio Final, en una hornacina oculta entre calaveras de monjes del siglo X, descubres un cofre de bronce bizantino sellado con tres candados de plomo. Dentro reposa el legendario *Codex Umbrarum*: un grueso palimpsesto encuadernado en cuero negruzco de origen no humano, sellado con cera carmesí que desprende un tenue fulgor esmeralda y un inconfundible olor a almendras amargas. Una inscripción en latín templario grabada en la tapa advierte:\n\n> *«La tinta es veneno para la carne y luz para el ciego. Quien posea el Lapis Niger de Antioquía proyectará los nombres de los que han de morir.»*",
      "imagen": "images/stories/abadia-prohibida/cripta.jpg",
      "opciones": [
        {
          "id": "opt_1_lapis",
          "texto": "Subir sigilosamente a la sacristía mayor para buscar la gema de obsidiana 'Lapis Niger' oculta tras el altar",
          "destinoId": "nodo_2_sacristia_lapis",
          "impacto": "Investigación"
        },
        {
          "id": "opt_1_botica",
          "texto": "Llevar muestras del veneno y el cofre al laboratorio de Fray Severino el Boticario para un análisis químico",
          "destinoId": "nodo_3_botica_alquimia",
          "impacto": "Científico"
        },
        {
          "id": "opt_1_scriptorium",
          "texto": "Acudir al scriptorium en busca de Guillermo, el novicio mudo que conoce los secretos del abad",
          "destinoId": "nodo_4_scriptorium_guillermo",
          "impacto": "Alianza"
        },
        {
          "id": "opt_1_celda",
          "texto": "Ocultar el códice bajo el sayal y llevarlo a tu celda privada para estudiar las anotaciones marginales",
          "destinoId": "nodo_5_celda_mapa",
          "impacto": "Prudente"
        }
      ]
    },
    "nodo_2_sacristia_lapis": {
      "id": "nodo_2_sacristia_lapis",
      "titulo": "Capítulo II: El Lapis Niger de Antioquía",
      "texto": "Te deslizas por las sombras de la basílica hasta la sacristía mayor. Tras el retablo gótico de la Asunción, retiras un sillar hueco y encuentras una caja de plata que contiene el *Lapis Niger*: una gema de obsidiana estelar facetada con geometrías que ningún orfebre humano podría haber tallado.\n\nAl interponer la piedra negra entre la llama de una vela de cera virgen y las páginas del códice, ocurre un prodigio aterrador: la luz se refracta proyectando sobre las paredes de granito una carta celeste en relieve y la lista en bermellón de todos los monjes de Santa Eulalia, señalando la hora exacta en que cada uno perecerá. Tu propio nombre aparece marcado para la cuarta vigilia de esta misma noche.\n\nUn crujido de pasos acorazados en el pasillo exterior anuncia la llegada de los guardias del Prior Rodrigo.",
      "imagen": "images/stories/abadia-prohibida/cripta.jpg",
      "opciones": [
        {
          "id": "opt_2_proyectar_coro",
          "texto": "Escabullirte por la puerta del sagrario hacia el coro para proyectar la carta estelar en la cúpula",
          "destinoId": "nodo_6_proyeccion_coro",
          "impacto": "Místico"
        },
        {
          "id": "opt_2_emboscada_sacristia",
          "texto": "Trepar por los tirantes de hierro del retablo y ocultarte en la galería alta del triforio",
          "destinoId": "nodo_7_triforio_escape",
          "impacto": "Agilidad"
        },
        {
          "id": "opt_2_botica",
          "texto": "Bajar por la escalera de servicio hacia la botica para reunir la gema con los reactivos de Severino",
          "destinoId": "nodo_3_botica_alquimia",
          "impacto": "Prudente"
        }
      ]
    },
    "nodo_3_botica_alquimia": {
      "id": "nodo_3_botica_alquimia",
      "titulo": "Capítulo II: El Laboratorio Alquímico de Severino",
      "texto": "Cruzas los claustros cubiertos de escarcha y entras en la botica monacal. Entre alambiques de cobre, retortas sibilantes y ristras de mandrágora, fray Severino te recibe con una lámpara de aceite en la mano temblorosa.\n\nSobre una losa de mármol yace el cuerpo amortajado del abad Bernardo. Severino aparta el lino para mostrarte sus labios amoratados y sus cuerdas vocales calcinadas por un ácido frío y desconocido:\n\n—*Tomás, mira esto* —susurra el boticario aplicando una gota de vitriolo blanco sobre la lengua del difunto—. *No es una peste ni un castigo divino. Las hojas del códice fueron bañadas en la tintura destilada de la 'Mycena noctiluca', un hongo bioluminiscente que crece exclusivamente en la sima glacial bajo los cimientos de la abadía. Quien pasa las páginas humedeciendo sus dedos con saliva absorbe el alcaloide: produce clarividencia absoluta durante unos minutos y luego fulmina el corazón.*",
      "imagen": "images/stories/abadia-prohibida/botica.jpg",
      "opciones": [
        {
          "id": "opt_3_antidoto",
          "texto": "Ayudar a Severino a destilar un contra-veneno con sales de plata, belladona y vinagre destilado",
          "destinoId": "nodo_8_destilacion_antidoto",
          "impacto": "Científico"
        },
        {
          "id": "opt_3_autopsia",
          "texto": "Practicar una incisión forense en el estómago del abad para averiguar cómo le administraron el veneno",
          "destinoId": "nodo_9_autopsia_veneno",
          "impacto": "Forense"
        },
        {
          "id": "opt_3_inhalar",
          "texto": "Inhalar una brizna infinitesimal del vapor purificado para inducir una visión controlada del códice",
          "destinoId": "nodo_10_trance_alquimico",
          "impacto": "Arriesgado"
        }
      ]
    },
    "nodo_4_scriptorium_guillermo": {
      "id": "nodo_4_scriptorium_guillermo",
      "titulo": "Capítulo II: El Silencio de Guillermo",
      "texto": "Subes a la inmensa nave gótica del *scriptorium*. Las hileras de pupitres de roble yacen mudas bajo la luz azulada de la ventisca que castiga las vidrieras ojivales. Entre las sombras del atril mayor descubres a Guillermo, el joven novicio al que el abad protegió durante años.\n\nGuillermo, incapaz de hablar, abre con dedos nerviosos un cuaderno de bocetos a carboncillo. Sus dibujos son revelaciones estremecedoras: retratan al Prior Rodrigo entregando bolsas de florines a mercenarios de la Inquisición en el molino subterráneo, mapas milimétricos de pasadizos ocultos entre los muros de sillería y el plano del gran espejo de bronce de la torre prohibida, construido según la geometría del sabio persa Alhazen.",
      "imagen": "images/stories/abadia-prohibida/scriptorium.jpg",
      "opciones": [
        {
          "id": "opt_4_laberinto_espejos",
          "texto": "Seguir el dibujo de Guillermo y presionar el relieve del espejo para entrar al laberinto de la torre",
          "destinoId": "nodo_11_laberinto_alhazen",
          "impacto": "Exploración"
        },
        {
          "id": "opt_4_muros_pasadizo",
          "texto": "Guiarte por los conductos estrechos entre los muros dobles para espiar las reuniones de Rodrigo",
          "destinoId": "nodo_12_pasadizos_muro",
          "impacto": "Sigilo"
        },
        {
          "id": "opt_4_celada_librero",
          "texto": "Preparar un manuscrito señuelo con tinte de nuez de agallas y vitriolo para tender una trampa a los espías",
          "destinoId": "nodo_13_celada_biblioteca",
          "impacto": "Estratégico"
        }
      ]
    },
    "nodo_5_celda_mapa": {
      "id": "nodo_5_celda_mapa",
      "titulo": "Capítulo II: La Herejía de los Perfectos",
      "texto": "Te encierras en tu celda monacal, atrancando la pesada puerta de roble con el cerrojo de hierro. Al calor de las brasas de la chimenea, acercas el pergamino al fuego. Al subir la temperatura, las anotaciones invisibles trazadas con tinta simpática despiertan en el margen de la vitela:\n\n> *«No hay infierno más allá de esta carne. La abadía fue construida sobre la fortaleza de los cátaros de Montségur para custodiar al Durmiente del Hielo. El Prior planea purgar la orden con veneno para que la Inquisición papal recupere el trono subterráneo. Tomás: en el molino harinero están las esclusas de agua romana; ábrelas o la noche eterna devorará el mundo.»*\n\nEl reloj de agua de tu celda gotea con regularidad implacable. La hora de la colación nocturna en el refectorio está a punto de comenzar.",
      "imagen": "images/stories/abadia-prohibida/cripta.jpg",
      "opciones": [
        {
          "id": "opt_5_esclusas_molino",
          "texto": "Descender de inmediato al sótano del molino para inspeccionar las compuertas hidráulicas romanas",
          "destinoId": "nodo_15_esclusas_romanas",
          "impacto": "Audaz"
        },
        {
          "id": "opt_5_sima_directa",
          "texto": "Seguir las coordenadas del mapa y bajar por el pozo kárstico hacia la sima glacial del Durmiente",
          "destinoId": "nodo_20_glaciar_durmiente",
          "impacto": "Trascendental"
        },
        {
          "id": "opt_5_refectorio_alerta",
          "texto": "Acudir al refectorio para vigilar a los monjes durante la cena comunal y evitar un envenenamiento masivo",
          "destinoId": "nodo_17_refectorio_tension",
          "impacto": "Humanitario"
        }
      ]
    },
    "nodo_6_proyeccion_coro": {
      "id": "nodo_6_proyeccion_coro",
      "titulo": "Capítulo III: Los Glifos del Juicio",
      "texto": "Llegas al coro alto de la iglesia. Colocas el *Lapis Niger* en el atril de nogal y proyectas la luz hacia la cúpula central. El techo de piedra se transforma en un mapa estelar fosforescente donde las constelaciones giran con precisión matemática.\n\nComprendes la verdad astronómica: la constelación del Cisne alcanzará su cenit exactamente a las cuatro de la madrugada. Si el cántico primordial no es pronunciado o neutralizado antes de esa hora, la energía del meteorito kárstico despertará a la entidad congelada bajo la abadía.",
      "imagen": "images/stories/abadia-prohibida/scriptorium.jpg",
      "opciones": [
        {
          "id": "opt_6_campanario",
          "texto": "Subir a toda prisa al observatorio del campanario para alinear los telescopios de bronce",
          "destinoId": "nodo_16_observatorio_campanario",
          "impacto": "Cosmología"
        },
        {
          "id": "opt_6_alerta_hermanos",
          "texto": "Reunir a los frailes ancianos del cabildo para mostrarles la proyección en la cúpula",
          "destinoId": "nodo_18_debate_capitulo",
          "impacto": "Persuasión"
        }
      ]
    },
    "nodo_7_triforio_escape": {
      "id": "nodo_7_triforio_escape",
      "titulo": "Capítulo III: La Huida por las Alturas",
      "texto": "Avanzas por la estrecha cornisa del triforio a treinta metros sobre las baldosas de la nave mayor. Abajo, los guardias del Prior registran las capillas con antorchas y perros de presa que gruñen olisqueando el rastro de la tinta.\n\nUna ráfaga de viento helado entra por un rosetón quebrado, cubriendo las losas de nieve resbaladiza. Si das un paso en falso, te precipitarás al vacío sobre el altar de piedra.",
      "imagen": "images/stories/abadia-prohibida/portada.jpg",
      "opciones": [
        {
          "id": "opt_7_scriptorium",
          "texto": "Saltar hacia el tejadillo anexo del scriptorium y deslizarte por la claraboya",
          "destinoId": "nodo_4_scriptorium_guillermo",
          "impacto": "Temerario"
        },
        {
          "id": "opt_7_campanario",
          "texto": "Subir por la escalera de caracol exterior hacia la torre del campanario y atrancar la puerta",
          "destinoId": "nodo_16_observatorio_campanario",
          "impacto": "Defensivo"
        }
      ]
    },
    "nodo_8_destilacion_antidoto": {
      "id": "nodo_8_destilacion_antidoto",
      "titulo": "Capítulo III: El Triunfo de la Medicina",
      "texto": "Trabajando codo con codo con fray Severino sobre el hornillo alquímico, logras destilar tres ampollas de vidrio verde selladas con cera de laurel: un contra-veneno purificado a base de sales de plata, extracto de sauce y vinagre destilado.\n\nBebes una dosis preventiva: una oleada de calor reconfortante recorre tus venas y tu mente se vuelve completamente inmune a las esporas alucinógenas del códice. Ahora eres el único hombre en Santa Eulalia capaz de manipular las páginas y salvar a los hermanos.",
      "imagen": "images/stories/abadia-prohibida/botica.jpg",
      "opciones": [
        {
          "id": "opt_8_refectorio",
          "texto": "Llevar el antídoto al refectorio antes de que los monjes beban el vino envenenado de la cena",
          "destinoId": "nodo_17_refectorio_tension",
          "impacto": "Salvación"
        },
        {
          "id": "opt_8_esclusas",
          "texto": "Bajar protegido con Severino al molino subterráneo para asegurar las compuertas de agua",
          "destinoId": "nodo_15_esclusas_romanas",
          "impacto": "Estratégico"
        },
        {
          "id": "opt_8_sima",
          "texto": "Descender inmune a la sima glacial para erradicar el foco de los hongos con vitriolo cáustico",
          "destinoId": "nodo_20_glaciar_durmiente",
          "impacto": "Erradicación"
        }
      ]
    },
    "nodo_9_autopsia_veneno": {
      "id": "nodo_9_autopsia_veneno",
      "titulo": "Capítulo III: El Cáliz de la Traición",
      "texto": "Con el escalpelo de plata realizas la disección estomacal del abad Bernardo. En su interior hallas restos de vino aromatizado con canela y posos densos de *Mycena noctiluca*.\n\n—*El cáliz de la misa mayor...* —exclama Severino con horror—. *Rodrigo no solo envenenó el códice; ha vertido el extracto en la tinaja de vino de la bodega capitular. Esta noche, durante la colación del refectorio, todos los frailes que no se sometan a su mandato serán envenenados.*",
      "imagen": "images/stories/abadia-prohibida/botica.jpg",
      "opciones": [
        {
          "id": "opt_9_refectorio_denuncia",
          "texto": "Correr al refectorio empuñando el cáliz y el informe forense para detener la cena ante todos",
          "destinoId": "nodo_17_refectorio_tension",
          "impacto": "Confrontación"
        },
        {
          "id": "opt_9_capitulo",
          "texto": "Convocar formalmente a los decanos en la Sala Capitular apelando al derecho canónico de la orden",
          "destinoId": "nodo_18_debate_capitulo",
          "impacto": "Legalidad"
        }
      ]
    },
    "nodo_10_trance_alquimico": {
      "id": "nodo_10_trance_alquimico",
      "titulo": "Capítulo III: El Vuelo Sobre el Abismo",
      "texto": "Inhalas una brizna del vapor esmeralda purificado por el alambique. De golpe, los muros de piedra se vuelven translúcidos como agua clara. Tu consciencia se eleva a miles de metros sobre los Pirineos.\n\nVes el impacto estelar ocurrido hace diez milenios, la cueva de hielo donde duerme el corazón de la criatura cósmica y las líneas de fuerza electromagnética que conectan el telescopio árabe del campanario con las entrañas de la montaña. Comprendes cómo funciona la máquina milenaria del monasterio.",
      "imagen": "images/stories/abadia-prohibida/sima.jpg",
      "opciones": [
        {
          "id": "opt_10_observatorio",
          "texto": "Regresar del trance con lucidez absoluta y subir al campanario a operar el astrolabio",
          "destinoId": "nodo_16_observatorio_campanario",
          "impacto": "Maestría"
        },
        {
          "id": "opt_10_sima",
          "texto": "Guiarte por la visión y caminar en trance directo hacia la caverna del glaciar",
          "destinoId": "nodo_20_glaciar_durmiente",
          "impacto": "Místico"
        }
      ]
    },
    "nodo_11_laberinto_alhazen": {
      "id": "nodo_11_laberinto_alhazen",
      "titulo": "Capítulo III: El Espejo de las Sombras",
      "texto": "El marco de bronce gira sobre sus goznes y entras en el laberinto hexagonal de la torre prohibida. Decenas de espejos curvos reflejan tu silueta en infinitos ángulos, desafiando toda noción de perspectiva euclidiana.\n\nEn la cámara central descubres el observatorio secreto del sabio persa Alhazen: un astrolabio monumental de latón con engranajes planetarios que giran impulsados por un péndulo de mercurio. El *Codex Umbrarum* encaja en una hendidura sobre el pedestal de piedra.",
      "imagen": "images/stories/abadia-prohibida/laberinto.jpg",
      "opciones": [
        {
          "id": "opt_11_astrolabio_siete",
          "texto": "Alinear los discos del astrolabio con las coordenadas de la constelación del Cisne",
          "destinoId": "nodo_19_astrolabio_ritual",
          "impacto": "Astral"
        },
        {
          "id": "opt_11_destruir_mecanismo",
          "texto": "Introducir una barra de hierro entre los engranajes de bronce para destruir el mecanismo para siempre",
          "destinoId": "nodo_22_sabotaje_torre",
          "impacto": "Destructivo"
        }
      ]
    },
    "nodo_12_pasadizos_muro": {
      "id": "nodo_12_pasadizos_muro",
      "titulo": "Capítulo III: Los Ojos en la Piedra",
      "texto": "Avanzas agazapado por el pasadizo interior de los muros dobles. A través de una mirilla tallada en la sillería del coro, observas al Prior Rodrigo reunido con tres emisarios encapuchados de la Inquisición papal.\n\n—*El códice será destruido junto con la biblioteca* —dice Rodrigo con voz gélida—. *Diremos que los frailes murieron de peste y que el fuego fue necesario para purificar el pecado. A cambio, el Santo Padre me nombrará obispo de Toulouse.*",
      "imagen": "images/stories/abadia-prohibida/scriptorium.jpg",
      "opciones": [
        {
          "id": "opt_12_emboscada_rodrigo",
          "texto": "Esperar a que Rodrigo se quede solo en el claustro para emboscarlo con la ayuda de Guillermo",
          "destinoId": "nodo_23_confrontacion_directa",
          "impacto": "Ataque"
        },
        {
          "id": "opt_12_abrir_establos",
          "texto": "Escabullirte hacia las caballerizas para preparar mulas y alforjas para una fuga general de los textos",
          "destinoId": "nodo_24_preparar_exodo",
          "impacto": "Rescate"
        }
      ]
    },
    "nodo_13_celada_biblioteca": {
      "id": "nodo_13_celada_biblioteca",
      "titulo": "Capítulo III: La Trampa del Manuscrito",
      "texto": "Colocas un libro señuelo en el atril mayor, untado con una mezcla paralizante de belladona preparada por Severino. A las tres de la madrugada, los dos esbirros armados de Rodrigo entran sigilosamente al scriptorium.\n\nAl abalanzarse sobre el tomo y pasar las hojas con avidez, el alcaloide penetra en sus yemas de los dedos. En segundos caen desplomados sobre los pupitres de roble, conscientes pero incapaces de mover un solo músculo.",
      "imagen": "images/stories/abadia-prohibida/scriptorium.jpg",
      "opciones": [
        {
          "id": "opt_13_interrogar",
          "texto": "Obligar a los secuaces paralizados a firmar una confesión por escrito ante el crucifijo",
          "destinoId": "nodo_18_debate_capitulo",
          "impacto": "Justicia"
        },
        {
          "id": "opt_13_encerrar",
          "texto": "Atar a los sicarios en el calabozo del abad y marchar de inmediato al refectorio",
          "destinoId": "nodo_17_refectorio_tension",
          "impacto": "Prudente"
        }
      ]
    },
    "nodo_15_esclusas_romanas": {
      "id": "nodo_15_esclusas_romanas",
      "titulo": "Capítulo III: El Corazón de las Aguas Negras",
      "texto": "Desciendes a la bóveda ciclópea del molino harinero. El rugido atronador del río subterráneo hace vibrar el suelo de granito. Ante ti se alzan las compuertas hidráulicas construidas por los ingenieros romanos hace mil trescientos años: gigantescas ruedas de roble, engranajes de bronce fosforoso y cadenas de hierro forjado.\n\nEstas compuertas controlan el curso del torrente que alimenta el lago de la sima glacial. Con las palancas de presión puedes desviar millones de litros de agua para anegar las cavernas de los hongos o drenar el santuario del hielo.",
      "imagen": "images/stories/abadia-prohibida/esclusas.jpg",
      "opciones": [
        {
          "id": "opt_15_inundar",
          "texto": "Girar las ruedas de presión para anegar las cavernas inferiores y erradicar los hongos venenosos",
          "destinoId": "nodo_21_inundacion_cataclismo",
          "impacto": "Purificación"
        },
        {
          "id": "opt_15_drenar",
          "texto": "Invertir el flujo hacia el río exterior para secar el paso hacia el núcleo del glaciar",
          "destinoId": "nodo_20_glaciar_durmiente",
          "impacto": "Exploración"
        }
      ]
    },
    "nodo_16_observatorio_campanario": {
      "id": "nodo_16_observatorio_campanario",
      "titulo": "Capítulo IV: En la Cúspide de la Tempestad",
      "texto": "Asciendes a la plataforma exterior del campanario, suspendido a cincuenta metros sobre el abismo nevado. La ventisca aúlla con ferocidad salvaje entre las gárgolas de piedra, pero sobre tu cabeza la bóveda celeste resplandece con una claridad diamantina.\n\nAlineas el gran telescopio árabe con el cenit de la constelación del Cisne e incrustas el *Lapis Niger* en el ocular de bronce. Un haz de luz plateada concentrada atraviesa la lente, proyectando un círculo incandescente sobre el *Codex Umbrarum*.",
      "imagen": "images/stories/abadia-prohibida/portada.jpg",
      "opciones": [
        {

    const STORIES_DATABASE = {
      "la-ultima-guardia-faro": FARO_STORY,
      "el-manuscrito-de-la-abadia": ABADIA_STORY
    };

    const STORAGE_KEY = 'crea_tu_historia_progress_';

    const app = {
      currentStory: null,
      currentNodeId: null,
      historyTrail: [],

      init() {
        this.renderCatalog();
      },

      resolveImagePath(path) {
        if (!path) return '';
        if (path.startsWith('http://') || path.startsWith('https://')) return path;
        return path.replace(/^\//, '');
      },

      getSavedProgress(slug) {
        try {
          const raw = localStorage.getItem(STORAGE_KEY + slug);
          return raw ? JSON.parse(raw) : null;
        } catch {
          return null;
        }
      },

      saveProgress(slug, nodeId, history, ending, endingNodeId) {
        try {
          const existing = this.getSavedProgress(slug) || {};
          let finales = existing.finalesDescubiertos || [];
          if (endingNodeId && !finales.includes(endingNodeId)) {
            finales.push(endingNodeId);
          }
          const isEndingReached = !!ending || !!endingNodeId;
          localStorage.setItem(STORAGE_KEY + slug, JSON.stringify({
            nodoActualId: nodeId,
            historialNodos: history,
            finalAlcanzado: ending || existing.finalAlcanzado,
            finalesDescubiertos: finales,
            fecha: new Date().toISOString(),
            completada: isEndingReached ? true : (existing.completada || false),
            leida: isEndingReached ? true : (existing.leida || existing.completada || false)
          }));
        } catch {}
      },

      toggleRead(slug) {
        try {
          const existing = this.getSavedProgress(slug) || {};
          const isCurrentlyRead = existing.leida !== undefined ? existing.leida : (existing.completada || false);
          const nextState = !isCurrentlyRead;
          localStorage.setItem(STORAGE_KEY + slug, JSON.stringify({
            ...existing,
            leida: nextState,
            completada: nextState,
            fecha: new Date().toISOString()
          }));
          this.renderCatalog();
        } catch {}
      },

      clearProgress(slug) {
        try {
          const existing = this.getSavedProgress(slug);
          if (existing) {
            localStorage.setItem(STORAGE_KEY + slug, JSON.stringify({
              nodoActualId: '',
              historialNodos: [],
              finalAlcanzado: null,
              finalesDescubiertos: existing.finalesDescubiertos || [],
              fecha: new Date().toISOString(),
              completada: existing.completada,
              leida: existing.leida !== undefined ? existing.leida : existing.completada
            }));
          }
        } catch {}
      },

      showCatalog() {
        this.currentStory = null;
        this.currentNodeId = null;
        this.historyTrail = [];
        document.getElementById('header-restart-btn').style.display = 'none';
        document.getElementById('header-catalog-btn').style.display = 'none';
        this.renderCatalog();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      },

      startStory(slug, resume = false) {
        const story = STORIES_DATABASE[slug];
        if (!story) return;

        this.currentStory = story;
        document.getElementById('header-restart-btn').style.display = 'inline-flex';
        document.getElementById('header-catalog-btn').style.display = 'inline-flex';

        if (resume) {
          const saved = this.getSavedProgress(slug);
          if (saved && saved.nodoActualId && story.nodos[saved.nodoActualId]) {
            this.currentNodeId = saved.nodoActualId;
            this.historyTrail = saved.historialNodos || [saved.nodoActualId];
            this.renderReader();
            window.scrollTo({ top: 0, behavior: 'smooth' });
            return;
          }
        }

        this.currentNodeId = story.nodoInicialId;
        this.historyTrail = [story.nodoInicialId];
        this.saveProgress(slug, story.nodoInicialId, this.historyTrail);
        this.renderReader();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      },

      selectOption(targetNodeId) {
        if (!this.currentStory || !this.currentStory.nodos[targetNodeId]) return;

        const nextNode = this.currentStory.nodos[targetNodeId];
        this.currentNodeId = targetNodeId;
        this.historyTrail.push(targetNodeId);

        this.saveProgress(
          this.currentStory.slug,
          targetNodeId,
          this.historyTrail,
          nextNode.esFinal ? nextNode.tipo_final : undefined,
          nextNode.esFinal ? targetNodeId : undefined
        );

        this.renderReader();
        window.scrollTo({ top: 0, behavior: 'smooth' });

        if (nextNode.esFinal && nextNode.tipo_final === 'bueno') {
          this.fireConfetti();
        }
      },

      goBack() {
        if (this.historyTrail.length <= 1) return;
        this.historyTrail.pop();
        const prevId = this.historyTrail[this.historyTrail.length - 1];
        this.currentNodeId = prevId;
        const prevNode = this.currentStory.nodos[prevId];

        this.saveProgress(
          this.currentStory.slug,
          prevId,
          this.historyTrail,
          prevNode.esFinal ? prevNode.tipo_final : undefined,
          prevNode.esFinal ? prevId : undefined
        );

        this.renderReader();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      },

      restartStory() {
        if (!this.currentStory) return;
        this.clearProgress(this.currentStory.slug);
        this.startStory(this.currentStory.slug, false);
      },

      formatText(text) {
        if (!text) return '';
        const blocks = text.split(/\n\s*\n/);
        return blocks.map(block => {
          const trimmed = block.trim();
          let formatted = trimmed
            .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
            .replace(/\*(.*?)\*/g, '<em>$1</em>')
            .replace(/\n/g, '<br>');

          if (trimmed.startsWith('>')) {
            const quote = formatted.replace(/^>\s*/gm, '');
            return '<blockquote>' + quote + '</blockquote>';
          }
          return '<p>' + formatted + '</p>';
        }).join('');
      },

      renderCatalog() {
        const root = document.getElementById('app-root');
        const stories = Object.values(STORIES_DATABASE);

        let cardsHtml = stories.map(story => {
          const progress = this.getSavedProgress(story.slug);
          const hasProgress = progress && progress.historialNodos && progress.historialNodos.length > 1 && !progress.completada;
          const isCompleted = progress && progress.completada;
          const isRead = progress && (progress.leida !== undefined ? progress.leida : (progress.completada || false));
          const coverImg = this.resolveImagePath(story.portada);

          const totalFinales = Object.values(story.nodos || {}).filter(n => n.esFinal).length || (story.slug === 'la-ultima-guardia-faro' ? 6 : 8);
          const finales = (progress && progress.finalesDescubiertos) ? progress.finalesDescubiertos : [];
          const countFinales = finales.length;
          const allUnlocked = totalFinales > 0 && countFinales >= totalFinales;
          const pctFinales = totalFinales > 0 ? Math.min(100, Math.round((countFinales / totalFinales) * 100)) : 0;

          let actionBtn = `<a href="historia-${story.slug}.html" class="story-card-btn" style="text-decoration:none; text-align:center; display:flex; align-items:center; justify-content:center;">📖 Comenzar aventura</a>`;
          if (hasProgress) {
            actionBtn = `
              <div style="display:flex; gap:0.5rem; margin-top:1rem;">
                <a href="historia-${story.slug}.html" class="story-card-btn resume" style="flex:1; margin-top:0; text-decoration:none; text-align:center; display:flex; align-items:center; justify-content:center;">▶ Continuar (Paso ${progress.historialNodos.length})</a>
                <button class="btn-secondary" title="Reiniciar partida" onclick="event.stopPropagation(); app.clearProgress('${story.slug}'); app.renderCatalog();">↺</button>
              </div>
            `;
          } else if (isCompleted) {
            actionBtn = `
              <div style="display:flex; gap:0.5rem; margin-top:1rem;">
                <a href="historia-${story.slug}.html" class="story-card-btn" style="flex:1; margin-top:0; text-decoration:none; text-align:center; display:flex; align-items:center; justify-content:center;">↺ Rejugar historia</a>
              </div>
            `;
          }

          return `
            <article class="story-card" style="cursor:pointer; ${allUnlocked ? 'border:1.5px solid rgba(245, 158, 11, 0.55); box-shadow:0 8px 30px rgba(245, 158, 11, 0.25);' : ''}" onclick="location.href='historia-${story.slug}.html'">
              <div class="story-card-image-wrapper">
                <img src="${coverImg}" alt="${story.titulo}" class="story-card-image" loading="lazy">
                <div class="story-card-overlay"></div>
                <div style="position:absolute; top:0.75rem; left:0.75rem; right:0.75rem; display:flex; align-items:center; justify-content:space-between; z-index:2;">
                  <span class="story-card-badge" style="position:static;">${story.genero}</span>
                  ${isRead ? `
                    <button type="button" onclick="event.stopPropagation(); app.toggleRead('${story.slug}');" title="Hacer clic para quitar y desmarcar como leída" style="cursor:pointer; font-size:0.72rem; font-weight:800; background:rgba(16, 185, 129, 0.28); border:1px solid rgba(16, 185, 129, 0.65); color:#34d399; padding:0.22rem 0.65rem; border-radius:9999px; box-shadow:0 0 14px rgba(16, 185, 129, 0.35); backdrop-filter:blur(8px); display:inline-flex; align-items:center; gap:0.3rem;">
                      <span>✅ Leída</span>
                      <span style="font-size:0.65rem; opacity:0.8;">(quitar ✕)</span>
                    </button>
                  ` : ''}
                </div>
              </div>
              <div class="story-card-content">
                <h2 class="story-card-title">${story.titulo}</h2>
                <p class="story-card-desc">${story.descripcionCorta}</p>
                <div class="story-card-meta">
                  <span>⏱ ${story.tiempoLecturaMin} min</span>
                  <span>📑 ~${story.totalNodosEstimados} nodos</span>
                </div>

                ${allUnlocked ? `
                  <div style="background:linear-gradient(90deg, rgba(245,158,11,0.2) 0%, rgba(217,119,6,0.25) 100%); border:1.5px solid rgba(245,158,11,0.5); border-radius:8px; padding:0.45rem 0.75rem; margin-top:0.85rem; display:flex; align-items:center; gap:0.45rem; color:#fbbf24; font-size:0.8rem; font-weight:800; box-shadow:0 0 18px rgba(245,158,11,0.25);">
                    <span>🌟</span>
                    <span>¡Todos los finales descubiertos! (${countFinales}/${totalFinales})</span>
                  </div>
                ` : ''}

                <div style="margin-top:0.85rem; padding:0.65rem 0.85rem; background:rgba(255, 255, 255, 0.03); border:1px solid var(--border-subtle); border-radius:8px;">
                  <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:0.45rem; font-size:0.8rem;">
                    <span style="color:var(--text-secondary); display:inline-flex; align-items:center; gap:0.35rem; font-weight:600;">
                      <span style="color:${allUnlocked ? '#fbbf24' : 'var(--accent-amber)'};">🏆</span>
                      <span>Finales descubiertos:</span>
                    </span>
                    <span style="font-weight:800; color:${allUnlocked ? '#fbbf24' : '#34d399'};">
                      ${countFinales} de ${totalFinales} (${pctFinales}%)
                    </span>
                  </div>
                  <div style="width:100%; height:6px; background:rgba(255,255,255,0.08); border-radius:9999px; overflow:hidden;">
                    <div style="width:${pctFinales}%; height:100%; background:${allUnlocked ? 'linear-gradient(90deg, #f59e0b 0%, #fbbf24 100%)' : 'linear-gradient(90deg, #f59e0b 0%, #10b981 100%)'}; border-radius:9999px; transition:width 0.4s ease;"></div>
                  </div>
                </div>

                ${actionBtn}

                <div style="display:flex; justify-content:flex-end; margin-top:0.75rem;">
                  <button type="button" onclick="event.stopPropagation(); app.toggleRead('${story.slug}');" title="${isRead ? 'Hacer clic para quitar y desmarcar como leída' : 'Marcar historia como leída'}" style="display:inline-flex; align-items:center; gap:0.35rem; padding:0.35rem 0.75rem; border-radius:9999px; font-size:0.76rem; font-weight:600; border:${isRead ? '1px solid rgba(16, 185, 129, 0.55)' : '1px solid rgba(255, 255, 255, 0.18)'}; background:${isRead ? 'rgba(16, 185, 129, 0.18)' : 'rgba(255, 255, 255, 0.05)'}; color:${isRead ? '#34d399' : 'var(--text-secondary)'}; cursor:pointer; transition:all 0.2s ease; box-shadow:${isRead ? '0 0 12px rgba(16, 185, 129, 0.25)' : 'none'};">
                    <span>${isRead ? '✅' : '⚪'}</span>
                    <span>${isRead ? 'Leída (clic para quitar)' : 'Marcar leída'}</span>
                  </button>
                </div>
              </div>
            </article>
          `;
        }).join('');

        root.innerHTML = `
          <div class="home-container">
            <div class="breadcrumb-nav">
              <a href="index.html" class="breadcrumb-link">
                <span>←</span> <span>Volver a Tus Desvaríos</span>
              </a>
            </div>

            <section class="hero-section">
              <div class="hero-badge">✨ Ficción Interactiva Ramificada</div>
              <h1 class="hero-title">Crea tus Desvaríos</h1>
              <p class="hero-description">
                Sumérgete en novelas interactivas donde tú eres el protagonista. Elige sabiamente:
                cada decisión forja tu destino entre múltiples caminos y finales.
              </p>
            </section>
            <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:1.25rem; padding-bottom:0.75rem; border-bottom:1px solid var(--border-subtle);">
              <h2 style="font-size:1.15rem; font-weight:600;">Aventuras Disponibles</h2>
              <span style="font-size:0.82rem; color:var(--text-muted);">${stories.length} relatos</span>
            </div>
            <div class="stories-grid">
              ${cardsHtml}
            </div>
          </div>
        `;
      },

      renderReader() {
        const root = document.getElementById('app-root');
        const node = this.currentStory.nodos[this.currentNodeId];
        if (!node) return;

        const isEnding = !!node.esFinal;
        const stepCount = this.historyTrail.length;
        const totalSteps = this.currentStory.totalNodosEstimados || 24;
        const percentage = isEnding ? 100 : Math.min(Math.round((stepCount / totalSteps) * 100), 95);
        const nodeImage = this.resolveImagePath(node.imagen || this.currentStory.portada);

        let optionsHtml = '';
        if (isEnding) {
          const endingType = node.tipo_final || 'neutro';
          let endingLabel = 'Final Neutro — Destino Oculto';
          if (endingType === 'bueno') endingLabel = 'Final Heroico — Victoria';
          if (endingType === 'malo') endingLabel = 'Final Trágico — Perdición';

          optionsHtml = `
            <div class="ending-banner ${endingType}">
              <div class="ending-pill ${endingType}">
                <span>${endingLabel}</span>
              </div>
              ${node.mensaje_final ? `<p class="ending-moral">&ldquo;${node.mensaje_final}&rdquo;</p>` : ''}
              <div class="ending-actions">
                <button class="btn-primary" onclick="app.restartStory()">↺ Jugar de nuevo (Explorar otros caminos)</button>
                <button class="btn-secondary" style="padding:0.75rem 1.4rem;" onclick="app.showCatalog()">📚 Volver al catálogo</button>
              </div>
              <div style="margin-top:1.5rem; padding-top:1.25rem; border-top:1px solid rgba(255,255,255,0.12); display:flex; flex-direction:column; align-items:center; gap:0.65rem; text-align:center;">
                <p style="font-size:0.88rem; color:var(--text-secondary); margin:0; max-width:480px; line-height:1.5;">
                  ☕ <strong>¿Has disfrutado de la aventura?</strong> Apoya este proyecto independiente invitando a un café al creador para inspirar nuevas tramas y misterios.
                </p>
                <a href="https://www.paypal.com/donate/?hosted_button_id=V8PZNYKGXBCLG&locale.x=es_ES"
                   target="_blank"
                   rel="noopener noreferrer"
                   class="btn-paypal-donate"
                   title="Invitar a un café con PayPal"
                   style="display:inline-flex; align-items:center; gap:0.5rem; padding:0.6rem 1.3rem; border-radius:9999px; background:linear-gradient(135deg, #f59e0b 0%, #d97706 100%); color:#0b0f19; font-weight:800; font-size:0.85rem; text-decoration:none; box-shadow:0 4px 16px rgba(245, 158, 11, 0.35); transition:all 0.2s ease;">
                  <span>☕ Invitar a un café</span>
                  <span>➜</span>
                </a>
              </div>
            </div>
          `;
        } else if (node.opciones && node.opciones.length > 0) {
          const buttons = node.opciones.map((opt, idx) => `
            <button class="decision-button" onclick="app.selectOption('${opt.destinoId}')">
              <div class="decision-button-content">
                ${opt.impacto ? `<span class="decision-badge">${opt.impacto}</span>` : ''}
                <span>${opt.texto}</span>
              </div>
              <span class="decision-arrow">➜</span>
            </button>
          `).join('');

          optionsHtml = `
            <div class="decisions-container">
              <div class="decisions-heading">
                <span>🧭 ¿Qué decides hacer?</span>
              </div>
              ${buttons}
            </div>
          `;
        }

        root.innerHTML = `
          <div class="reader-wrapper">
            <div class="reader-progress-container">
              <div style="display:flex; align-items:center; gap:0.5rem;">
                ${this.historyTrail.length > 1 && !isEnding ? `
                  <button class="btn-secondary" style="padding:0.3rem 0.6rem; font-size:0.78rem;" onclick="app.goBack()">
                    <span>←</span> <span>Atrás</span>
                  </button>
                ` : `
                  <span style="font-size:0.82rem; color:var(--text-muted);">🧭 Lectura</span>
                `}
              </div>
              <div class="progress-bar-track">
                <div class="progress-bar-fill" style="width: ${percentage}%;"></div>
              </div>
              <div style="display:flex; align-items:center; gap:0.6rem;">
                <span style="font-size:0.8rem; color:var(--text-muted);">
                  ${isEnding ? 'Final alcanzado' : `Nodo ${stepCount} de ~${totalSteps}`}
                </span>
                <button class="btn-secondary" style="padding:0.3rem 0.5rem; font-size:0.78rem;" title="Reiniciar" onclick="app.restartStory()">↺</button>
              </div>
            </div>

            <div class="reader-node-card">
              ${nodeImage ? `
                <div class="reader-image-container">
                  <img src="${nodeImage}" alt="${node.titulo || this.currentStory.titulo}" class="reader-image">
                  <div class="reader-image-gradient"></div>
                </div>
              ` : ''}

              <div class="reader-body">
                ${node.titulo ? `<h1 class="reader-node-title">${node.titulo}</h1>` : ''}
                <div class="reader-text">
                  ${this.formatText(node.texto)}
                </div>
                ${optionsHtml}
              </div>
            </div>
          </div>
        `;
      },

      fireConfetti() {
        const canvas = document.getElementById('confetti-canvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const pieces = [];
        const colors = ['#10b981', '#34d399', '#ffffff', '#f59e0b', '#fbbf24'];

        for (let i = 0; i < 70; i++) {
          pieces.push({
            x: canvas.width / 2,
            y: canvas.height * 0.6,
            vx: (Math.random() - 0.5) * 12,
            vy: (Math.random() - 0.8) * 14,
            size: Math.random() * 8 + 4,
            color: colors[Math.floor(Math.random() * colors.length)],
            rotation: Math.random() * 360,
            vRot: (Math.random() - 0.5) * 10
          });
        }

        let animationFrame;
        let count = 0;

        function update() {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          pieces.forEach(p => {
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.35;
            p.rotation += p.vRot;

            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate((p.rotation * Math.PI) / 180);
            ctx.fillStyle = p.color;
            ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
            ctx.restore();
          });

          count++;
          if (count < 140) {
            animationFrame = requestAnimationFrame(update);
          } else {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
          }
        }

        update();
      }
    };

    document.addEventListener('DOMContentLoaded', () => {
      app.init();
    });
  </script>
  <script src="js/cookie-banner.js"></script>
</body>
</html>
