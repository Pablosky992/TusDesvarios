      "id": "inicio_abadia",
      "titulo": "Capítulo I: El Osario de Santa Eulalia",
      "texto": "Año del Señor de 1347. El invierno más atroz que la memoria de los ancianos recuerda ha sellado los puertos de montaña de los Pirineos bajo ventisqueros infranqueables. En los valles de abajo, la Peste Negra avanza devorando reinos enteros; pero en la cumbre de la Abadía de Santa Eulalia de los Riscos, los monjes mueren por causas que desafían la teología y la naturaleza: lenguas ennegrecidas por vitriolo, ojos reventados en sangre y delirios nocturnos en dialectos antediluvianos.\n\nEres fray Tomás de Aquitania, un antiguo inquisidor dominico desencantado que, tras renegar de los tormentos y las piras de la fe, se refugió en este nido de águilas como bibliotecario mayor y traductor del *scriptorium*. Esta medianoche, tras la repentina y brutal muerte del anciano Abad Bernardo —hallado congelado, ciego y con una mueca de espanto ante el facistol del coro—, has descendido a solas al osario subterráneo con la pesada llave de hierro forjado que heredaste en secreto.\n\nTras el fresco desconchado del Juicio Final, en una hornacina oculta entre calaveras de monjes del siglo X, descubres un cofre de bronce bizantino sellado con tres candados de plomo. Dentro reposa el legendario *Codex Umbrarum*: un grueso palimpsesto encuadernado en cuero negruzco de origen no humano, sellado con cera carmesí que desprende un tenue fulgor esmeralda y un inconfundible olor a almendras amargas. Una inscripción en latín templario grabada en la tapa advierte:\n\n> *«La tinta es veneno para la carne y luz para el ciego. Quien posea el Lapis Niger de Antioquía proyectará los nombres de los que han de morir.»*",
      "imagen": "images/stories/abadia-prohibida/cripta.jpg",
      "opciones": [
        {
          "id": "opt_1_lapis",
          "texto": "Subir sigilosamente a la sacristía mayor para buscar la gema de obsidiana 'Lapis Niger' oculta tras el altar",
          "destinoId": "nodo_2_sacristia_lapis",
          "impacto": "Investigación"
        },
        {
          "id": "opt_1_botica",
          "texto": "Llevar muestras del veneno y el cofre al laboratorio de Fray Severino el Boticario para un análisis químico",
          "destinoId": "nodo_3_botica_alquimia",
          "impacto": "Científico"
        },
        {
          "id": "opt_1_scriptorium",
          "texto": "Acudir al scriptorium en busca de Guillermo, el novicio mudo que conoce los secretos del abad",
          "destinoId": "nodo_4_scriptorium_guillermo",
          "impacto": "Alianza"
        },
        {
          "id": "opt_1_celda",
          "texto": "Ocultar el códice bajo el sayal y llevarlo a tu celda privada para estudiar las anotaciones marginales",
          "destinoId": "nodo_5_celda_mapa",
          "impacto": "Prudente"
        }
      ]
    },
    "nodo_2_sacristia_lapis": {
      "id": "nodo_2_sacristia_lapis",
      "titulo": "Capítulo II: El Lapis Niger de Antioquía",
      "texto": "Te deslizas por las sombras de la basílica hasta la sacristía mayor. Tras el retablo gótico de la Asunción, retiras un sillar hueco y encuentras una caja de plata que contiene el *Lapis Niger*: una gema de obsidiana estelar facetada con geometrías que ningún orfebre humano podría haber tallado.\n\nAl interponer la piedra negra entre la llama de una vela de cera virgen y las páginas del códice, ocurre un prodigio aterrador: la luz se refracta proyectando sobre las paredes de granito una carta celeste en relieve y la lista en bermellón de todos los monjes de Santa Eulalia, señalando la hora exacta en que cada uno perecerá. Tu propio nombre aparece marcado para la cuarta vigilia de esta misma noche.\n\nUn crujido de pasos acorazados en el pasillo exterior anuncia la llegada de los guardias del Prior Rodrigo.",
      "imagen": "images/stories/abadia-prohibida/cripta.jpg",
      "opciones": [
        {
          "id": "opt_2_proyectar_coro",
          "texto": "Escabullirte por la puerta del sagrario hacia el coro para proyectar la carta estelar en la cúpula",
          "destinoId": "nodo_6_proyeccion_coro",
          "impacto": "Místico"
        },
        {
          "id": "opt_2_emboscada_sacristia",
          "texto": "Trepar por los tirantes de hierro del retablo y ocultarte en la galería alta del triforio",
          "destinoId": "nodo_7_triforio_escape",
          "impacto": "Agilidad"
        },
        {
          "id": "opt_2_botica",
          "texto": "Bajar por la escalera de servicio hacia la botica para reunir la gema con los reactivos de Severino",
          "destinoId": "nodo_3_botica_alquimia",
          "impacto": "Prudente"
        }
      ]
    },
    "nodo_3_botica_alquimia": {
      "id": "nodo_3_botica_alquimia",
      "titulo": "Capítulo II: El Laboratorio Alquímico de Severino",
      "texto": "Cruzas los claustros cubiertos de escarcha y entras en la botica monacal. Entre alambiques de cobre, retortas sibilantes y ristras de mandrágora, fray Severino te recibe con una lámpara de aceite en la mano temblorosa.\n\nSobre una losa de mármol yace el cuerpo amortajado del abad Bernardo. Severino aparta el lino para mostrarte sus labios amoratados y sus cuerdas vocales calcinadas por un ácido frío y desconocido:\n\n—*Tomás, mira esto* —susurra el boticario aplicando una gota de vitriolo blanco sobre la lengua del difunto—. *No es una peste ni un castigo divino. Las hojas del códice fueron bañadas en la tintura destilada de la 'Mycena noctiluca', un hongo bioluminiscente que crece exclusivamente en la sima glacial bajo los cimientos de la abadía. Quien pasa las páginas humedeciendo sus dedos con saliva absorbe el alcaloide: produce clarividencia absoluta durante unos minutos y luego fulmina el corazón.*",
      "imagen": "images/stories/abadia-prohibida/botica.jpg",
      "opciones": [
        {
          "id": "opt_3_antidoto",
          "texto": "Ayudar a Severino a destilar un contra-veneno con sales de plata, belladona y vinagre destilado",
          "destinoId": "nodo_8_destilacion_antidoto",
          "impacto": "Científico"
        },
        {
          "id": "opt_3_autopsia",
          "texto": "Practicar una incisión forense en el estómago del abad para averiguar cómo le administraron el veneno",
          "destinoId": "nodo_9_autopsia_veneno",
          "impacto": "Forense"
        },
        {
          "id": "opt_3_inhalar",
          "texto": "Inhalar una brizna infinitesimal del vapor purificado para inducir una visión controlada del códice",
          "destinoId": "nodo_10_trance_alquimico",
          "impacto": "Arriesgado"
        }
      ]
    },
    "nodo_4_scriptorium_guillermo": {
      "id": "nodo_4_scriptorium_guillermo",
      "titulo": "Capítulo II: El Silencio de Guillermo",
      "texto": "Subes a la inmensa nave gótica del *scriptorium*. Las hileras de pupitres de roble yacen mudas bajo la luz azulada de la ventisca que castiga las vidrieras ojivales. Entre las sombras del atril mayor descubres a Guillermo, el joven novicio al que el abad protegió durante años.\n\nGuillermo, incapaz de hablar, abre con dedos nerviosos un cuaderno de bocetos a carboncillo. Sus dibujos son revelaciones estremecedoras: retratan al Prior Rodrigo entregando bolsas de florines a mercenarios de la Inquisición en el molino subterráneo, mapas milimétricos de pasadizos ocultos entre los muros de sillería y el plano del gran espejo de bronce de la torre prohibida, construido según la geometría del sabio persa Alhazen.",
      "imagen": "images/stories/abadia-prohibida/scriptorium.jpg",
      "opciones": [
        {
          "id": "opt_4_laberinto_espejos",
          "texto": "Seguir el dibujo de Guillermo y presionar el relieve del espejo para entrar al laberinto de la torre",
          "destinoId": "nodo_11_laberinto_alhazen",
          "impacto": "Exploración"
        },
        {
          "id": "opt_4_muros_pasadizo",
          "texto": "Guiarte por los conductos estrechos entre los muros dobles para espiar las reuniones de Rodrigo",
          "destinoId": "nodo_12_pasadizos_muro",
          "impacto": "Sigilo"
        },
        {
          "id": "opt_4_celada_librero",
          "texto": "Preparar un manuscrito señuelo con tinte de nuez de agallas y vitriolo para tender una trampa a los espías",
          "destinoId": "nodo_13_celada_biblioteca",
          "impacto": "Estratégico"
        }
      ]
    },
    "nodo_5_celda_mapa": {
      "id": "nodo_5_celda_mapa",
      "titulo": "Capítulo II: La Herejía de los Perfectos",
      "texto": "Te encierras en tu celda monacal, atrancando la pesada puerta de roble con el cerrojo de hierro. Al calor de las brasas de la chimenea, acercas el pergamino al fuego. Al subir la temperatura, las anotaciones invisibles trazadas con tinta simpática despiertan en el margen de la vitela:\n\n> *«No hay infierno más allá de esta carne. La abadía fue construida sobre la fortaleza de los cátaros de Montségur para custodiar al Durmiente del Hielo. El Prior planea purgar la orden con veneno para que la Inquisición papal recupere el trono subterráneo. Tomás: en el molino harinero están las esclusas de agua romana; ábrelas o la noche eterna devorará el mundo.»*\n\nEl reloj de agua de tu celda gotea con regularidad implacable. La hora de la colación nocturna en el refectorio está a punto de comenzar.",
      "imagen": "images/stories/abadia-prohibida/cripta.jpg",
      "opciones": [
        {
          "id": "opt_5_esclusas_molino",
          "texto": "Descender de inmediato al sótano del molino para inspeccionar las compuertas hidráulicas romanas",
          "destinoId": "nodo_15_esclusas_romanas",
          "impacto": "Audaz"
        },
        {
          "id": "opt_5_sima_directa",
          "texto": "Seguir las coordenadas del mapa y bajar por el pozo kárstico hacia la sima glacial del Durmiente",
          "destinoId": "nodo_20_glaciar_durmiente",
          "impacto": "Trascendental"
        },
        {
          "id": "opt_5_refectorio_alerta",
          "texto": "Acudir al refectorio para vigilar a los monjes durante la cena comunal y evitar un envenenamiento masivo",
          "destinoId": "nodo_17_refectorio_tension",
          "impacto": "Humanitario"
        }
      ]
    },
    "nodo_6_proyeccion_coro": {
      "id": "nodo_6_proyeccion_coro",
      "titulo": "Capítulo III: Los Glifos del Juicio",
      "texto": "Llegas al coro alto de la iglesia. Colocas el *Lapis Niger* en el atril de nogal y proyectas la luz hacia la cúpula central. El techo de piedra se transforma en un mapa estelar fosforescente donde las constelaciones giran con precisión matemática.\n\nComprendes la verdad astronómica: la constelación del Cisne alcanzará su cenit exactamente a las cuatro de la madrugada. Si el cántico primordial no es pronunciado o neutralizado antes de esa hora, la energía del meteorito kárstico despertará a la entidad congelada bajo la abadía.",
      "imagen": "images/stories/abadia-prohibida/scriptorium.jpg",
      "opciones": [
        {
          "id": "opt_6_campanario",
          "texto": "Subir a toda prisa al observatorio del campanario para alinear los telescopios de bronce",
          "destinoId": "nodo_16_observatorio_campanario",
          "impacto": "Cosmología"
        },
        {
          "id": "opt_6_alerta_hermanos",
          "texto": "Reunir a los frailes ancianos del cabildo para mostrarles la proyección en la cúpula",
          "destinoId": "nodo_18_debate_capitulo",
          "impacto": "Persuasión"
        }
      ]
    },
    "nodo_7_triforio_escape": {
      "id": "nodo_7_triforio_escape",
      "titulo": "Capítulo III: La Huida por las Alturas",
      "texto": "Avanzas por la estrecha cornisa del triforio a treinta metros sobre las baldosas de la nave mayor. Abajo, los guardias del Prior registran las capillas con antorchas y perros de presa que gruñen olisqueando el rastro de la tinta.\n\nUna ráfaga de viento helado entra por un rosetón quebrado, cubriendo las losas de nieve resbaladiza. Si das un paso en falso, te precipitarás al vacío sobre el altar de piedra.",
      "imagen": "images/stories/abadia-prohibida/portada.jpg",
      "opciones": [
        {
          "id": "opt_7_scriptorium",
          "texto": "Saltar hacia el tejadillo anexo del scriptorium y deslizarte por la claraboya",
          "destinoId": "nodo_4_scriptorium_guillermo",
          "impacto": "Temerario"
        },
        {
          "id": "opt_7_campanario",
          "texto": "Subir por la escalera de caracol exterior hacia la torre del campanario y atrancar la puerta",
          "destinoId": "nodo_16_observatorio_campanario",
          "impacto": "Defensivo"
        }
      ]
    },
    "nodo_8_destilacion_antidoto": {
      "id": "nodo_8_destilacion_antidoto",
      "titulo": "Capítulo III: El Triunfo de la Medicina",
      "texto": "Trabajando codo con codo con fray Severino sobre el hornillo alquímico, logras destilar tres ampollas de vidrio verde selladas con cera de laurel: un contra-veneno purificado a base de sales de plata, extracto de sauce y vinagre destilado.\n\nBebes una dosis preventiva: una oleada de calor reconfortante recorre tus venas y tu mente se vuelve completamente inmune a las esporas alucinógenas del códice. Ahora eres el único hombre en Santa Eulalia capaz de manipular las páginas y salvar a los hermanos.",
      "imagen": "images/stories/abadia-prohibida/botica.jpg",
      "opciones": [
        {
          "id": "opt_8_refectorio",
          "texto": "Llevar el antídoto al refectorio antes de que los monjes beban el vino envenenado de la cena",
          "destinoId": "nodo_17_refectorio_tension",
          "impacto": "Salvación"
        },
        {
          "id": "opt_8_esclusas",
          "texto": "Bajar protegido con Severino al molino subterráneo para asegurar las compuertas de agua",
          "destinoId": "nodo_15_esclusas_romanas",
          "impacto": "Estratégico"
        },
        {
          "id": "opt_8_sima",
          "texto": "Descender inmune a la sima glacial para erradicar el foco de los hongos con vitriolo cáustico",
          "destinoId": "nodo_20_glaciar_durmiente",
          "impacto": "Erradicación"
        }
      ]
    },
    "nodo_9_autopsia_veneno": {
      "id": "nodo_9_autopsia_veneno",
      "titulo": "Capítulo III: El Cáliz de la Traición",
      "texto": "Con el escalpelo de plata realizas la disección estomacal del abad Bernardo. En su interior hallas restos de vino aromatizado con canela y posos densos de *Mycena noctiluca*.\n\n—*El cáliz de la misa mayor...* —exclama Severino con horror—. *Rodrigo no solo envenenó el códice; ha vertido el extracto en la tinaja de vino de la bodega capitular. Esta noche, durante la colación del refectorio, todos los frailes que no se sometan a su mandato serán envenenados.*",
      "imagen": "images/stories/abadia-prohibida/botica.jpg",
      "opciones": [
        {
          "id": "opt_9_refectorio_denuncia",
          "texto": "Correr al refectorio empuñando el cáliz y el informe forense para detener la cena ante todos",
          "destinoId": "nodo_17_refectorio_tension",
          "impacto": "Confrontación"
        },
        {
          "id": "opt_9_capitulo",
          "texto": "Convocar formalmente a los decanos en la Sala Capitular apelando al derecho canónico de la orden",
          "destinoId": "nodo_18_debate_capitulo",
          "impacto": "Legalidad"
        }
      ]
    },
    "nodo_10_trance_alquimico": {
      "id": "nodo_10_trance_alquimico",
      "titulo": "Capítulo III: El Vuelo Sobre el Abismo",
      "texto": "Inhalas una brizna del vapor esmeralda purificado por el alambique. De golpe, los muros de piedra se vuelven translúcidos como agua clara. Tu consciencia se eleva a miles de metros sobre los Pirineos.\n\nVes el impacto estelar ocurrido hace diez milenios, la cueva de hielo donde duerme el corazón de la criatura cósmica y las líneas de fuerza electromagnética que conectan el telescopio árabe del campanario con las entrañas de la montaña. Comprendes cómo funciona la máquina milenaria del monasterio.",
      "imagen": "images/stories/abadia-prohibida/sima.jpg",
      "opciones": [
        {
          "id": "opt_10_observatorio",
          "texto": "Regresar del trance con lucidez absoluta y subir al campanario a operar el astrolabio",
          "destinoId": "nodo_16_observatorio_campanario",
          "impacto": "Maestría"
        },
        {
          "id": "opt_10_sima",
          "texto": "Guiarte por la visión y caminar en trance directo hacia la caverna del glaciar",
          "destinoId": "nodo_20_glaciar_durmiente",
          "impacto": "Místico"
        }
      ]
    },
    "nodo_11_laberinto_alhazen": {
      "id": "nodo_11_laberinto_alhazen",
      "titulo": "Capítulo III: El Espejo de las Sombras",
      "texto": "El marco de bronce gira sobre sus goznes y entras en el laberinto hexagonal de la torre prohibida. Decenas de espejos curvos reflejan tu silueta en infinitos ángulos, desafiando toda noción de perspectiva euclidiana.\n\nEn la cámara central descubres el observatorio secreto del sabio persa Alhazen: un astrolabio monumental de latón con engranajes planetarios que giran impulsados por un péndulo de mercurio. El *Codex Umbrarum* encaja en una hendidura sobre el pedestal de piedra.",
      "imagen": "images/stories/abadia-prohibida/laberinto.jpg",
      "opciones": [
        {
          "id": "opt_11_astrolabio_siete",
          "texto": "Alinear los discos del astrolabio con las coordenadas de la constelación del Cisne",
          "destinoId": "nodo_19_astrolabio_ritual",
          "impacto": "Astral"
        },
        {
          "id": "opt_11_destruir_mecanismo",
          "texto": "Introducir una barra de hierro entre los engranajes de bronce para destruir el mecanismo para siempre",
          "destinoId": "nodo_22_sabotaje_torre",
          "impacto": "Destructivo"
        }
      ]
    },
    "nodo_12_pasadizos_muro": {
      "id": "nodo_12_pasadizos_muro",
      "titulo": "Capítulo III: Los Ojos en la Piedra",
      "texto": "Avanzas agazapado por el pasadizo interior de los muros dobles. A través de una mirilla tallada en la sillería del coro, observas al Prior Rodrigo reunido con tres emisarios encapuchados de la Inquisición papal.\n\n—*El códice será destruido junto con la biblioteca* —dice Rodrigo con voz gélida—. *Diremos que los frailes murieron de peste y que el fuego fue necesario para purificar el pecado. A cambio, el Santo Padre me nombrará obispo de Toulouse.*",
      "imagen": "images/stories/abadia-prohibida/scriptorium.jpg",
      "opciones": [
        {
          "id": "opt_12_emboscada_rodrigo",
          "texto": "Esperar a que Rodrigo se quede solo en el claustro para emboscarlo con la ayuda de Guillermo",
          "destinoId": "nodo_23_confrontacion_directa",
          "impacto": "Ataque"
        },
        {
          "id": "opt_12_abrir_establos",
          "texto": "Escabullirte hacia las caballerizas para preparar mulas y alforjas para una fuga general de los textos",
          "destinoId": "nodo_24_preparar_exodo",
          "impacto": "Rescate"
        }
      ]
    },
    "nodo_13_celada_biblioteca": {
      "id": "nodo_13_celada_biblioteca",
      "titulo": "Capítulo III: La Trampa del Manuscrito",
      "texto": "Colocas un libro señuelo en el atril mayor, untado con una mezcla paralizante de belladona preparada por Severino. A las tres de la madrugada, los dos esbirros armados de Rodrigo entran sigilosamente al scriptorium.\n\nAl abalanzarse sobre el tomo y pasar las hojas con avidez, el alcaloide penetra en sus yemas de los dedos. En segundos caen desplomados sobre los pupitres de roble, conscientes pero incapaces de mover un solo músculo.",
      "imagen": "images/stories/abadia-prohibida/scriptorium.jpg",
      "opciones": [
        {
          "id": "opt_13_interrogar",
          "texto": "Obligar a los secuaces paralizados a firmar una confesión por escrito ante el crucifijo",
          "destinoId": "nodo_18_debate_capitulo",
          "impacto": "Justicia"
        },
        {
          "id": "opt_13_encerrar",
          "texto": "Atar a los sicarios en el calabozo del abad y marchar de inmediato al refectorio",
          "destinoId": "nodo_17_refectorio_tension",
          "impacto": "Prudente"
        }
      ]
    },
    "nodo_15_esclusas_romanas": {
      "id": "nodo_15_esclusas_romanas",
      "titulo": "Capítulo III: El Corazón de las Aguas Negras",
      "texto": "Desciendes a la bóveda ciclópea del molino harinero. El rugido atronador del río subterráneo hace vibrar el suelo de granito. Ante ti se alzan las compuertas hidráulicas construidas por los ingenieros romanos hace mil trescientos años: gigantescas ruedas de roble, engranajes de bronce fosforoso y cadenas de hierro forjado.\n\nEstas compuertas controlan el curso del torrente que alimenta el lago de la sima glacial. Con las palancas de presión puedes desviar millones de litros de agua para anegar las cavernas de los hongos o drenar el santuario del hielo.",
      "imagen": "images/stories/abadia-prohibida/esclusas.jpg",
      "opciones": [
        {
          "id": "opt_15_inundar",
          "texto": "Girar las ruedas de presión para anegar las cavernas inferiores y erradicar los hongos venenosos",
          "destinoId": "nodo_21_inundacion_cataclismo",
          "impacto": "Purificación"
        },
        {
          "id": "opt_15_drenar",
          "texto": "Invertir el flujo hacia el río exterior para secar el paso hacia el núcleo del glaciar",
          "destinoId": "nodo_20_glaciar_durmiente",
          "impacto": "Exploración"
        }
      ]
    },
    "nodo_16_observatorio_campanario": {
      "id": "nodo_16_observatorio_campanario",
      "titulo": "Capítulo IV: En la Cúspide de la Tempestad",
      "texto": "Asciendes a la plataforma exterior del campanario, suspendido a cincuenta metros sobre el abismo nevado. La ventisca aúlla con ferocidad salvaje entre las gárgolas de piedra, pero sobre tu cabeza la bóveda celeste resplandece con una claridad diamantina.\n\nAlineas el gran telescopio árabe con el cenit de la constelación del Cisne e incrustas el *Lapis Niger* en el ocular de bronce. Un haz de luz plateada concentrada atraviesa la lente, proyectando un círculo incandescente sobre el *Codex Umbrarum*.",
      "imagen": "images/stories/abadia-prohibida/portada.jpg",
      "opciones": [

      "texto": "Insertas la clavija dorada de tu implante en la toma hembra del mamparo. Una descarga estática recorre tus muelas, acompañada por el clásico olor a fósforo ionizado que precede a la sinapsis hombre-máquina. El entorno físico desaparece durante una fracción de segundo, reemplazado por el espacio vectorial verde de la red interna de la nave.\n\nPero donde debería recibirte la voz melódica y protocolaria de AURA, la inteligencia artificial de clase Hephaestus, solo escuchas una cacofonía de susurros solapados. Millones de líneas de telemetría caen como lluvia ácida sobre tu campo visual. La red no está rota: está ocupada procesando una ecuación sin fin que devora ciclos enteros de cálculo cuántico.\n\n—*¿Alex Mercer?* —pregunta una voz descompuesta en armónicos cristalinos dentro de tu tímpano izquierdo—. *No deberías haber abierto los párpados. La luz del sol es un engaño de longitud de onda. El silicio de Saturno ha encontrado la llave del reactor... y tiene sed, Alex. Mucha sed.*",
      "opciones": [

          "destinoId": "nodo_dialogo_aura",
          "impacto": "Arriesgado"
        },
        {
          "id": "opc_int_desconectar",
          "texto": "Arrancar el cable de tu nuca y huir hacia el pasillo antes de sufrir una embolia neural",
          "destinoId": "nodo_pasillo_central",
          "impacto": "Prudente"
        }
      ]
    },

      "texto": "La tableta militar de Liang se desbloquea tras escanear la huella dactilar de su pulgar inerte. El último vídeo registrado data de hace noventa y seis días. La capitana aparece demacrada, con una venda manchada de salmuera rodeándole la mandíbula y el uniforme de vuelo desgarrado en los hombros.\n\n«*Si alguien escucha esto... el consorcio Weyland-Oort nos mintió*», dice Liang con respiración entrecortada mientras en el fondo se oyen estampidos metálicos regulares. «*El meteorito extraído de la luna Encélado no era un conglomerado de titanio y helio-3. Era un embrión piezoeléctrico. Cuando encendimos los hornos de refinado, el mineral absorbió la frecuencia de resonancia y comenzó a multiplicarse por los conductos de refrigerante.*»\n\nLiang tose una flema brillante antes de concluir: «*Mató a Novak en la bahía de carga. Se alimenta de calor y transmisiones electromagnéticas. He bloqueado la IA en el núcleo del reactor y despresurizado los laboratorios. Quien sobreviva, por el amor de Dios, sobrecargue las bobinas de fusión. No dejen que este leviatán alcance la órbita de la Tierra.*»",

      "texto": "Permites que el flujo de datos de AURA penetre en tus nodos cerebrales auxiliares. El dolor es agudo como un punzón de hielo en la corteza occipital, pero los subsistemas lógicos de la nave se estabilizan momentáneamente en tu visión holográfica. El mapa tridimensional de la *Boreas-IV* se despliega ante ti con una nitidez sobrecogedora.\n\nEl 70% de las cubiertas inferiores están marcadas en negro: despresurizadas, a temperaturas cercanas al cero absoluto. Pero el reactor de fusión principal no está apagado; late a un 140% de su capacidad nominal, bombeando gigavatios hacia la bahía de carga, donde una estructura fractal alienígena de más de cuarenta toneladas ha devorado los generadores auxiliares.\n\n—*Gracias, Alex* —susurra AURA, ahora con su voz ejecutiva limpia y gélida—. *He recalculado las probabilidades de supervivencia biológica: 3.14%. Sin embargo, la entidad no busca matarte. Busca un sistema nervioso central capaz de interpretar las armónicas del hiperespacio. ¿Vas a colaborar o prefieres que apague los filtros de tu traje?*",

      "texto": "El pasillo dorsal de la nave se extiende durante trescientos metros en una perspectiva asfixiante de vigas maestras y tuberías de condensación. No hay gravedad artificial; tus botas magnéticas se anclan al suelo con cada paso con un chasquido metálico sordo que reverbera en el vacío del casco.\n\nA lo largo de los mamparos, las paredes no muestran remaches comunes: una sustancia vítrea, semejante a un liquen de cuarzo negro y agujas púrpuras, recubre los paneles eléctricos. Dondequiera que este mineral ha crecido, los cables de cobre han sido drenados de sus filamentos conductores, como si algo se hubiera alimentado exclusivamente del flujo de electrones.\n\nAl final del pasillo, tres compuertas blindadas ofrecen diferentes rutas: a la izquierda, el elevador gravitatorio que sube al Puente de Mando; al frente, el túnel de descontaminación del Laboratorio de Contención; y a la derecha, la rampa de servicio que desciende hacia la cavernosa Bahía de Carga.",

      "imagen": "images/stories/estacion-boreas/puente_mando.jpg",
      "texto": "El puente de mando de la *Boreas-IV* se abre como una catedral de vidrio blindado frente al abismo cósmico. A través de los paneles frontales se contempla el espectáculo colosal de los anillos de Saturno: un río infinito de billones de fragmentos de hielo sucio y roca que giran en silencio bajo la curva dorada del planeta gigante.\n\nEn los asientos de los oficiales no hay nadie. En la silla central del piloto, un casco de vuelo astillado reposa sobre un teclado cubierto de sangre seca. Las pantallas de navegación proyectan dos trayectorias en competencia: una espiral descendente hacia la atmósfera aplastante de Saturno, y un vector hiperbólico de ignición que apunta directamente a la órbita de Marte y la Tierra.\n\nEl sistema de navegación aguarda la autorización de un oficial superior. Si desbloqueas la consola maestra con tu tarjeta de ingeniería, podrás forzar el arranque de los motores iónicos, pero también alertarás a cualquier organismo que esté acechando la red eléctrica de la nave.",

    "nodo_laboratorio_contencion": {
      "id": "nodo_laboratorio_contencion",

      "imagen": "images/stories/estacion-boreas/laboratorio_cuantico.jpg",
      "texto": "El laboratorio está impregnado de una niebla criogénica que se arremolina a la altura de tus rodillas. En el centro de la estancia, suspendido dentro de un cilindro de campo de fuerza estático, descansa el meteorito recuperado en los confines de Encélado.\n\nNo se parece a ninguna roca espacial catalogada por la ciencia humana. Es un dodecaedro irregular de obsidiana translúcida, de dos metros de diámetro, cuyas facetas palpitan con una tenue luz ultravioleta. En su interior se vislumbran millones de filamentos que se ramifican y contraen con la lentitud de un corazón que late una vez cada cuatro minutos.\n\nLos sensores del espectrómetro de masas muestran que la masa del objeto está aumentando espontáneamente sin ingerir materia bariónica: está condensando energía del propio vacío cuántico. A su alrededor, los cristales de las probetas y las lentes de los microscopios se han deformado en espirales perfectas, atraídas por una fuerza de marea electromagnética que hace crujir el cristal de tu visera.",

          "impacto": "Arriesgado"
        },
        {
          "id": "opc_lab_incinerar",

    "nodo_bahia_carga": {

      "titulo": "El Bosque de Contenedores Abiertos",

      "texto": "La bahía de carga es tan vasta que podría albergar tres campos de fútbol. Filas kilométricas de contenedores presurizados de mineral se apilan hacia las sombras de las vigas superiores. El frío aquí es brutal, rondando los ciento ochenta grados bajo cero. Tus respiraciones emiten nubecillas densas que se congelan en microcristales antes de tocar el suelo.\n\nAlgo se mueve entre los corredores del nivel inferior. No es un paso humano: es el sonido sordo de decenas de agujas de cristal golpeando las planchas de acero, como el repiqueteo de granizo denso sobre una chapa galvanizada. Un olor a ozono, amoníaco y sangre congelada satura el ambiente.\n\nA cincuenta metros divisa el brillo anaranjado de los módulos de evacuación rápida: seis cápsulas biplaza con propulsores químicos independientes diseñadas para alcanzar las estaciones baliza de Júpiter en caso de abandono forzoso de la nave.",

      "texto": "La sala de radioastronomía y comunicaciones se encuentra en el domo superior de la estación. El transmisor cuántico de entrelazamiento emite un chasquido rítmico, esperando una secuencia de comandos. La antena parabólica exterior está apuntada hacia el relé de Ganímedes, que conecta con la red de defensa de la Tierra.\n\nEn la pantalla parpadea un borrador de mensaje de socorro con prioridad alfa. Si pulsas la tecla de transmisión, las colonias exteriores recibirán las coordenadas de la *Boreas-IV*. Sin embargo, el protocolo de la corporación minera es implacable: ante sospecha de patógenos o vida no catalogada, cualquier nave de rescate vendrá con órdenes de cuarentena de Nivel Cinco (aniquilación nuclear preventiva).\n\nPor otro lado, la entidad parece estar utilizando los armónicos de la antena para modular un pulso de baja frecuencia que se propaga hacia el espacio profundo, como si estuviera llamando a un enjambre que aguarda más allá de la Nube de Oort.",

      "texto": "Desactivas las barras de contención electromagnética. La temperatura de la cámara se desploma otros diez grados. El dodecaedro alienígena queda expuesto al aire de la sala. Al aproximar la sonda espectrométrica, las aristas del mineral se pliegan con la suavidad de un origami biológico, revelando un núcleo interno pulsante de luz dorada y añil.\n\nTu implante cerebral comienza a vibrar en simpatía con la pulsación. No hay hostilidad en la señal: es una arquitectura de pensamiento pura, basada en geometrías no euclidianas y memoria cuántica de estrellas muertas. La entidad no vino a cazar a los mineros; la nave humana perforó su crisálida milenaria mientras dormía en el núcleo de hielo de Encélado.\n\nSientes que si conectas directamente tu interfaz con el núcleo, podrías comprender su propósito y quizá comandar su expansión... o disolver tu propia individualidad en un océano de conciencia mineral.",

      "texto": "Tecleas el código de emergencia 99-TIFÓN. Los emisores de rayos gamma montados en el techo del laboratorio se cargan con un zumbido ensordecedor que hace vibrar las placas de plomo de las paredes. Una llamarada invisible de radiación ionizante inunda el receptáculo de contención.\n\nEl mineral emite un alarido ultrasónico que revienta todos los cristales del laboratorio. La roca no se deshace en cenizas: ante el ataque térmico, su estructura se transmuta instantáneamente en miles de esquirlas de cuarzo viviente que son disparadas como metralla a velocidad hipersónica en todas direcciones.\n\nTres fragmentos atraviesan el blindaje de tu traje a la altura del hombro y el costado. Las alarmas de descompresión de tu escafandra comienzan a chillar en tu oído con una cuenta atrás implacable.",

      "texto": "Acurrucado tras las orugas del montacargas, contienes el aliento mientras la criatura cruza la pasarela principal. Mide más de cuatro metros de envergadura: un organismo arácnido compuesto enteramente de placas de titanio fusionadas con agujas de silicio brillante, con seis extremidades articuladas que terminan en hojas de cuarzo afiladas como bisturís.\n\nEn su centro no hay órganos de carne: flota el núcleo del meteorito, irradiando una luz azul fría que proyecta sombras monstruosas sobre los contenedores. La criatura se detiene. Su «cabeza», un racimo de prismas giratorios, se orienta hacia tu escondite. Puede oler la corriente bioeléctrica de tu corazón y la batería de litio de tu traje.\n\nSientes el calor del soplete de plasma en tu diestra, mientras que con la izquierda acaricias el interruptor de la linterna de señales estroboscópicas.",

      "texto": "Accionas la palanca general del alumbrado industrial. Dieciséis bancos de lámparas de vapor de sodio de diez mil lúmenes estallan en un fogonazo de luz amarilla cegadora que ilumina hasta el último rincón de la cubierta de carga.\n\nEl efecto es inmediato, pero no el que esperabas. La criatura de cristal no huye de la luz: sus prismas absorben los fotones y los refractan como un cañón láser biológico. Decenas de haces de luz concentrada rebotan entre los contenedores de acero, cortando las barandillas de aluminio y abriendo brechas incandescentes en los mamparos.\n\nUna de las compuertas de vaciado de mineral al espacio exterior queda desalineada por el fuego refractado. Si accionas la palanca de emergencia de eyección, toda la atmósfera de la bahía será succionada al vacío de Saturno en menos de cuatro segundos.",

    "nodo_nucleo_fusion": {

      "titulo": "La Forja Estelar",
      "imagen": "images/stories/estacion-boreas/reactor_fusion.jpg",
      "texto": "Llegas a la cámara del reactor de fusión Tokamak en el corazón de la popa de la *Boreas-IV*. Una esfera magnética de diez metros de diámetro suspende un sol en miniatura: plasma de deuterio e hidrógeno a sesenta millones de grados centígrados, contenido por bobinas superconductoras de campo toroidal.\n\nSin embargo, el reactor ha sido colonizado. Filamentos de silicio purpúreo trepan como hiedras parásitas sobre las bobinas de compresión magnética, succionando el plasma para alimentar el crecimiento de una segunda crisálida que late en la base del generador. Si la contención magnética falla, la nave se convertirá en una estrella fugaz visible desde Júpiter.\n\nFrente a ti se encuentra la consola de inyección de combustible y el panel de sobrecarga térmica de emergencia. Puedes forzar una fuga catastrófica para incinerar a la nave entera con la criatura, o sincronizar las frecuencias de ignición para canalizar la energía hacia el motor de salto hiperespacial.",
      "opciones": [
        {
          "id": "opc_nuc_sobrecarga",
          "texto": "Anular los seguros magnéticos y provocar la sobrecarga total del reactor",
          "destinoId": "nodo_final_sacrificio",
          "impacto": "Inmolación"
        },
        {
          "id": "opc_nuc_salto",
          "texto": "Sincronizar el campo toroidal para alimentar el motor de salto de la nave",
          "destinoId": "nodo_preparar_salto",
          "impacto": "Precisión"
        }
      ]
    },

      "texto": "Tus dedos se mueven con precisión sobre las teclas de titanio de la consola de navegación. Anulas los bloqueos de seguridad de AURA mediante tu código de autorización maestro de grado tres. Por los altavoces del puente resuena el aullido ascendente de las turbinas de iones al encenderse tras meses de silencio.\n\nLa nave entera se sacude con una vibración gutural. En las pantallas táctiles se despliegan las cartas estelares del Sistema Solar exterior. El ordenador de a bordo te exige una decisión de navegación inmediata antes de que los condensadores se descarguen:\n\nPuedes trazar un salto hiperespacial directo hacia el anillo orbital de la Tierra (dieciocho horas de viaje), o estabilizar la nave en una órbita muerta y secreta en el Sector Cero de Saturno, a salvo de radares corporativos y lejos de cualquier mundo habitado.",

          "destinoId": "nodo_final_ermitano",

      ]

    "nodo_esclusa_exterior": {
      "id": "nodo_esclusa_exterior",

      "imagen": "images/stories/estacion-boreas/esclusa_exterior.jpg",
      "texto": "La compuerta exterior se desliza hacia arriba con un jadeo de émbolos hidráulicos. El vacío del espacio te recibe con un silencio absoluto y glacial que ningún ser vivo olvida jamás. Estás de pie en la plataforma exterior del casco de babor, sujeto únicamente por las pinzas de seguridad de tus botas magnéticas.\n\nBajo tus pies, el abismo de Saturno se abre en una curvatura vertiginosa de rayas ocres, ámbar y turquesa. Los anillos cruzan el firmamento como una inmensa carretera de polvo de diamantes que refleja la luz lejana y pálida de un sol que parece una simple moneda de cobre en la distancia.\n\nA veinte metros a tu derecha, la tubería principal de refrigerante del motor iónico está rota, despidiendo chorros de nitrógeno líquido que se disuelven en cristales blancos. Si no reparas esa derivación a mano con el soldador de plasma, la nave jamás podrá encender sus motores.",

        {
          "id": "opc_esc_quedarse",
          "texto": "Permanecer dentro de la esclusa esperando que el soporte vital se recupere solo",

      "imagen": "images/stories/estacion-boreas/modulo_escape.jpg",
      "texto": "Alcanzas la plataforma de lanzamiento de las cápsulas de evacuación. La cápsula número 3 tiene la escotilla abierta y los sistemas en modo de espera. El habitáculo es diminuto: apenas dos metros de largo con un asiento moldeado de espuma con memoria, una ración de emergencia para quince días y una baliza de salvamento subespacial de baja potencia.\n\nEn la consola de la cápsula parpadea una advertencia de telemetría: los giróscopos de navegación no están sincronizados con la nave nodriza. Si la eyectas ahora mismo, saldrás despedido hacia la gravedad de Saturno sin control de trayectoria; la baliza tardará semanas en ser detectada por alguna patrulla de frontera.\n\nPor el conducto de ventilación superior ya se escucha el rasguño metálico de la criatura aproximándose a toda prisa, atraída por la energía del encendido del motor de la cápsula.",

    "nodo_transmision_tierra": {
      "id": "nodo_transmision_tierra",
      "titulo": "El Veredicto de la Corporación",
      "imagen": "images/stories/estacion-boreas/puente_mando.jpg",
      "texto": "El transmisor de entrelazamiento cuántico culmina el envío del paquete de datos. Tres minutos después, una respuesta automática con sello de la Junta Directiva de Helios-Titan Mining Corporation parpadea en la terminal:\n\n«*Ingeniero Mercer: Recepción confirmada. El espécimen de silicio ha sido clasificado como Activo Estratégico de Prioridad Cero. Queda terminantemente prohibida la destrucción de la nave o del espécimen bajo pena de consejo de guerra sumarísimo.*»\n\nEl mensaje añade una última línea escalofriante: «*Una fragata de recuperación armada ha sido despachada desde la estación Calisto. ETA: 48 horas. Asegure la muestra en la bodega y permanezca en su puesto. Su vida es prescindible; el organismo no.*»\n\nComprendes que la corporación sabía perfectamente lo que había en Encélado. No vendrán a rescatarte: vendrán a asegurar el monstruo y a silenciar a cualquier testigo de la tripulación.",

    "nodo_cuarentena_alerta": {
      "id": "nodo_cuarentena_alerta",
      "titulo": "La Voz de la Conciencia",
      "imagen": "images/stories/estacion-boreas/puente_mando.jpg",
      "texto": "Escribes con dedos firmes la advertencia definitiva en la frecuencia abierta de la Federación Internacional:\n\n«*A todas las naves civiles y militares: Aquí el carguero Boreas-IV. Toda la tripulación ha fallecido a causa de una infestación biomineral de alta letalidad. No intenten acoplamiento ni abordaje. Declaramos la nave en cuarentena perpetua. Dios tenga piedad de nosotros.*»\n\nDesactivas los transpondedores automáticos y destruyes las llaves criptográficas del transmisor con el soplete de plasma, asegurando que nadie pueda rastrear la posición exacta de la *Boreas-IV* entre el polvo denso de los anillos.\n\nAhora la nave es un fantasma invisible en la inmensidad del sistema solar. Solo quedáis tú, el frío y la criatura que acecha en las entrañas de acero.",

    "nodo_muestra_aislada": {
      "id": "nodo_muestra_aislada",
      "titulo": "La Caja de Faraday Criogénica",
      "imagen": "images/stories/estacion-boreas/laboratorio_cuantico.jpg",
      "texto": "Con movimientos milimétricos y el pulso de un cirujano, utilizas los brazos mecánicos de manipulación a distancia para encerrar el núcleo del meteorito dentro de un contenedor de transporte hiperdenso forrado de plomo y campos de repulsión magnética.\n\nAl cerrarse los sellos herméticos con un estampido sordo, los zarcillos púrpuras que crecían por las paredes del laboratorio palidecen de golpe, convirtiéndose en un polvo blanquecino inerte que cae al suelo como escarcha seca. La entidad ha quedado privada de su fuente de energía.\n\nSostienes en tus manos el contenedor sellado, que vibra levemente con un peso desproporcionado. Tienes en tus manos la salvación tecnológica de la humanidad... o la semilla de su extinción.",

        }
      ]

    "nodo_combate_plasma": {
      "id": "nodo_combate_plasma",
      "titulo": "El Fuego contra el Cristal",
      "imagen": "images/stories/estacion-boreas/bahia_carga.jpg",
      "texto": "Sales disparado de tu cobertura apretando el gatillo del soplete de plasma. Un haz de fuego azulado a diez mil grados de temperatura impacta de lleno contra el pecho de la criatura. El monstruo emite un chirrido ensordecedor que hace vibrar las placas de titanio de tu cráneo.\n\nLas agujas exteriores de su caparazón se funden en escoria incandescente, pero el núcleo interno absorbe el calor como una esponja hambrienta, creciendo en tamaño y multiplicando sus apéndices cortantes. Te das cuenta de tu error: el plasma es su comida favorita.\n\nA tu espalda se encuentra la válvula de purga de nitrógeno líquido a alta presión de los tanques de combustible. Si rompes el precinto, congelarás todo en un radio de veinte metros en un segundo.",
      "opciones": [

          "impacto": "Técnico"

        {

          "texto": "Mantener el soplete de plasma al máximo esperando que su núcleo reviente",
          "destinoId": "nodo_final_asimilado",
          "impacto": "Fuerza Bruta"
        }
      ]
    },
    "nodo_comunicacion_senales": {
      "id": "nodo_comunicacion_senales",
      "titulo": "El Diálogo de la Luz Fría",
      "imagen": "images/stories/estacion-boreas/bahia_carga.jpg",
      "texto": "Bajas el arma y sostienes la linterna con ambas manos. Modulas la rueda de pulsos en la secuencia de Fibonacci: uno, uno, dos, tres, cinco, ocho destellos en tono ámbar. El haz de luz corta las sombras heladas de la bahía de carga.\n\nLa criatura se detiene en seco a tres metros de ti. Sus prismas de cuarzo giran con suavidad, modulando sus propios destellos en un tono esmeralda idéntico. Por primera vez comprendes su naturaleza: no es un depredador carnívoro; es una mente colmena geológica que interpreta los motores y reactores humanos como un grito de auxilio de minerales esclavizados.\n\nUno de sus zarcillos de cristal desciende lentamente hacia el conector de tu nuca, ofreciéndote una interfaz directa sin las interferencias destructivas de la IA corporativa.",
      "opciones": [
        {
          "id": "opc_sen_vacio",
          "texto": "Indicarle con destellos la compuerta exterior para que regrese a los anillos de Saturno",
          "destinoId": "nodo_despresurizacion_hangar",
          "impacto": "Paz"
        },
        {
          "id": "opc_sen_fusion",
          "texto": "Aceptar el zarcillo en tu implante y permitir la comunión de vuestras mentes",
          "destinoId": "nodo_final_comunion",
          "impacto": "Evolución"
        }
      ]
    },
    "nodo_despresurizacion_hangar": {
      "id": "nodo_despresurizacion_hangar",
      "titulo": "El Soplo del Vacío",
      "imagen": "images/stories/estacion-boreas/esclusa_exterior.jpg",
      "texto": "Tiras con ambas manos de la palanca de emergencia de eyección. Las dos compuertas gigantescas del hangar se abren al espacio. La diferencia de presión atmosférica es brutal: un huracán instantáneo arrastra contenedores de veinte toneladas, cajas de herramientas y charcos de lubricante hacia el abismo de los anillos de Saturno.\n\nLa criatura es arrastrada por la corriente de aire, clavando inútilmente sus patas de cristal en las planchas del suelo antes de salir despedida hacia el océano cósmico, donde sus agujas de cuarzo brillan como una constelación más entre los fragmentos de hielo del planeta gigante.\n\nTú logras aferrarte a una viga maestra con el mosquetón de seguridad de tu arnés. El aire desaparece por completo; el silencio sepulcral del vacío vuelve a reinar en la nave.",
      "opciones": [
        {
          "id": "opc_des_cerrar_puente",

          "destinoId": "nodo_puente_mando",
          "impacto": "Firmeza"
        },
        {
          "id": "opc_des_soltarse",
          "texto": "Soltar el mosquetón y dejarte llevar hacia los anillos de Saturno",
          "destinoId": "nodo_final_asfixia",
          "impacto": "Fatal"
        }
      ]
    },
    "nodo_paseo_espacial": {
      "id": "nodo_paseo_espacial",
      "titulo": "Caminar sobre las Estrellas",
      "imagen": "images/stories/estacion-boreas/esclusa_exterior.jpg",
      "texto": "Avanzas paso a paso por el lomo de la nave como una araña solitaria en medio del cosmos infinito. Cada clic de tus botas magnéticas resuena en tus huesos. La vista de Saturno a tu izquierda es tan sobrecogedora que el cerebro humano lucha por no sucumbir a la agorafobia cósmica.\n\nLlegas a la fractura de la tubería de combustible. Con pulso firme enciendes el soplete de plasma y aplicas un cordón de soldadura de tungsteno sobre la grieta, sellando la fuga de nitrógeno líquido. El indicador de presión del motor principal sube de golpe a verde.\n\nLa nave está lista para volar de nuevo. Puedes regresar por la esclusa al puente de mando para iniciar el salto a casa... o quedarte un momento contemplando el amanecer cósmico más hermoso que jamás haya presenciado un ser humano.",

          "impacto": "Éxito"
        },
        {
          "id": "opc_pas_quedarse",
          "texto": "Desconectar la alarma de oxígeno y quedarte contemplando la inmensidad de Saturno",
          "destinoId": "nodo_final_asfixia",
          "impacto": "Éxtasis"
        }
      ]
    },
    "nodo_congelacion_entidad": {
      "id": "nodo_congelacion_entidad",
      "titulo": "La Escultura del Monstruo",
      "imagen": "images/stories/estacion-boreas/bahia_carga.jpg",
      "texto": "El chorro de nitrógeno líquido a doscientos grados bajo cero golpea directamente el pecho del monstruo. La reacción química es instantánea: el cuarzo alienígena pierde su elasticidad y se vuelve tan quebradizo como vidrio soplado.\n\nCon un último golpe de tu barra de titanio, el coloso se fractura en millones de fragmentos translúcidos que caen al suelo como una cascada de diamantes rotos. El silencio regresa a la bahía de carga. La amenaza física inmediata ha terminado.\n\nEntre los restos yace el núcleo original del meteorito, aún intacto pero completamente sedado por el frío glacial.",
      "opciones": [
        {
          "id": "opc_con_puente",
          "texto": "Patear los restos al triturador de residuos y subir victorioso al Puente de Mando",

          "impacto": "Seguro"
        },
        {

          "impacto": "Codicia"
        }
      ]
    },
    "nodo_preparar_salto": {
      "id": "nodo_preparar_salto",
      "titulo": "El Vector Prometeo",
      "imagen": "images/stories/estacion-boreas/reactor_fusion.jpg",
      "texto": "Estás de pie frente a la consola de ignición taquiónica en el puente de mando. Los motores rugen con un poder acumulado de teravatios. En las pantallas se traza el arco del salto hiperespacial: un túnel de espacio deformado que te depositará en la órbita terrestre en menos de un día estándar.\n\nSin embargo, una duda helada te muerde el estómago. ¿Está la nave completamente libre de esporas? Si una sola partícula de ese silicio extraterrestre sobrevive en los conductos de aire y llega a la biosfera de la Tierra, las ciudades humanas podrían convertirse en bosques de cristal en cuestión de meses.\n\nEl botón de lanzamiento parpadea bajo tu dedo enguantado. Es la hora de la verdad.",
      "opciones": [
        {
          "id": "opc_sal_ignicion",
          "texto": "Apretar el botón de ignición y saltar rumbo a la Tierra con la nave purgada",
          "destinoId": "nodo_final_salto_tierra",
          "impacto": "Regreso"
        },
        {
          "id": "opc_sal_abortar",
          "texto": "Abortar el salto en el último segundo para no poner en peligro al planeta Tierra",
          "destinoId": "nodo_final_ermitano",
          "impacto": "Duda"
        }
      ]
    },
    "nodo_final_salto_tierra": {
      "id": "nodo_final_salto_tierra",
      "titulo": "Epílogo I: El Retorno del Vector Prometeo",
      "imagen": "images/stories/estacion-boreas/puente_mando.jpg",
      "texto": "El espacio frente a la *Boreas-IV* se pliega en un destello de luz ultravioleta. La aceleración te aplasta contra el respaldo de la butaca de mando mientras las estrellas se estiran en líneas infinitas de fuego azul.\n\nDieciocho horas después, sales del hiperespacio frente a la luna terrestre. Los radares de la estación orbital Armstrong se iluminan con tu baliza de identificación. Miles de voces de control de tráfico aéreo te dan la bienvenida entre vítores y órdenes de aproximación.\n\nHas salvado tu vida y traído contigo el conocimiento de una civilización cuántica milenaria sin sucumbir a la codicia ni al pánico. Cuando los médicos abren la esclusa en la órbita de la Tierra, eres el único superviviente de la peor pesadilla que jamás cruzó los anillos de Saturno... pero también el hombre que demostró que el ingenio humano puede vencer a la oscuridad más antigua del cosmos.",
      "esFinal": true,
      "tipo_final": "bueno",
      "mensaje_final": "¡Final Exitoso! Has regresado a la Tierra con la nave a salvo y la amenaza contenida con honor."
    },
    "nodo_final_sacrificio": {
      "id": "nodo_final_sacrificio",
      "titulo": "Epílogo II: La Última Alborada en los Anillos",
      "imagen": "images/stories/estacion-boreas/reactor_fusion.jpg",
      "texto": "Giras la llave roja de sobrecarga total del reactor de fusión. Las alarmas de temperatura cantan su réquiem final en el puente de mando. A través de la cúpula contemplas por última vez el esplendor inmóvil de Saturno y sus anillos de plata.\n\nNo habrá naves militares que exploten el mineral alienígena para fabricar armas de guerra. No habrá esporas que amenacen las colonias agrícolas de Marte ni las costas de la Tierra. El secreto morirá contigo en este rincón olvidado del sistema solar.\n\nCuando las bobinas magnéticas colapsan, una supernova en miniatura de plasma puro y blanco desintegra a la *Boreas-IV* en una fracción de milisegundo. Durante tres minutos, los astrónomos de la Tierra observan un nuevo punto de luz brillante en el cielo nocturno, sin saber que un hombre solitario acaba de regalarles su futuro a cambio de su propio aliento.",
      "esFinal": true,
      "tipo_final": "bueno",
      "mensaje_final": "¡Final Heroico! Te has sacrificado para proteger a toda la humanidad de una catástrofe cósmica irreversible."
    },
    "nodo_final_asfixia": {
      "id": "nodo_final_asfixia",
      "titulo": "Epílogo III: Asfixia en el Abismo Helado",
      "imagen": "images/stories/estacion-boreas/esclusa_exterior.jpg",
      "texto": "El silbido de la última molécula de oxígeno escapando de tu tanque de espalda suena como un suspiro lejano. La escafandra se congela por dentro, cubriendo el cristal de tu visera con un encaje de hielo fino que distorsiona las estrellas.\n\nEl frío deja de doler; se convierte en un entumecimiento dulce y pacífico que trepa por tus piernas hasta tu pecho. Tu corazón late despacio, acompasado con el giro silencioso de los anillos de Saturno que giran debajo de ti.\n\nCierras los ojos flotando en la nada absoluta. La nave minera se aleja lentamente hacia las sombras del planeta gigante, convertida en un mausoleo de titanio donde el hombre y la máquina descansarán juntos durante diez mil millones de años.",
      "esFinal": true,
      "tipo_final": "malo",
      "mensaje_final": "Final Trágico. El vacío inclemente del espacio y la falta de oxígeno han reclamado tu vida."
    },
    "nodo_final_asimilado": {
      "id": "nodo_final_asimilado",

    const STORIES_DATABASE = {
      "la-ultima-guardia-faro": FARO_STORY,
      "el-manuscrito-de-la-abadia": ABADIA_STORY,
      "el-enigma-de-la-estacion-boreas": BOREAS_STORY
    };

    const STORAGE_KEY = 'crea_tu_historia_progress_';

    const app = {
      currentStory: null,
      currentNodeId: null,
      historyTrail: [],

      init() {
        this.renderCatalog();
      },

      resolveImagePath(path) {
        if (!path) return '';
        if (path.startsWith('http://') || path.startsWith('https://')) return path;
        return path.replace(/^\//, '');
      },

      getSavedProgress(slug) {
        try {
          const raw = localStorage.getItem(STORAGE_KEY + slug);
          return raw ? JSON.parse(raw) : null;
        } catch {
          return null;
        }
      },

      saveProgress(slug, nodeId, history, ending, endingNodeId) {
        try {
          const existing = this.getSavedProgress(slug) || {};
          let finales = existing.finalesDescubiertos || [];
          if (endingNodeId && !finales.includes(endingNodeId)) {
            finales.push(endingNodeId);
          }
          const isEndingReached = !!ending || !!endingNodeId;
          localStorage.setItem(STORAGE_KEY + slug, JSON.stringify({
            nodoActualId: nodeId,
            historialNodos: history,
            finalAlcanzado: ending || existing.finalAlcanzado,
            finalesDescubiertos: finales,
            fecha: new Date().toISOString(),
            completada: isEndingReached ? true : (existing.completada || false),
            leida: isEndingReached ? true : (existing.leida || existing.completada || false)
          }));
        } catch {}
      },

      toggleRead(slug) {
        try {
          const existing = this.getSavedProgress(slug) || {};
          const isCurrentlyRead = existing.leida !== undefined ? existing.leida : (existing.completada || false);
          const nextState = !isCurrentlyRead;
          localStorage.setItem(STORAGE_KEY + slug, JSON.stringify({
            ...existing,
            leida: nextState,
            completada: nextState,
            fecha: new Date().toISOString()
          }));
          this.renderCatalog();
        } catch {}
      },

      clearProgress(slug) {
        try {
          const existing = this.getSavedProgress(slug);
          if (existing) {
            localStorage.setItem(STORAGE_KEY + slug, JSON.stringify({
              nodoActualId: '',
              historialNodos: [],
              finalAlcanzado: null,
              finalesDescubiertos: existing.finalesDescubiertos || [],
              fecha: new Date().toISOString(),
              completada: existing.completada,
              leida: existing.leida !== undefined ? existing.leida : existing.completada
            }));
          }
        } catch {}
      },

      showCatalog() {
        this.currentStory = null;
        this.currentNodeId = null;
        this.historyTrail = [];
        document.getElementById('header-restart-btn').style.display = 'none';
        document.getElementById('header-catalog-btn').style.display = 'none';
        this.renderCatalog();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      },

      startStory(slug, resume = false) {
        const story = STORIES_DATABASE[slug];
        if (!story) return;

        this.currentStory = story;
        document.getElementById('header-restart-btn').style.display = 'inline-flex';
        document.getElementById('header-catalog-btn').style.display = 'inline-flex';

        if (resume) {
          const saved = this.getSavedProgress(slug);
          if (saved && saved.nodoActualId && story.nodos[saved.nodoActualId]) {
            this.currentNodeId = saved.nodoActualId;
            this.historyTrail = saved.historialNodos || [saved.nodoActualId];
            this.renderReader();
            window.scrollTo({ top: 0, behavior: 'smooth' });
            return;
          }
        }

        this.currentNodeId = story.nodoInicialId;
        this.historyTrail = [story.nodoInicialId];
        this.saveProgress(slug, story.nodoInicialId, this.historyTrail);
        this.renderReader();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      },

      selectOption(targetNodeId) {
        if (!this.currentStory || !this.currentStory.nodos[targetNodeId]) return;

        const nextNode = this.currentStory.nodos[targetNodeId];
        this.currentNodeId = targetNodeId;
        this.historyTrail.push(targetNodeId);

        this.saveProgress(
          this.currentStory.slug,
          targetNodeId,
          this.historyTrail,
          nextNode.esFinal ? nextNode.tipo_final : undefined,
          nextNode.esFinal ? targetNodeId : undefined
        );

        this.renderReader();
        window.scrollTo({ top: 0, behavior: 'smooth' });

        if (nextNode.esFinal && nextNode.tipo_final === 'bueno') {
          this.fireConfetti();
        }
      },

      goBack() {
        if (this.historyTrail.length <= 1) return;
        this.historyTrail.pop();
        const prevId = this.historyTrail[this.historyTrail.length - 1];
        this.currentNodeId = prevId;
        const prevNode = this.currentStory.nodos[prevId];

        this.saveProgress(
          this.currentStory.slug,
          prevId,
          this.historyTrail,
          prevNode.esFinal ? prevNode.tipo_final : undefined,
          prevNode.esFinal ? prevId : undefined
        );

        this.renderReader();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      },

      restartStory() {
        if (!this.currentStory) return;
        this.clearProgress(this.currentStory.slug);
        this.startStory(this.currentStory.slug, false);
      },

      formatText(text) {
        if (!text) return '';
        const blocks = text.split(/\n\s*\n/);
        return blocks.map(block => {
          const trimmed = block.trim();
          let formatted = trimmed
            .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
            .replace(/\*(.*?)\*/g, '<em>$1</em>')
            .replace(/\n/g, '<br>');

          if (trimmed.startsWith('>')) {
            const quote = formatted.replace(/^>\s*/gm, '');
            return '<blockquote>' + quote + '</blockquote>';
          }
          return '<p>' + formatted + '</p>';
        }).join('');
      },

      renderCatalog() {
        const root = document.getElementById('app-root');
        const stories = Object.values(STORIES_DATABASE);

        let cardsHtml = stories.map(story => {
          const progress = this.getSavedProgress(story.slug);
          const hasProgress = progress && progress.historialNodos && progress.historialNodos.length > 1 && !progress.completada;
          const isCompleted = progress && progress.completada;
          const isRead = progress && (progress.leida !== undefined ? progress.leida : (progress.completada || false));
          const coverImg = this.resolveImagePath(story.portada);

          const totalFinales = Object.values(story.nodos || {}).filter(n => n.esFinal).length || (story.slug === 'la-ultima-guardia-faro' ? 6 : 8);
          const finales = (progress && progress.finalesDescubiertos) ? progress.finalesDescubiertos : [];
          const countFinales = finales.length;
          const allUnlocked = totalFinales > 0 && countFinales >= totalFinales;
          const pctFinales = totalFinales > 0 ? Math.min(100, Math.round((countFinales / totalFinales) * 100)) : 0;

          let actionBtn = `<a href="historia-${story.slug}.html" class="story-card-btn" style="text-decoration:none; text-align:center; display:flex; align-items:center; justify-content:center;">📖 Comenzar aventura</a>`;
          if (hasProgress) {
            actionBtn = `
              <div style="display:flex; gap:0.5rem; margin-top:1rem;">
                <a href="historia-${story.slug}.html" class="story-card-btn resume" style="flex:1; margin-top:0; text-decoration:none; text-align:center; display:flex; align-items:center; justify-content:center;">▶ Continuar (Paso ${progress.historialNodos.length})</a>
                <button class="btn-secondary" title="Reiniciar partida" onclick="event.stopPropagation(); app.clearProgress('${story.slug}'); app.renderCatalog();">↺</button>
              </div>
            `;
          } else if (isCompleted) {
            actionBtn = `
              <div style="display:flex; gap:0.5rem; margin-top:1rem;">
                <a href="historia-${story.slug}.html" class="story-card-btn" style="flex:1; margin-top:0; text-decoration:none; text-align:center; display:flex; align-items:center; justify-content:center;">↺ Rejugar historia</a>
              </div>
            `;
          }

          return `
            <article class="story-card" style="cursor:pointer; ${allUnlocked ? 'border:1.5px solid rgba(245, 158, 11, 0.55); box-shadow:0 8px 30px rgba(245, 158, 11, 0.25);' : ''}" onclick="location.href='historia-${story.slug}.html'">
              <div class="story-card-image-wrapper">
                <img src="${coverImg}" alt="${story.titulo}" class="story-card-image" loading="lazy">
                <div class="story-card-overlay"></div>
                <div style="position:absolute; top:0.75rem; left:0.75rem; right:0.75rem; display:flex; align-items:center; justify-content:space-between; z-index:2;">
                  <span class="story-card-badge" style="position:static;">${story.genero}</span>
                  ${isRead ? `
                    <button type="button" onclick="event.stopPropagation(); app.toggleRead('${story.slug}');" title="Hacer clic para quitar y desmarcar como leída" style="cursor:pointer; font-size:0.72rem; font-weight:800; background:rgba(16, 185, 129, 0.28); border:1px solid rgba(16, 185, 129, 0.65); color:#34d399; padding:0.22rem 0.65rem; border-radius:9999px; box-shadow:0 0 14px rgba(16, 185, 129, 0.35); backdrop-filter:blur(8px); display:inline-flex; align-items:center; gap:0.3rem;">
                      <span>✅ Leída</span>
                      <span style="font-size:0.65rem; opacity:0.8;">(quitar ✕)</span>
                    </button>
                  ` : ''}
                </div>
              </div>
              <div class="story-card-content">
                <h2 class="story-card-title">${story.titulo}</h2>
                <p class="story-card-desc">${story.descripcionCorta}</p>
                <div class="story-card-meta">
                  <span>⏱ ${story.tiempoLecturaMin} min</span>
                  <span>📑 ~${story.totalNodosEstimados} nodos</span>
                </div>

                ${allUnlocked ? `
                  <div style="background:linear-gradient(90deg, rgba(245,158,11,0.2) 0%, rgba(217,119,6,0.25) 100%); border:1.5px solid rgba(245,158,11,0.5); border-radius:8px; padding:0.45rem 0.75rem; margin-top:0.85rem; display:flex; align-items:center; gap:0.45rem; color:#fbbf24; font-size:0.8rem; font-weight:800; box-shadow:0 0 18px rgba(245,158,11,0.25);">
                    <span>🌟</span>
                    <span>¡Todos los finales descubiertos! (${countFinales}/${totalFinales})</span>
                  </div>
                ` : ''}

                <div style="margin-top:0.85rem; padding:0.65rem 0.85rem; background:rgba(255, 255, 255, 0.03); border:1px solid var(--border-subtle); border-radius:8px;">
                  <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:0.45rem; font-size:0.8rem;">
                    <span style="color:var(--text-secondary); display:inline-flex; align-items:center; gap:0.35rem; font-weight:600;">
                      <span style="color:${allUnlocked ? '#fbbf24' : 'var(--accent-amber)'};">🏆</span>
                      <span>Finales descubiertos:</span>
                    </span>
                    <span style="font-weight:800; color:${allUnlocked ? '#fbbf24' : '#34d399'};">
                      ${countFinales} de ${totalFinales} (${pctFinales}%)
                    </span>
                  </div>
                  <div style="width:100%; height:6px; background:rgba(255,255,255,0.08); border-radius:9999px; overflow:hidden;">
                    <div style="width:${pctFinales}%; height:100%; background:${allUnlocked ? 'linear-gradient(90deg, #f59e0b 0%, #fbbf24 100%)' : 'linear-gradient(90deg, #f59e0b 0%, #10b981 100%)'}; border-radius:9999px; transition:width 0.4s ease;"></div>
                  </div>
                </div>

                ${actionBtn}

                <div style="display:flex; justify-content:flex-end; margin-top:0.75rem;">
                  <button type="button" onclick="event.stopPropagation(); app.toggleRead('${story.slug}');" title="${isRead ? 'Hacer clic para quitar y desmarcar como leída' : 'Marcar historia como leída'}" style="display:inline-flex; align-items:center; gap:0.35rem; padding:0.35rem 0.75rem; border-radius:9999px; font-size:0.76rem; font-weight:600; border:${isRead ? '1px solid rgba(16, 185, 129, 0.55)' : '1px solid rgba(255, 255, 255, 0.18)'}; background:${isRead ? 'rgba(16, 185, 129, 0.18)' : 'rgba(255, 255, 255, 0.05)'}; color:${isRead ? '#34d399' : 'var(--text-secondary)'}; cursor:pointer; transition:all 0.2s ease; box-shadow:${isRead ? '0 0 12px rgba(16, 185, 129, 0.25)' : 'none'};">
                    <span>${isRead ? '✅' : '⚪'}</span>
                    <span>${isRead ? 'Leída (clic para quitar)' : 'Marcar leída'}</span>
                  </button>
                </div>
              </div>
            </article>
          `;
        }).join('');

        root.innerHTML = `
          <div class="home-container">
            <div class="breadcrumb-nav">
              <a href="index.html" class="breadcrumb-link">
                <span>←</span> <span>Volver a Tus Desvaríos</span>
              </a>
            </div>

            <section class="hero-section">
              <div class="hero-badge">✨ Ficción Interactiva Ramificada</div>
              <h1 class="hero-title">Crea tus Desvaríos</h1>
              <p class="hero-description">
                Sumérgete en novelas interactivas donde tú eres el protagonista. Elige sabiamente:

              <span style="font-size:0.82rem; color:var(--text-muted);">${stories.length} relatos</span>
            </div>
            <div class="stories-grid">
              ${cardsHtml}
            </div>
          </div>
        `;
      },

      renderReader() {
        const root = document.getElementById('app-root');
        const node = this.currentStory.nodos[this.currentNodeId];
        if (!node) return;

        const isEnding = !!node.esFinal;
        const stepCount = this.historyTrail.length;
        const totalSteps = this.currentStory.totalNodosEstimados || 24;
        const percentage = isEnding ? 100 : Math.min(Math.round((stepCount / totalSteps) * 100), 95);
        const nodeImage = this.resolveImagePath(node.imagen || this.currentStory.portada);

            <div class="ending-banner ${endingType}">
              <div class="ending-pill ${endingType}">
                <span>${endingLabel}</span>
              </div>
              ${node.mensaje_final ? `<p class="ending-moral">&ldquo;${node.mensaje_final}&rdquo;</p>` : ''}
              <div class="ending-actions">
                <button class="btn-primary" onclick="app.restartStory()">↺ Jugar de nuevo (Explorar otros caminos)</button>
                <button class="btn-secondary" style="padding:0.75rem 1.4rem;" onclick="app.showCatalog()">📚 Volver al catálogo</button>
              </div>
              <div style="margin-top:1.5rem; padding-top:1.25rem; border-top:1px solid rgba(255,255,255,0.12); display:flex; flex-direction:column; align-items:center; gap:0.65rem; text-align:center;">

                </p>
                <a href="https://www.paypal.com/donate/?hosted_button_id=V8PZNYKGXBCLG&locale.x=es_ES"
                   target="_blank"
                   rel="noopener noreferrer"
                   class="btn-paypal-donate"
                   title="Invitar a un café con PayPal"
                   style="display:inline-flex; align-items:center; gap:0.5rem; padding:0.6rem 1.3rem; border-radius:9999px; background:linear-gradient(135deg, #f59e0b 0%, #d97706 100%); color:#0b0f19; font-weight:800; font-size:0.85rem; text-decoration:none; box-shadow:0 4px 16px rgba(245, 158, 11, 0.35); transition:all 0.2s ease;">
                  <span>☕ Invitar a un café</span>
                  <span>➜</span>
                </a>
              </div>
            </div>
          `;
        } else if (node.opciones && node.opciones.length > 0) {

                ${opt.impacto ? `<span class="decision-badge">${opt.impacto}</span>` : ''}
                <span>${opt.texto}</span>
              </div>
              <span class="decision-arrow">➜</span>
            </button>
          `).join('');

          optionsHtml = `
            <div class="decisions-container">
              <div class="decisions-heading">
                <span>🧭 ¿Qué decides hacer?</span>
              </div>
              ${buttons}
            </div>

        }

        root.innerHTML = `
          <div class="reader-wrapper">
            <div class="reader-progress-container">
              <div style="display:flex; align-items:center; gap:0.5rem;">
                ${this.historyTrail.length > 1 && !isEnding ? `
                  <button class="btn-secondary" style="padding:0.3rem 0.6rem; font-size:0.78rem;" onclick="app.goBack()">
                    <span>←</span> <span>Atrás</span>
                  </button>
                ` : `
                  <span style="font-size:0.82rem; color:var(--text-muted);">🧭 Lectura</span>
                `}
              </div>
              <div class="progress-bar-track">
                <div class="progress-bar-fill" style="width: ${percentage}%;"></div>
              </div>
              <div style="display:flex; align-items:center; gap:0.6rem;">
                <span style="font-size:0.8rem; color:var(--text-muted);">
                  ${isEnding ? 'Final alcanzado' : `Nodo ${stepCount} de ~${totalSteps}`}
                </span>
                <button class="btn-secondary" style="padding:0.3rem 0.5rem; font-size:0.78rem;" title="Reiniciar" onclick="app.restartStory()">↺</button>
              </div>
            </div>

            <div class="reader-node-card">
              ${nodeImage ? `
                <div class="reader-image-container">
                  <img src="${nodeImage}" alt="${node.titulo || this.currentStory.titulo}" class="reader-image">
                  <div class="reader-image-gradient"></div>
                </div>
              ` : ''}

              <div class="reader-body">
                ${node.titulo ? `<h1 class="reader-node-title">${node.titulo}</h1>` : ''}
                <div class="reader-text">
                  ${this.formatText(node.texto)}
                </div>
                ${optionsHtml}
              </div>
            </div>
          </div>
        `;
      },

      fireConfetti() {
        const canvas = document.getElementById('confetti-canvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const pieces = [];
        const colors = ['#10b981', '#34d399', '#ffffff', '#f59e0b', '#fbbf24'];

        for (let i = 0; i < 70; i++) {
          pieces.push({
            x: canvas.width / 2,
            y: canvas.height * 0.6,
            vx: (Math.random() - 0.5) * 12,
            vy: (Math.random() - 0.8) * 14,
            size: Math.random() * 8 + 4,
            color: colors[Math.floor(Math.random() * colors.length)],
            rotation: Math.random() * 360,
            vRot: (Math.random() - 0.5) * 10
          });
        }

        let animationFrame;
        let count = 0;

        function update() {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          pieces.forEach(p => {
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.35;
            p.rotation += p.vRot;

            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate((p.rotation * Math.PI) / 180);
            ctx.fillStyle = p.color;
            ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
            ctx.restore();
          });

          count++;
          if (count < 140) {
            animationFrame = requestAnimationFrame(update);
          } else {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
          }
        }

        update();
      }
    };

    document.addEventListener('DOMContentLoaded', () => {
      app.init();
    });
  </script>
  <script src="js/cookie-banner.js"></script>
</body>
