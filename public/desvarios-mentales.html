eal para una noche de desconexión absoluta?","opciones":[{"texto":"Un sillón cómodo, lluvia golpeando el cristal y una enciclopedia de misterios.","arquetipo":"erudito"},{"texto":"Un taller o espacio creativo probando nuevas ideas hasta altas horas de la madrugada.","arquetipo":"alquimista"},{"texto":"Una fogata tranquila con las pocas personas que considero de mi más leal círculo.","arquetipo":"guardian"},{"texto":"Pasear en soledad por calles vacías y silenciosas bajo la luz de la luna.","arquetipo":"espectro"}]},{"id":"p8","texto":"Al final del camino, ¿cómo te gustaría que te recordasen?","opciones":[{"texto":"«Aquel que descubrió verdades que nadie más se atrevió a buscar».","arquetipo":"erudito"},{"texto":"«Aquel que transformó su realidad y desafió lo imposible».","arquetipo":"alquimista"},{"texto":"«El escudo inamovible que nunca abandonó a los suyos».","arquetipo":"guardian"},{"texto":"«La presencia enigmática que nadie logró doblegar ni olvidar».","arquetipo":"espectro"}]}],"resultados":{"erudito":{"nombre":"El Erudito Hereje","tituloCorto":"Buscador de Verdades Prohibidas","icono":"📜","color":"#38bdf8","descripcion":"Te impulsa una sed insaciable de conocimiento y comprensión. No aceptas dogmas ni verdades a medias; necesitas llegar a la raíz de las cosas, incluso si la respuesta resulta inquietante. Tu mente es analítica, meticulosa y profundamente estratégica.","fortaleza":"Agudeza intelectual, memoria prodigiosa y pensamiento crítico implacable.","desvario":"Tendencia a aislarte en tus pensamientos y priorizar la lógica fría sobre las emociones.","afinidad":"88% Afin con la investigación, el misterio y el análisis deductivo."},"alquimista":{"nombre":"El Alquimista Obsesivo","tituloCorto":"Transformador de la Realidad","icono":"⚗️","color":"#f59e0b","descripcion":"No te conformas con el mundo tal y como es: sientes la urgencia constante de mejorarlo, retorcerlo o reinventarlo. Eres ambicioso, creativo y posees una curiosidad que a menudo bordea la imprudencia genial.","fortaleza":"Innovación constante, tenacidad ante el fracaso y audacia transformadora.","desvario":"Impaciencia cuando los demás no siguen tu ritmo y obsesión por controlar el resultado.","afinidad":"92% Afin con la creación, la experimentación y el desafío a las normas establecidas."},"guardian":{"nombre":"El Guardián del Umbral","tituloCorto":"Baluarte de Lealtad y Orden","icono":"🛡️","color":"#10b981","descripcion":"Eres el pilar inquebrantable en medio de la tormenta. Valoras el honor, la lealtad y la protección de tu círculo más íntimo por encima de todo. Sabes guardar secretos y tu palabra tiene el peso del granito.","fortaleza":"Lealtad indomable, templanza bajo presión y sentido protector.","desvario":"Dificultad para perdonar la traición y reticencia a confiar en extraños.","afinidad":"85% Afin con el liderazgo protector, la justicia y la defensa de principios."},"espectro":{"nombre":"El Espectro Vengativo","tituloCorto":"Sombra Silenciosa e Implacable","icono":"🌑","color":"#ec4899","descripcion":"Prefieres moverte en un segundo plano, observando lo que otros pasan por alto. Posees una intuición psicológica letal: calas a las personas al instante y sabes con precisión quirúrgica dónde son vulnerables.","fortaleza":"Paciencia infinita, sutileza táctica y memoria infalible para los agravios.","desvario":"Rencor silencioso y tendencia a guardar cuentas pendientes durante años.","afinidad":"90% Afin con la psicología oscura, la discreción y el cálculo a largo plazo."}}},
      "termometro-desvario": {"id":"termometro-desvario","slug":"termometro-desvario","titulo":"El Termómetro del Desvarío: ¿Cuánto estás perdiendo el norte?","subtitulo":"Un diagnóstico exprés y rigurosamente absurdo sobre tu nivel de cordura cotidiana.","descripcionCorta":"Responde a 7 situaciones cómicas y cotidianas para averiguar en qué punto de la escala de la locura te encuentras hoy.","tipo":"puntuacion","categoria":"humor","categoriaLabel":"Humor & Diagnósticos","icono":"🌀","tiempoMin":2,"color":"#f59e0b","preguntas":[{"id":"p1","texto":"Estás buscando las gafas de sol o las llaves y llevas 10 minutos sin encontrarlas. De repente te das cuenta de que las llevas puestas o en la mano. ¿Qué haces?","opciones":[{"texto":"Me río de mí mismo, suspiro y sigo con mi vida.","puntos":0},{"texto":"Miro discretamente alrededor para asegurarme de que nadie me ha visto hacer el ridículo.","puntos":10},{"texto":"Culpo a una falla temporal en la simulación o a duendes domésticos.","puntos":20},{"texto":"Sigo buscando otras cosas por si acaso he perdido también el sentido común.","puntos":30}]},{"id":"p2","texto":"Te vas a la cama a las 23:00 para descansar bien. Son las 02:30 y estás viendo un documental sobre cómo se fabrican los clips o teorías sobre la Atlántida. ¿Cómo te justificas?","opciones":[{"texto":"«Apago el móvil ya mismo, esto no tiene perdón».","puntos":0},{"texto":"«Un vídeo más de 3 minutos y a dormir... seguro».","puntos":10},{"texto":"«Es cultura general básica que podría salvarme la vida en un concurso de televisión».","puntos":20},{"texto":"«La sociedad duerme, pero las mentes brillantes producimos de madrugada».","puntos":30}]},{"id":"p3","texto":"Alguien que apenas conoces te dice: «Tenemos que hablar». ¿Cuál es tu primera hipótesis mental?","opciones":[{"texto":"Será algo trivial de trabajo o una pregunta cualquiera.","puntos":0},{"texto":"He hecho algo mal sin darme cuenta y me van a cantar las cuarenta.","puntos":10},{"texto":"Ha descubierto mi identidad secreta o me van a reclutar para una agencia clandestina.","puntos":25},{"texto":"Fingiré un desmayo teatral o cambiaré de país antes del mediodía.","puntos":35}]},{"id":"p4","texto":"Vas al supermercado a por leche y pan. Sales con 65 euros gastados en salsas asiáticas, calcetines con dibujos de aguacates y un destornillador. ¿Compraste la leche?","opciones":[{"texto":"Sí, traje todo lo de la lista y un extra.","puntos":0},{"texto":"Compré todo excepto la leche... tendré que volver.","puntos":15},{"texto":"No compré la leche, pero mira qué salsa de mango más exótica.","puntos":25},{"texto":"¿Había ido a por leche? Yo creía que iba a explorar el pasillo de novedades.","puntos":35}]},{"id":"p5","texto":"Mantienes una conversación completa con tu mascota o con una planta en voz alta. ¿Cuál es el tono?","opciones":[{"texto":"Solo les digo 'hola bonito' o cosas cortas de cariño.","puntos":0},{"texto":"Les cuento mis problemas del día porque son los únicos que no me juzgan.","puntos":15},{"texto":"Debatimos sobre geopolítica y decisiones financieras familiares.","puntos":25},{"texto":"Juro que el gato asintió con la cabeza y me dio la razón.","puntos":35}]},{"id":"p6","texto":"Escuchas una canción pegadiza en la radio que odias con toda tu alma. ¿Qué ocurre las siguientes 4 horas?","opciones":[{"texto":"Se me olvida a los dos minutos.","puntos":0},{"texto":"La tarareo con rabia sin poder evitarlo.","puntos":15},{"texto":"Creo una coreografía involuntaria mientras pongo la lavadora.","puntos":25},{"texto":"Se convierte en la banda sonora de mis pensamientos hasta el día del juicio final.","puntos":35}]},{"id":"p7","texto":"Si pudieras definir tu estado mental habitual con un fenómeno meteorológico, ¿cuál sería?","opciones":[{"texto":"Día despejado con brisa suave y predecible.","puntos":0},{"texto":"Parcialmente nublado con probabilidad de despistes aislados.","puntos":15},{"texto":"Tormenta eléctrica con ideas cayendo como rayos descontrolados.","puntos":25},{"texto":"Tornado de purpurina en una feria ambulante.","puntos":35}]}],"rangos":[{"min":0,"max":40,"nivel":"Cordura Sospechosa (0% - 20%)","titulo":"Ciudadano Peligrosamente Funcional","icono":"🧐","color":"#10b981","descripcion":"Increíble. Tu mente opera con la precisión de un reloj suizo. Duermes a tus horas, encuentras las cosas a la primera y no mantienes debates existenciales con la tostadora. O eres un monje zen o estás fingiendo muy bien.","consejo":"Atrévete a desvariar un poco, la vida con un 10% de caos es mucho más entretenida."},{"min":41,"max":100,"nivel":"Desvarío Moderado (25% - 50%)","titulo":"Desvariador Cotidiano con Estilo","icono":"☕","color":"#06b6d4","descripcion":"El punto dulce de la existencia. Tienes tus momentos de despiste antológico y tus obsesiones nocturnas con vídeos absurdos, pero sigues pagando las facturas y funcionando en sociedad sin alarmar a tus vecinos.","consejo":"Sigue así: el equilibrio perfecto entre sentido común y locura controlada."},{"min":101,"max":170,"nivel":"Filósofo del Caos (55% - 75%)","titulo":"Mente en Ebullición Perpetua","icono":"⚡","color":"#f59e0b","descripcion":"Tu cabeza es un navegador con 84 pestañas abiertas, de las cuales en 3 suena música de fondo que no sabes de dónde viene. Eres creativo, impredecible y una fuente inagotable de anécdotas estrambóticas.","consejo":"Anota tus ideas antes de que choquen entre sí y provoquen un cortocircuito."},{"min":171,"max":245,"nivel":"Desvarío Legendario (80% - 100%)","titulo":"Emperador Absoluto del Despropósito","icono":"👑","color":"#ec4899","descripcion":"Has trascendido la cordura ordinaria. Las leyes de la lógica mundana no aplican a tu universo. Vives en una realidad paralela fascinante donde los gatos dan consejos financieros y las madrugadas son el escenario de grandes epopeyas.","consejo":"No cambies nunca. Estás en la cúspide de Tus Desvaríos."}]},
      "enigmas-logica": {"id":"enigmas-logica","slug":"enigmas-logica","titulo":"El Misterio de la Cámara de los Sabios: 5 Enigmas de Lógica","subtitulo":"Pon a prueba tu agudeza mental con acertijos clásicos y dilemas deductivos.","descripcionCorta":"5 acertijos de ingenio y lógica pura. Usa las pistas con sabiduría y demuestra si posees una mente analítica superior.","tipo":"enigma","categoria":"logica","categoriaLabel":"Lógica & Paradojas","icono":"🧩","tiempoMin":4,"color":"#06b6d4","enigmas":[{"id":"e1","titulo":"Enigma 1: Los Tres Cofres del Alquimista","planteamiento":"Frente a ti hay tres cofres cerrados: uno de **Oro**, uno de **Plata** y uno de **Plomo**. Dentro de uno de ellos está la *Piedra Filosofal*; los otros dos están vacíos.\n\nCada cofre tiene una inscripción grabada:\n- **Cofre de Oro:** «La Piedra está en este cofre».\n- **Cofre de Plata:** «La Piedra no está en este cofre».\n- **Cofre de Plomo:** «La Piedra no está en el cofre de Oro».\n\nEl alquimista te advierte: **Sólo UNA de las tres inscripciones es VERDADERA; las otras dos son FALSAS.**\n\n¿En qué cofre está la Piedra Filosofal?","pistas":["Pista 1: Si la inscripción de Oro fuera verdadera, ¿qué pasaría con la de Plomo?","Pista 2: Observa que la inscripción de Oro y la de Plomo dicen cosas directamente contradictorias (una afirma que está en Oro, la otra que NO está en Oro). Por tanto, una de ellas debe ser verdadera y la otra falsa.","Pista 3: Como solo hay UNA inscripción verdadera en total, la inscripción del cofre de Plata tiene que ser obligatoriamente FALSA."],"opciones":[{"id":"oro","texto":"En el Cofre de Oro","correcta":false},{"id":"plata","texto":"En el Cofre de Plata","correcta":true},{"id":"plomo","texto":"En el Cofre de Plomo","correcta":false}],"explicacion":"¡Exacto! El cofre de Oro y el de Plomo se contradicen, por lo que una de sus frases es la única verdadera. Esto obliga a que la frase del cofre de Plata («La Piedra no está en este cofre») sea FALSA. Si es falsa que no está en Plata... ¡significa que la Piedra está en el **Cofre de Plata**!"},{"id":"e2","titulo":"Enigma 2: El Prisionero y las Dos Puertas","planteamiento":"Estás encerrado en una celda con **dos puertas**: una conduce a la **Libertad** y la otra al **Abismo eterno**.\n\nFrente a cada puerta hay un guardián:\n- Uno de ellos **SIEMPRE dice la verdad**.\n- El otro **SIEMPRE miente**.\n- No sabes cuál es cuál, y solo puedes hacer **UNA sola pregunta a UNO solo de los guardianes**.\n\n¿Qué pregunta te garantiza descubrir con 100% de seguridad la puerta de la Libertad?","pistas":["Pista 1: Si preguntas directamente por la puerta a uno solo, el mentiroso te engañará y el verídico te dirá la verdad, pero como no sabes quién es quién, no te sirve.","Pista 2: Necesitas una pregunta que involucre lo que respondería el OTRO guardián (doble negación lógica)."],"opciones":[{"id":"a","texto":"«¿Eres tú el guardián que siempre dice la verdad?»","correcta":false},{"id":"b","texto":"«Si le preguntara al OTRO guardián cuál es la puerta de la Libertad, ¿qué puerta me señalaría?»","correcta":true},{"id":"c","texto":"«¿Cuál es la puerta que tú elegirías para salvarte?»","correcta":false},{"id":"d","texto":"«¿La puerta de la izquierda conduce a la Libertad?»","correcta":false}],"explicacion":"¡Brillante deducción! Si le preguntas eso:\n- Si le preguntas al **Verídico**, él sabe con verdad que el Mentiroso señalará la puerta del Abismo, y te dirá con verdad: «El Abismo».\n- Si le preguntas al **Mentiroso**, él sabe que el Verídico señalaría la Libertad, pero al mentir te dirá: «El Abismo».\nEn ambos casos, **ambos guardianes te señalarán la puerta del Abismo**. Por tanto, sólo tienes que elegir la PUERTA CONTRARIA a la que te indiquen."},{"id":"e3","titulo":"Enigma 3: La Carrera de los Monjes en el Claustro","planteamiento":"Durante una prueba de agilidad en el monasterio, compites en una carrera de obstáculos.\n\nEn la última curva, aceleras a fondo y **adelantas al corredor que iba en SEGUNDA posición** justo antes de cruzar la meta.\n\n¿En qué posición quedas clasificado?","pistas":["Pista 1: No te apresures; piensa en quién estaba delante de ti antes del adelantamiento.","Pista 2: Si adelantas al segundo... ¿qué puesto ocupaba él y cuál ocupas tú ahora?"],"opciones":[{"id":"primero","texto":"1º lugar (Primer puesto / Ganador)","correcta":false},{"id":"segundo","texto":"2º lugar (Segundo puesto)","correcta":true},{"id":"tercero","texto":"3º lugar (Tercer puesto)","correcta":false}],"explicacion":"¡Correcto! Si adelantas al que iba segundo, tú pasas a ocupar su puesto: el **2º lugar**. El primer clasificado sigue yendo delante de ti."},{"id":"e4","titulo":"Enigma 4: El Barquero, el Lobo, la Cabra y la Col","planteamiento":"Un barquero debe cruzar un río con un **Lobo**, una **Cabra** y una **Col**. En su pequeña barca solo cabe él y **uno** de los tres elementos por viaje.\n\n- Si deja al Lobo y a la Cabra solos, el Lobo se comerá a la Cabra.\n- Si deja a la Cabra y a la Col solas, la Cabra se comerá la Col.\n- El Lobo no come Col.\n\n¿Cuál debe ser el **primer viaje de ida** indispensable para que nadie sea devorado?","pistas":["Pista 1: ¿Qué dos elementos pueden quedarse juntos en la orilla sin peligro?","Pista 2: El Lobo y la Col nunca se atacarán."],"opciones":[{"id":"lobo","texto":"Cruzar primero con el Lobo","correcta":false},{"id":"cabra","texto":"Cruzar primero con la Cabra","correcta":true},{"id":"col","texto":"Cruzar primero con la Col","correcta":false}],"explicacion":"¡Excelente! El único primer paso seguro es **cruzar a la Cabra**. Así, en la orilla original se quedan el Lobo y la Col (que no se tocan). Después cruza el Lobo, se trae de vuelta a la Cabra, cruza la Col y finalmente vuelve a por la Cabra."},{"id":"e5","titulo":"Enigma 5: La Vela y la Oscuridad","planteamiento":"Entras a medianoche en una habitación completamente helada y a oscuras. En el bolsillo tienes **una única cerilla**. Dentro de la habitación hay:\n- Una lámpara de aceite.\n- Una vela de cera virgen.\n- Una chimenea de leña seca lista para encender.\n\n¿Qué es lo primero que debes encender?","pistas":["Pista 1: Antes de iluminar nada en la habitación, necesitas fuego en la mano.","Pista 2: Piensa en el orden físico de las cosas."],"opciones":[{"id":"vela","texto":"La vela de cera","correcta":false},{"id":"cerilla","texto":"La cerilla","correcta":true},{"id":"lampara","texto":"La lámpara de aceite","correcta":false},{"id":"chimenea","texto":"La chimenea","correcta":false}],"explicacion":"¡Elemental! Antes de poder prender la vela, la lámpara o la chimenea, lo primero que debes encender de forma obligada es **la cerilla**."}]},
      "supervivencia-apocalipsis": {"id":"supervivencia-apocalipsis","slug":"supervivencia-apocalipsis","titulo":"¿Sobrevivirías a un Apocalipsis Absurdo?","subtitulo":"Decisiones extremas en un escenario donde todo lo que puede salir mal, saldrá peor.","descripcionCorta":"Evalúa tus instintos de supervivencia frente a hordas de mutantes, escasez de papel higiénico y dilemas de refugio.","tipo":"puntuacion","categoria":"humor","categoriaLabel":"Humor & Diagnósticos","icono":"⚔️","tiempoMin":3,"color":"#ef4444","preguntas":[{"id":"s1","texto":"Las sirenas de alarma mundial comienzan a sonar a las 3:00 AM. La radio anuncia un colapso inminente. ¿Cuál es tu **primer movimiento**?","opciones":[{"texto":"Correr al supermercado a llenar el carro con 400 rollos de papel higiénico y latas de atún.","puntos":5},{"texto":"Llenar todas las ollas, bañeras y botellas de agua potable, asegurar puertas y esperar información fiable.","puntos":15},{"texto":"Subir una foto a redes sociales con el texto: *«Vaya añito llevamos #FinDelMundo»*.","puntos":0},{"texto":"Coger una linterna, un cuchillo de cocina y subir a la azotea a observar la situación.","puntos":10}]},{"id":"s2","texto":"Llevas 5 días atrincherado en casa y se corta el suministro eléctrico. Tienes que elegir **un solo objeto insólito** para llevar en tu mochila de escape:","opciones":[{"texto":"Una baraja de cartas para no volverte loco de aburrimiento por las noches.","puntos":10},{"texto":"Un rollo de cinta americana industrial: repara desde ropa hasta tuberías.","puntos":15},{"texto":"Tu consola portátil con 12% de batería restante.","puntos":0},{"texto":"Un espejo pequeño: sirve para hacer señales de luz, afeitarse y mirar tras las esquinas.","puntos":12}]},{"id":"s3","texto":"Explorando una gasolinera abandonada te topas con **otra persona armada con una sartén de hierro**. Te mira con desconfianza. ¿Qué haces?","opciones":[{"texto":"Gritarle a pleno pulmón: *«¡Tregua, tengo galletas y ganas de vivir!»* mostrando las manos abiertas.","puntos":12},{"texto":"Lanzarle un paquete de patatas fritas como distracción y huir en zigzag.","puntos":10},{"texto":"Retarle a un duelo de miradas esperando que suelte la sartén por intimidación.","puntos":2},{"texto":"Mantener distancia, proponer un intercambio pacífico de suministros sin dar la espalda.","puntos":15}]},{"id":"s4","texto":"Tu refugio temporal está rodeado por criaturas extrañas atraídas por el sonido. Tienes hambre voraz y la única comida disponible es **una lata sin etiqueta abombada**. ¿Qué decides?","opciones":[{"texto":"Abrirla y comértela de golpe; un superviviente no tiene tiempo para remilgos.","puntos":0},{"texto":"Hervirla a fuego alto antes de olerla para intentar esterilizar posibles toxinas.","puntos":5},{"texto":"Descartarla inmediatamente: una lata hinchada es sinónimo de toxina botulínica letal.","puntos":15},{"texto":"Dársela a probar primero a tu compañero sospechoso.","puntos":8}]},{"id":"s5","texto":"Necesitas cruzar una ciudad en ruinas para llegar a una zona segura en las montañas. ¿Qué ruta eliges?","opciones":[{"texto":"La autopista principal en coche a 140 km/h esquivando vehículos volcados.","puntos":2},{"texto":"A pie por las azoteas y callejones secundarios, moviéndote solo al amanecer y al atardecer.","puntos":15},{"texto":"Los túneles del metro subterráneo con una antorcha improvisada.","puntos":8},{"texto":"En bicicleta estática en tu salón con la esperanza de que pase la tormenta.","puntos":0}]},{"id":"s6","texto":"Encuentras un búnker subterráneo con código numérico de seguridad. En la puerta hay una nota que dice: *«El código es el número de planetas del sistema solar multiplicado por 11»*. ¿Qué introduces?","opciones":[{"texto":"88 (8 planetas x 11, respetando la degradación de Plutón).","puntos":15},{"texto":"99 (Plutón siempre será un planeta en mi corazón).","puntos":8},{"texto":"0000 porque seguro que el dueño no cambió la contraseña de fábrica.","puntos":5},{"texto":"Aporrear el teclado con una piedra.","puntos":0}]},{"id":"s7","texto":"¡Has alcanzado la colonia de supervivientes! Te piden que elijas tu **rol comunitario** para ganarte las raciones diarias. ¿Qué puesto solicitas?","opciones":[{"texto":"Especialista en logística, inventario y racionamiento de suministros.","puntos":15},{"texto":"Explorador de vanguardia en busca de combustible y piezas mecánicas.","puntos":12},{"texto":"Filósofo residente y animador sociocultural de la colonia.","puntos":4},{"texto":"Catador oficial de siestas y supervisor de hamacas.","puntos":0}]}],"rangos":[{"min":0,"max":25,"nivel":"Baja en el Minuto 5","titulo":"La Primera Baja Inevitable","icono":"🪦","color":"#ef4444","descripcion":"Seamos sinceros: ante un colapso global, tu mayor probabilidad es tropezar con tus propios cordones mientras grabas un vídeo de despedida para TikTok. Tu sentido del peligro es inexistente y te comerías la lata sospechosa sin dudar.","consejo":"Si el apocalipsis llega mañana, quédate pegado a alguien que tenga navaja suiza y sepa hacer fuego con dos piedras."},{"min":26,"max":55,"nivel":"Superviviente por Chiripa","titulo":"El Superviviente Accidental","icono":"🍀","color":"#f59e0b","descripcion":"Tus conocimientos de supervivencia son dudosos, pero tienes una flor en cierta parte. Logras esquivar peligros por pura casualidad, perdiendo mochilas y provisiones por el camino pero llegando vivo al siguiente refugio.","consejo":"Aprende primeros auxilios básicos y deja de confiar tanto en la suerte ciega."},{"min":56,"max":85,"nivel":"Veterano del Yermo","titulo":"El Estratega del Búnker","icono":"🛡️","color":"#06b6d4","descripcion":"Mente fría, decisiones racionales y buen cálculo de recursos. Sabes cuándo pelear, cuándo negociar y qué latas jamás debes abrir. La comunidad prosperaría contigo en el equipo.","consejo":"Tu pragmatismo es tu mayor escudo. No bajes la guardia con extraños amables."},{"min":86,"max":105,"nivel":"Leyenda Inmortal","titulo":"El Señor Supremo del Apocalipsis","icono":"👑","color":"#10b981","descripcion":"Impresionante instinto de supervivencia. En menos de dos semanas no solo habrías sobrevivido, sino que habrías construido una destilería de agua, un sistema de radio y domesticado a los mutantes de la zona.","consejo":"Funda tu propia colonia; tienes madera de líder legendario en cualquier mundo en ruinas."}]},
      "trampas-mentales": {"id":"trampas-mentales","slug":"trampas-mentales","titulo":"¿Tu Cerebro te Engaña? Desafío de Sesgos y Paradojas","subtitulo":"6 trampas cognitivas y paradojas lógicas donde tu intuición fallará casi seguro.","descripcionCorta":"Pon a prueba tu pensamiento crítico frente a paradojas de probabilidad, falacias cotidianas e ilusiones del razonamiento.","tipo":"enigma","categoria":"logica","categoriaLabel":"Lógica & Paradojas","icono":"🧠","tiempoMin":5,"color":"#8b5cf6","enigmas":[{"id":"tm1","titulo":"Trampa 1: El Dilema de Monty Hall","planteamiento":"Estás en un concurso de televisión frente a **3 puertas cerradas**:\n- Tras una de ellas hay un **coche deportivo nuevo**.\n- Tras las otras dos hay **cabras**.\n\nEliges la **Puerta 1**. El presentador, que sabe perfectamente qué hay tras cada puerta, abre la **Puerta 3** y te muestra una cabra.\n\nLuego te pregunta: *«¿Deseas cambiar tu elección a la Puerta 2, o te quedas con la Puerta 1?»*\n\n¿Qué te conviene hacer matemáticamente?","pistas":["Pista 1: Cuando elegiste la Puerta 1 al principio, tu probabilidad de acertar era exactamente de 1/3 (33.3%).","Pista 2: La probabilidad de que el coche estuviera en una de las OTRAS DOS puertas combinadas era de 2/3 (66.6%).","Pista 3: El presentador ha eliminado deliberadamente una puerta perdedora del grupo del 2/3, concentrando toda esa probabilidad en la puerta restante."],"opciones":[{"id":"quedarse","texto":"Quedarse con la Puerta 1 (Da igual, ahora es 50% de probabilidad)","correcta":false},{"id":"cambiar","texto":"Cambiar SIEMPRE a la Puerta 2 (Duplicas tus probabilidades al 66.6%)","correcta":true},{"id":"indiferente","texto":"Es indiferente, el destino ya está escrito","correcta":false}],"explicacion":"¡Exacto! Aunque el sentido común nos grita «ahora quedan 2 puertas, es 50/50», la matemática demuestra que **cambiar duplica tus opciones de ganar (2 de cada 3 veces ganarás)**. Al principio tu puerta tenía solo 1/3 de probabilidad; el presentador te 'regala' la información del otro 2/3 eliminando la cabra."},{"id":"tm2","titulo":"Trampa 2: El Bate y la Pelota (Efecto Reflejo)","planteamiento":"Un bate de béisbol y una pelota cuestan en total **1,10 €**.\n\nEl bate cuesta **1,00 € más que la pelota**.\n\n¿Cuánto cuesta la pelota?","pistas":["Pista 1: No respondas con el primer número intuitivo que salte a tu cabeza sin hacer la resta formal.","Pista 2: Si la pelota costase 0,10 €, y el bate cuesta 1,00 € más, el bate costaría 1,10 € y el total sería 1,20 €.","Pista 3: Plantea la ecuación: Bate + Pelota = 1,10  =>  (Pelota + 1,00) + Pelota = 1,10."],"opciones":[{"id":"diez","texto":"0,10 € (10 céntimos)","correcta":false},{"id":"cinco","texto":"0,05 € (5 céntimos)","correcta":true},{"id":"uno","texto":"0,01 € (1 céntimo)","correcta":false}],"explicacion":"¡Bien pensado! El cerebro humano adora los atajos rápidos y casi todo el mundo responde impulsivamente «10 céntimos». Pero si la pelota cuesta **0,05 €**, el bate cuesta **1,05 €** (1 € más), sumando exactamente **1,10 €**."},{"id":"tm3","titulo":"Trampa 3: La Falacia del Jugador en la Ruleta","planteamiento":"En una mesa de ruleta de casino perfectamente equilibrada, la bola ha caído en la casilla **ROJO 7 veces consecutivas**.\n\nLos jugadores a tu alrededor comienzan a apostar grandes sumas al **NEGRO**, argumentando que «por estadística ya toca que salga negro para compensar la racha».\n\n¿Cuál es la probabilidad real de que en la siguiente tirada salga NEGRO?","pistas":["Pista 1: ¿Tiene la ruleta memoria de los giros anteriores?","Pista 2: Cada tirada es un evento estadístico completamente independiente."],"opciones":[{"id":"mayor","texto":"Mucho mayor que el 50%, la ley de los grandes números debe equilibrar la racha.","correcta":false},{"id":"exacta","texto":"Exactamente la misma de siempre (~48.6% por la presencia del cero verde).","correcta":true},{"id":"menor","texto":"Menor, porque la mesa está 'en racha caliente' de rojo.","correcta":false}],"explicacion":"¡Correcto! Esta es la clásica **Falacia del Jugador**. La bola de la ruleta no tiene memoria ni conciencia; cada giro es 100% independiente. Creer que una racha anterior 'fuerza' un resultado futuro ha arruinado a miles de apostadores en la historia."},{"id":"tm4","titulo":"Trampa 4: La Paradoja de Linda (Falacia de Conjunción)","planteamiento":"Linda tiene 31 años, es soltera, abierta de mente y muy brillante. Estudió filosofía. Como estudiante, estuvo profundamente preocupada por los problemas de discriminación y justicia social, y participó en manifestaciones antinucleares.\n\n¿Cuál de las siguientes afirmaciones es **estadísticamente más probable**?","pistas":["Pista 1: Fíjate en los conjuntos matemáticos, no en la descripción narrativa del personaje.","Pista 2: La probabilidad de que ocurra un evento A siempre es mayor o igual a que ocurran A y B al mismo tiempo."],"opciones":[{"id":"a","texto":"Linda es cajera de un banco.","correcta":true},{"id":"b","texto":"Linda es cajera de un banco y está activa en el movimiento feminista.","correcta":false}],"explicacion":"¡Brillante! Esta es la famosa paradoja de Kahneman y Tversky. Aunque la descripción nos empuje a elegir la opción B, **un solo evento (ser cajera) SIEMPRE es más probable que dos eventos simultáneos (ser cajera Y además feminista)**. El subconjunto de cajeras feministas está contenido dentro del conjunto total de cajeras."},{"id":"tm5","titulo":"Trampa 5: Las 5 Máquinas de la Fábrica","planteamiento":"Si **5 máquinas** tardan **5 minutos** en fabricar **5 piezas de motor**...\n\n¿Cuánto tiempo tardarán **100 máquinas** en fabricar **100 piezas de motor**?","pistas":["Pista 1: Calcula cuánto tarda UNA sola máquina en fabricar UNA sola pieza.","Pista 2: Cada máquina trabaja en paralelo e independiente de las demás."],"opciones":[{"id":"cien","texto":"100 minutos","correcta":false},{"id":"cinco","texto":"5 minutos","correcta":true},{"id":"uno","texto":"1 minuto","correcta":false},{"id":"veinte","texto":"20 minutos","correcta":false}],"explicacion":"¡Acertaste! Si 5 máquinas hacen 5 piezas en 5 minutos, significa que **cada máquina tarda 5 minutos en completar 1 pieza**. Por tanto, 100 máquinas trabajando al unísono producirán 100 piezas en exactamente los mismos **5 minutos**."},{"id":"tm6","titulo":"Trampa 6: El Sesgo de Supervivencia","planteamiento":"Durante la Segunda Guerra Mundial, los ingenieros analizaron los aviones que regresaban del combate llenos de agujeros de bala para reforzarlos con blindaje adicional. Los impactos se concentraban en **las alas y el fuselaje central**, mientras que los motores apenas tenían impactos.\n\n¿Dónde recomendó el estadístico Abraham Wald colocar el blindaje?","pistas":["Pista 1: Recuerda que solo estaban analizando los aviones que LOGRABAN REGRESAR a la base.","Pista 2: ¿Qué pasó con los aviones a los que dispararon en los motores?"],"opciones":[{"id":"alas","texto":"En las alas y el fuselaje, donde había más impactos visibles.","correcta":false},{"id":"motores","texto":"En los motores y cabina, donde NO había impactos en los aviones que volvían.","correcta":true},{"id":"repartido","texto":"Repartido uniformemente por todo el avión a partes iguales.","correcta":false}],"explicacion":"¡Extraordinario! Wald identificó el **Sesgo del Superviviente**: los aviones con disparos en las alas podían volar de vuelta a la base; los aviones que recibían impactos en los motores caían al mar y jamás eran examinados. Había que proteger las partes 'sin agujeros'."}]},
      "monstruo-interior": {"id":"monstruo-interior","slug":"monstruo-interior","titulo":"¿Qué Criatura Mitológica Eres Según tu Forma de Estresarte?","subtitulo":"Descubre qué bestia legendaria toma el control de tu mente cuando el caos se desata.","descripcionCorta":"Test de personalidad cómica: cómo reaccionas ante los plazos de entrega, los mensajes sin responder y la falta de café.","tipo":"personalidad","categoria":"personalidad","categoriaLabel":"Personalidad & Arquetipos","icono":"🦖","tiempoMin":3,"color":"#10b981","preguntas":[{"id":"m1","texto":"Son las 18:00 y tienes una entrega crucial para mañana a las 9:00 AM. Apenas llevas un 10% hecho. ¿Cuál es tu **mecanismo de defensa**?","opciones":[{"texto":"Hundirme en las profundidades del sofá y ver 4 episodios de una serie documental sobre pingüinos.","arquetipo":"kraken"},{"texto":"Buscar en Google si el tic que tengo en el párpado es un síntoma de estrés terminal.","arquetipo":"basilisco"},{"texto":"Bloquear a todo el mundo en el móvil y amenazar con fuego a quien se acerque a mi cueva.","arquetipo":"dragon"},{"texto":"Irme a cenar tranquilamente; sé que mi verdadero poder despierta mágicamente a las 2:30 AM.","arquetipo":"fenix"}]},{"id":"m2","texto":"Te despiertas con un mensaje grupal de 47 notificaciones y un audio de 6 minutos de un familiar. ¿Qué haces?","opciones":[{"texto":"Extender mis tentáculos, archivar el chat y fingir que ese grupo jamás existió.","arquetipo":"kraken"},{"texto":"Escucharlo al 2x con taquicardia pensando que alguien ha tenido un percance grave.","arquetipo":"basilisco"},{"texto":"Responder escuetamente con un 'Ok' para proteger mi valioso tiempo como si fuera oro puro.","arquetipo":"dragon"},{"texto":"Ignorarlo todo el día y responder a las 4:00 AM con un mensaje filosófico de tres párrafos.","arquetipo":"fenix"}]},{"id":"m3","texto":"Se acaba el café en casa justo un lunes por la mañana con lluvia. ¿Cuál es tu transformación?","opciones":[{"texto":"Paralización total; me quedo es escenarios catastróficos posibles.","arquetipo":"basilisco"},{"texto":"La opción que me cueste menos dinero, menos energía y me deje más tiempo libre.","arquetipo":"dragon"},{"texto":"Tener una revelación mística a medianoche tras horas de insomnio creativo.","arquetipo":"fenix"}]},{"id":"m7","texto":"Tu entorno de trabajo o escritorio suele estar en estado de:","opciones":[{"texto":"Un arrecife caótico donde conviven tazas, libretas de 2021 y cables enredados.","arquetipo":"kraken"},{"texto":"Milimétricamente limpio porque cualquier desorden altera mi equilibrio neuronal.","arquetipo":"basilisco"},{"texto":"Rodeado de mis objetos favoritos que nadie tiene permiso para tocar o mover un milímetro.","arquetipo":"dragon"},{"texto":"Una lámpara tenue, música ambiental a oscuras y tres ventanas abiertas con ideas a medio hacer.","arquetipo":"fenix"}]},{"id":"m8","texto":"Si pudieras tener un superpoder para lidiar con el mundo moderno, ¿cuál elegirías?","opciones":[{"texto":"Hacerme invisible y sumergirme en el abismo cuando alguien me pida un favor.","arquetipo":"kraken"},{"texto":"Inmunidad total a cualquier virus, bacteria, dolor de espalda o incertidumbre vital.","arquetipo":"basilisco"},{"texto":"El poder de incinerar compromisos sociales absurdos con solo una mirada.","arquetipo":"dragon"},{"texto":"Días de 30 horas donde las 6 extra sean de noche silenciosa sin nadie molestando.","arquetipo":"fenix"}]}],"resultados":{"kraken":{"nombre":"El Kraken Procrastinador","tituloCorto":"El Señor del Abismo Cómodo","icono":"🐙","color":"#06b6d4","descripcion":"Cuando la presión aumenta, tus tentáculos se extienden en 14 direcciones simultáneas excepto en la que deberías trabajar. Tu capacidad para sumergirte en el abismo de la pereza y esquivar responsabilidades con elegancia oceánica es legendaria.","fortaleza":"Inmunidad al pánico colectivo: mientras el barco se hunde, tú estás plácidamente sumergido.","desvario":"Eres capaz de aprender ruso antiguo en Duolingo con tal de no contestar un correo urgente.","afinidad":"Alta compatibilidad con camas mullidas y mantas pesadas."},"basilisco":{"nombre":"El Basilisco Hipocondríaco","tituloCorto":"La Mirada del Hiperanálisis","icono":"🐍","color":"#10b981","descripcion":"Posees una mente analítica tan afilada que a veces te corta a ti mismo. Un leve dolor de cabeza se convierte en un diagnóstico de enciclopedia médica y un mensaje seco en una crisis diplomática. Tu mirada todo lo detecta.","fortaleza":"Capacidad de anticipación brutal: jamás te pillará desprevenido ningún imprevisto.","desvario":"Petrificas a la gente con tu sobreanálisis de conversaciones que ocurrieron en 2018.","afinidad":"Afinidad con infusiones relajantes y modos 'No Molestar' activados."},"dragon":{"nombre":"El Dragón Acaparador","tituloCorto":"El Guardián del Tiempo y la Paz","icono":"🐉","color":"#f59e0b","descripcion":"Tu mayor tesoro no es el oro ni las joyas: es tu tiempo, tu silencio y tu espacio personal. Quien ose interrumpir tu reposo en tu cueva se arriesga a una llamarada de sarcasmo cortante. Eres protector férreo de tus horas libres.","fortaleza":"Estableces límites infranqueables y sabes decir 'NO' sin que te tiemble el pulso.","desvario":"Tratas tu fin de semana como un tesoro sagrado que defenderías con fuego y garras.","afinidad":"Afinidad con la soledad reconfortante y las fortalezas inexpugnables."},"fenix":{"nombre":"El Fénix Trasnochador","tituloCorto":"El Resurgir de las 3:00 AM","icono":"🔥","color":"#ec4899","descripcion":"Durante el día eres una pila de cenizas funcionales que apenas sobrevive a las reuniones. Pero cuando cae la noche y el mundo duerme, tus llamas despiertan con una energía creativa y una lucidez asombrosa que deja a todos boquiabiertos.","fortaleza":"Productividad explosiva de última hora: resuelves en 40 minutos lo que otros tardan tres días.","desvario":"Tu reloj circadiano pertenece a otra dimensión temporal no registrada por la física moderna.","afinidad":"Afinidad con la noche silenciosa, las bombillas cálidas y las ideas brillantes."}}},
      "dilemas-morales": {"id":"dilemas-morales","slug":"dilemas-morales","titulo":"El Tranvía Desquiciado: Tu Brújula Moral al Límite","subtitulo":"6 dilemas éticos donde no hay respuesta correcta, solo consecuencias imprevisibles.","descripcionCorta":"Enfréntate a encrucijadas filosóficas extremas y descubre qué escuela de pensamiento rige tus decisiones éticas.","tipo":"personalidad","categoria":"personalidad","categoriaLabel":"Personalidad & Arquetipos","icono":"⚖️","tiempoMin":4,"color":"#f59e0b","preguntas":[{"id":"dm1","texto":"El clásico **Dilema del Tranvía**: Un tranvía descontrolado avanza hacia 5 personas atadas a la vía. Tienes una palanca: si la accionas, desviarás el tranvía a una vía secundaria donde hay **1 sola persona** atada. ¿Qué haces?","opciones":[{"texto":"Accionar la palanca sin vacilar: 5 vidas valen matemáticamente más que 1.","arquetipo":"utilitarista"},{"texto":"No tocar la palanca: participar activamente me convierte en responsable directo de un homicidio.","arquetipo":"deontologo"},{"texto":"Intentar descarrilar el tranvía lanzando una piedra a las ruedas a ver qué pasa.","arquetipo":"caos"},{"texto":"Gritar desesperadamente para avisar a todos mientras se me desgarra el alma por la situación.","arquetipo":"empatico"}]},{"id":"dm2","texto":"Un médico tiene **5 pacientes en estado crítico**, cada uno necesitando un trasplante urgente de un órgano distinto para no morir hoy. En la sala de espera hay un **viajero perfectamente sano** cuyos 5 órganos son compatibles. ¿Qué dicta tu moral?","opciones":[{"texto":"Salvar 5 sacrificando a 1 sigue siendo el mal menor matemático, aunque suene aterrador.","arquetipo":"utilitarista"},{"texto":"Jamás violar los derechos fundamentales de un inocente; el fin nunca justifica los medios.","arquetipo":"deontologo"},{"texto":"Proponerles a los 5 pacientes jugar al parchís a ver si el destino elige a otro.","arquetipo":"caos"},{"texto":"Llorar con los pacientes y acompañarles hasta el final respetando la vida de todos.","arquetipo":"empatico"}]},{"id":"dm3","texto":"Un **algoritmo de Inteligencia Artificial** te ofrece erradicar toda la delincuencia del planeta, a cambio de que todos los ciudadanos cedan el 100% de su privacidad y sus pensamientos íntimos sean monitorizados. ¿Aceptas?","opciones":[{"texto":"Acepto: la seguridad y la supervivencia de millones supera con creces el concepto de privacidad.","arquetipo":"utilitarista"},{"texto":"Rechazo categóricamente: la libertad y la dignidad individual son sagradas e inviolables.","arquetipo":"deontologo"},{"texto":"Acepto solo para ver qué cara pone la IA cuando lea los pensamientos bizarros de la humanidad.","arquetipo":"caos"},{"texto":"Me aterra el dolor de la delincuencia pero también la deshumanización; buscaría una vía intermedia.","arquetipo":"empatico"}]},{"id":"dm4","texto":"Estás en un bote salvavidas abarrotado en mitad del océano que se está hundiendo por exceso de peso. Tirar **una maleta llena de reliquias históricas invaluables** salvará a la tripulación. ¿Qué decides?","opciones":[{"texto":"Arrojar la maleta al fondo del mar al instante: el patrimonio cultural no respira, las personas sí.","arquetipo":"utilitarista"},{"texto":"La vida humana es el único deber ético primordial; la maleta va al agua sin dudar.","arquetipo":"deontologo"},{"texto":"Tirar la maleta pero quedarme con la corona de oro puesta por si acaso llegamos a una isla desierta.","arquetipo":"caos"},{"texto":"Sentir una pena inmensa por la pérdida de la historia de la humanidad mientras achico agua.","arquetipo":"empatico"}]},{"id":"dm5","texto":"Descubres que tu mejor amigo ha cometido un fraude fiscal menor para poder pagar los estudios de su hermana pequeña. Un inspector te pregunta directamente si sabes algo. ¿Qué haces?","opciones":[{"texto":"Evaluar si el beneficio social de la hermana supera el daño al estado antes de decidir.","arquetipo":"utilitarista"},{"texto":"Mentir es moralmente incorrecto por principio universal, pero la lealtad es un deber; estoy atrapado.","arquetipo":"deontologo"},{"texto":"Fingir amnesia repentina o responder en un idioma inventado para confundir al inspector.","arquetipo":"caos"},{"texto":"Proteger a mi amigo y a su hermana cueste lo que me cueste; el amor familiar está por encima.","arquetipo":"empatico"}]},{"id":"dm6","texto":"Una máquina del tiempo te permite viajar al pasado para evitar una guerra histórica, pero eso **borrará de la existencia a millones de personas actuales** (incluyéndote a ti). ¿Presionas el botón?","opciones":[{"texto":"Si el balance neto de sufrimiento global disminuye a lo largo de los siglos, presiono el botón.","arquetipo":"utilitarista"},{"texto":"No tengo derecho a decidir quién existe y quién no; el orden temporal no debe profanarse.","arquetipo":"deontologo"},{"texto":"Viajar al pasado solo para avisarles de que no inventen las reuniones de trabajo de los lunes.","arquetipo":"caos"},{"texto":"No podría soportar la idea de borrar a mis seres queridos y sus recuerdos del universo.","arquetipo":"empatico"}]}],"resultados":{"utilitarista":{"nombre":"El Utilitarista Implacable","tituloCorto":"El Matemático del Mal Menor","icono":"🧮","color":"#06b6d4","descripcion":"Para ti la moral es una ecuación de suma cero: el mayor bien para el mayor número de personas. No te tiembla el pulso al tomar decisiones difíciles porque entiendes que la inacción también tiene consecuencias medibles.","fortaleza":"Claridad analítica en situaciones de máxima crisis y liderazgo resolutivo.","desvario":"A veces suenas tan pragmático que tus amigos sospechan que eres un androide de última generación.","afinidad":"Alta afinidad con hojas de cálculo y pensadores como Jeremy Bentham."},"deontologo":{"nombre":"El Deontólogo Inquebrantable","tituloCorto":"El Guardián del Imperativo Categórico","icono":"🏛️","color":"#f59e0b","descripcion":"Crees firmemente en el deber moral, la justicia y la dignidad innegociable. Para ti hay líneas rojas que jamás deben cruzarse,       formatMarkdown(text) {
        if (!text) return '';
        const blocks = text.split(/\n\s*\n/);
        return blocks.map(block => {
          const trimmed = block.trim();
          let formatted = trimmed
            .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
            .replace(/\*(.*?)\*/g, '<em>$1</em>')
            .replace(/\n/g, '<br>');

          if (trimmed.startsWith('>')) {
            const quote = formatted.replace(/^>\s*/gm, '');
            return '<blockquote>' + quote + '</blockquote>';
          }
          if (trimmed.startsWith('- ') || trimmed.startsWith('• ') || trimmed.startsWith('* ')) {
            const items = trimmed.split(/\n/).map(line => {
              const clean = line.replace(/^[-•*]\s*/, '')
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>');
              return '<li style="margin-bottom:0.4rem;">' + clean + '</li>';
            }).join('');
            return '<ul style="margin:0.75rem 0; padding-left:1.4rem; list-style-type:disc;">' + items + '</ul>';
          }
          return '<p style="margin-bottom:0.85rem;">' + formatted + '</p>';
        }).join('');

                <div style="padding:1.25rem; background:rgba(255, 255, 255, 0.03); border-radius:var(--radius-md); border:1px solid rgba(139, 92, 246, 0.25);">
                  <div style="font-size:1.5rem; margin-bottom:0.5rem;">🧙</div>
                  <h3 style="font-size:1.05rem; font-weight:700; color:#c084fc; margin-bottom:0.4rem; font-family:var(--font-display);">Personalidad & Arquetipos</h3>

                </div>

                  <div style="font-size:1.5rem; margin-bottom:0.5rem;">🤪</div>

                  <div style="font-size:1.5rem; margin-bottom:0.5rem;">🌍</div>
                  <h3 style="font-size:1.05rem; font-weight:700; color:#fbbf24; margin-bottom:0.4rem; font-family:var(--font-display);">Curiosidades & Trivia</h3>
                  <p style="font-size:0.85rem; color:var(--text-muted); line-height:1.5;">Hechos asombrosos del mundo real donde deberás discernir entre la verdad científica, mitos urbanos arraigados y auténticos desvaríos.</p>

            <section style="margin-top:3.5rem; padding:2.5rem 1.75rem; background:var(--bg-surface-elevated); border:1px solid var(--border-subtle); border-radius:var(--radius-lg);">
              <div style="display:flex; align-items:center; gap:0.75rem; margin-bottom:1.5rem;">
                <span style="font-size:1.5rem;">❓</span>
                <h2 style="font-size:1.35rem; font-weight:700; color:#fff; font-family:var(--font-display);">Preguntas Frecuentes sobre Desvaríos Mentales</h2>
              </div>

              <div style="display:flex; flex-direction:column; gap:1.25rem;">
                <details style="background:rgba(255, 255, 255, 0.03); padding:1rem 1.25rem; border-radius:var(--radius-md); border:1px solid var(--border-subtle); cursor:pointer;">
                  <summary style="font-weight:600; color:#f1f5f9; font-size:0.98rem;">¿Qué tipo de tests encontraré en Desvaríos Mentales?</summary>
                  <p style="margin-top:0.75rem; font-size:0.88rem; color:var(--text-secondary); line-height:1.6;">Encontrarás una cuidada selección de 8 cuestionarios únicos: desde diagnósticos psicológicos de arquetipos oscuros y monstruos interiores, pasando por dilemas morales clásicos, hasta acertijos de lógica con pistas interactivas y simuladores tácticos de supervivencia.</p>

                <details style="background:rgba(255, 255, 255, 0.03); padding:1rem 1.25rem; border-radius:var(--radius-md); border:1px solid var(--border-subtle); cursor:pointer;">

                  <summary style="font-weight:600; color:#f1f5f9; font-size:0.98rem;">¿Cómo se obtienen las conclusiones de cada test?</summary>
                  <p style="margin-top:0.75rem; font-size:0.88rem; color:var(--text-secondary); line-height:1.6;">Cada respuesta asigna puntos hacia rasgos psicológicos específicos o evalúa tu razonamiento deductivo. Al finalizar, el motor genera un desglose de porcentaje de afinidad, tu arquetipo dominante, virtudes y recomendaciones con un toque mordaz y entretenido.</p>
                </details>

                <details style="background:rgba(255, 255, 255, 0.03); padding:1rem 1.25rem; border-radius:var(--radius-md); border:1px solid var(--border-subtle); cursor:pointer;">
                  <summary style="font-weight:600; color:#f1f5f9; font-size:0.98rem;">¿Puedo realizarlos desde mi teléfono móvil?</summary>
                  <p style="margin-top:0.75rem; font-size:0.88rem; color:var(--text-secondary); line-height:1.6;">Absolutamente. Toda la plataforma está optimizada para una navegación ultrarrápida y táctil en teléfonos móviles, tabletas y ordenadores de escritorio sin consumo excesivo de datos ni batería.</p>

              </div>
            </section>
          </div>
        `;
      },

      renderQuestionStep() {
        const root = document.getElementById('app-root');
        const test = this.currentTest;
        const total = test.preguntas.length;
        const q = test.preguntas[this.currentStep];
        const pct = Math.round(((this.currentStep + 1) / total) * 100);

        const optionsHtml = q.opciones.map((opt, idx) => {
          const letter = String.fromCharCode(65 + idx);
          return `
            <button class="option-btn" onclick="mentalApp.answerQuestion(${idx})">
              <span class="option-indicator">${letter}</span>
              <span>${opt.texto}</span>
            </button>
          `;
        }).join('');

        root.innerHTML = `
          <div class="runner-wrapper">
            <div class="runner-header-card">
              <span style="font-size:0.85rem; font-weight:600; color:var(--text-secondary);">${test.icono} ${test.titulo}</span>
              <div class="runner-progress-track">
                <div class="runner-progress-fill" style="width:${pct}%;"></div>
              </div>
              <span style="font-size:0.8rem; color:var(--text-muted);">${this.currentStep + 1} / ${total}</span>
            </div>

            <div class="question-card">
              <div class="question-step-badge">Pregunta ${this.currentStep + 1} de ${total}</div>
              <h2 class="question-text">${q.texto}</h2>
              <div class="options-grid">
                ${optionsHtml}
              </div>
            </div>
          </div>
        `;
      },

      renderEnigmaStep() {
        const root = document.getElementById('app-root');
        const test = this.currentTest;
        const total = test.enigmas.length;
        const enigma = test.enigmas[this.currentStep];
        const pct = Math.round(((this.currentStep + 1) / total) * 100);
        const answered = this.enigmaAnswers[this.currentStep];
        const clueCount = this.revealedClues[this.currentStep] || 0;

        let cluesHtml = '';
        if (enigma.pistas && enigma.pistas.length > 0) {
          const visibleClues = enigma.pistas.slice(0, clueCount);
          cluesHtml = `
            <div style="margin-top:1.25rem;">
              ${clueCount < enigma.pistas.length && !answered ? `
                <button class="clue-toggle-btn" onclick="mentalApp.toggleClue(${this.currentStep})">
                  <span>💡</span> <span>Revelar Pista (${clueCount + 1}/${enigma.pistas.length})</span>
                </button>
              ` : ''}
              ${visibleClues.map(c => `<div class="clue-box">🔍 ${c}</div>`).join('')}
            </div>
          `;
        }

        let feedbackHtml = '';
        if (answered) {
          feedbackHtml = `
            <div class="feedback-box ${answered.isCorrect ? 'correct' : 'incorrect'}">
              <div style="font-weight:700; font-size:1.1rem; margin-bottom:0.5rem; color:${answered.isCorrect ? '#34d399' : '#f87171'};">
                ${answered.isCorrect ? '✨ ¡Respuesta Correcta!' : '❌ Respuesta Incorrecta'}
              </div>
              <p style="font-size:0.95rem; line-height:1.6; white-space:pre-line;">${enigma.explicacion}</p>
              <button class="btn-result-main" style="margin-top:1.25rem;" onclick="mentalApp.nextEnigma()">
                <span>${this.currentStep + 1 < total ? 'Siguiente Enigma ➜' : 'Ver Puntuación Final 🏆'}</span>
              </button>
            </div>
          `;
        }

        const optionsHtml = enigma.opciones.map((opt, idx) => {
          let extraStyle = '';
          if (answered) {
            if (opt.correcta) {
              extraStyle = 'border-color:#10b981; background:rgba(16,185,129,0.15);';
            } else if (answered.selectedId === opt.id) {
              extraStyle = 'border-color:#ef4444; background:rgba(239,68,68,0.15);';
            } else {
              extraStyle = 'opacity:0.5;';
            }
          }

          return `
            <button class="option-btn" style="${extraStyle}" onclick="mentalApp.selectEnigmaOption(${this.currentStep}, '${opt.id}')" ${answered ? 'disabled' : ''}>
              <span class="option-indicator">${idx + 1}</span>
              <span>${opt.texto}</span>
            </button>
          `;
        }).join('');

        root.innerHTML = `
          <div class="runner-wrapper">
            <div class="runner-header-card">
              <span style="font-size:0.85rem; font-weight:600; color:var(--text-secondary);">🧩 ${enigma.titulo}</span>
              <div class="runner-progress-track">
                <div class="runner-progress-fill" style="width:${pct}%;"></div>
              </div>
              <span style="font-size:0.8rem; color:var(--text-muted);">${this.currentStep + 1} / ${total}</span>
            </div>

            <div class="question-card">
              <h2 class="question-text" style="white-space:pre-line; font-family:var(--font-reading); font-size:1.25rem; font-weight:400; line-height:1.7;">${enigma.planteamiento}</h2>
              ${cluesHtml}
              <div class="options-grid" style="margin-top:1rem;">
                ${optionsHtml}
              </div>
              ${feedbackHtml}
            </div>
          </div>
        `;
      },

      renderResult() {
        const root = document.getElementById('app-root');
        const test = this.currentTest;

        if (window.DesvariosAuth) {
          window.DesvariosAuth.unlockMedal('mental-arquetipo');
          if (test && (test.slug === 'test-dilemas-morales' || test.slug === 'dilemas-morales')) {
            window.DesvariosAuth.unlockMedal('mental-filosofo');
          }
        }

        if (test.tipo === 'personalidad') {
          const counts = {};
          this.userAnswers.forEach(opt => {
            counts[opt.arquetipo] = (counts[opt.arquetipo] || 0) + 1;
          });

          let topArquetipo = Object.keys(counts).reduce((a, b) => counts[a] > counts[b] ? a : b, 'erudito');
          const res = test.resultados[topArquetipo] || test.resultados.erudito;

          this.fireConfetti();

          root.innerHTML = `
            <div class="runner-wrapper">
              <div class="result-card" style="border-color:${res.color};">
                <span class="result-icon-large">${res.icono}</span>
                <div>
                  <span class="result-badge" style="background:${res.color}22; color:${res.color}; border:1px solid ${res.color}55;">
                    Tu Arquetipo Dominante
                  </span>
                </div>
                <h1 class="result-title">${res.nombre}</h1>
                <div class="result-subtitle">«${res.tituloCorto}»</div>

                <div class="result-desc">
                  ${res.descripcion}
                </div>

                <div class="result-traits-grid">
                  <div class="result-trait-box">
                    <div class="result-trait-label">⚔️ Mayor Fortaleza</div>
                    <div class="result-trait-val">${res.fortaleza}</div>
                  </div>
                  <div class="result-trait-box">
                    <div class="result-trait-label">🌀 Tu Desvarío Oculto</div>
                    <div class="result-trait-val">${res.desvario}</div>
                  </div>
                </div>

                <div style="font-size:0.88rem; color:var(--text-muted); margin-bottom:1.5rem;">
                  ✨ ${res.afinidad}
                </div>

                <div class="result-actions">
                  <button class="btn-result-main" onclick="mentalApp.startTest('${test.slug}')">↺ Repetir Test</button>
                  <button class="btn-secondary" style="padding:0.85rem 1.4rem;" onclick="mentalApp.showCatalog()">🧪 Explorar más tests</button>
                </div>
              </div>
            </div>
          `;
        } else if (test.tipo === 'puntuacion') {
          const totalPoints = this.userAnswers.reduce((sum, opt) => sum + (opt.puntos || 0), 0);
          const range = test.rangos.find(r => totalPoints >= r.min && totalPoints <= r.max) || test.rangos[0];

          this.fireConfetti();

          root.innerHTML = `
            <div class="runner-wrapper">
              <div class="result-card" style="border-color:${range.color};">
                <span class="result-icon-large">${range.icono}</span>
                <div>
                  <span class="result-badge" style="background:${range.color}22; color:${range.color}; border:1px solid ${range.color}55;">
                    ${range.nivel} — ${totalPoints} Puntos
                  </span>
                </div>
                <h1 class="result-title">${range.titulo}</h1>

                <div class="result-desc">
                  ${range.descripcion}
                </div>

                <div class="result-traits-grid">
                  <div class="result-trait-box" style="grid-column: 1 / -1;">
                    <div class="result-trait-label">💡 Consejo de los Sabios</div>
                    <div class="result-trait-val">${range.consejo}</div>
                  </div>
                </div>

                <div class="result-actions">
                  <button class="btn-result-main" onclick="mentalApp.startTest('${test.slug}')">↺ Volver a diagnosticar</button>
                  <button class="btn-secondary" style="padding:0.85rem 1.4rem;" onclick="mentalApp.showCatalog()">🧪 Otros tests</button>
                </div>
              </div>
            </div>
          `;
        }
      },

      renderEnigmaFinalSummary() {
        const root = document.getElementById('app-root');
        const test = this.currentTest;
        const total = test.enigmas.length;
        let correctCount = 0;
        for (let i = 0; i < total; i++) {
          if (this.enigmaAnswers[i] && this.enigmaAnswers[i].isCorrect) {
            correctCount++;
          }
        }

        let rankTitle = 'Aprendiz de Deducción';
        let rankIcon = '🧐';
        let rankColor = '#f59e0b';
        let rankDesc = 'Has superado algunos enigmas, pero aún quedan misterios que se resisten a tu lógica.';

        if (correctCount === 5) {
          rankTitle = 'Gran Maestro de la Lógica';
          rankIcon = '👑';
          rankColor = '#10b981';
          rankDesc = '¡Impresionante! Has resuelto los 5 enigmas sin caer en ninguna de las trampas deductivas. Tu mente es prodigiosa.';
        } else if (correctCount >= 3) {
          rankTitle = 'Erudito Sagaz';
          rankIcon = '⚡';
          rankColor = '#06b6d4';
          rankDesc = 'Muy buen desempeño analítico. Posees un pensamiento lateral agudo y gran capacidad deductiva.';
        }

        if (correctCount >= 3) {
          this.fireConfetti();
        }

        root.innerHTML = `
          <div class="runner-wrapper">
            <div class="result-card" style="border-color:${rankColor};">
              <span class="result-icon-large">${rankIcon}</span>
              <div>
                <span class="result-badge" style="background:${rankColor}22; color:${rankColor}; border:1px solid ${rankColor}55;">
                  Puntuación: ${correctCount} de ${total} Aciertos
                </span>
              </div>
              <h1 class="result-title">${rankTitle}</h1>

              <div class="result-desc">
                ${rankDesc}
              </div>

              <div class="result-actions">
                <button class="btn-result-main" onclick="mentalApp.startTest('${test.slug}')">↺ Reintentar Enigmas</button>
                <button class="btn-secondary" style="padding:0.85rem 1.4rem;" onclick="mentalApp.showCatalog()">🧪 Más Desvaríos Mentales</button>
              </div>
            </div>
          </div>
        `;
      },

      fireConfetti() {
        const canvas = document.getElementById('confetti-canvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const pieces = [];
        const colors = ['#06b6d4', '#a855f7', '#10b981', '#ffffff', '#f59e0b'];

        for (let i = 0; i < 70; i++) {
          pieces.push({
            x: canvas.width / 2,
            y: canvas.height * 0.6,
            vx: (Math.random() - 0.5) * 12,
            vy: (Math.random() - 0.8) * 14,
            size: Math.random() * 8 + 4,
            color: colors[Math.floor(Math.random() * colors.length)],
            rotation: Math.random() * 360,
            vRot: (Math.random() - 0.5) * 10
          });
        }

        let animationFrame;
        let count = 0;

        function update() {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          pieces.forEach(p => {
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.35;
            p.rotation += p.vRot;

            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate((p.rotation * Math.PI) / 180);
            ctx.fillStyle = p.color;
            ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
            ctx.restore();
          });

          count++;
          if (count < 140) {
            animationFrame = requestAnimationFrame(update);
          } else {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
          }
        }

        update();
      }
    };

    document.addEventListener('DOMContentLoaded', () => {
      mentalApp.init();
    });
  </script>
