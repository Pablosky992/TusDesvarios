<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-cyber-cyborg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>
    <filter id="glow-cyber-cyborg" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#ef4444" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Background circle -->
  <circle cx="40" cy="40" r="37" fill="url(#bg-cyber-cyborg)" stroke="#ef4444" stroke-width="2.5" filter="url(#glow-cyber-cyborg)"/>
  <!-- Artwork -->
  <g filter="url(#glow-cyber-cyborg)">
    <!-- Cyberpunk Head with Visor -->
      <rect x="27" y="25" width="26" height="30" rx="6" fill="#374151"/>
      <rect x="25" y="34" width="30" height="8" rx="3" fill="#ef4444" stroke="#fca5a5" stroke-width="1.2"/>
      <line x1="28" y1="38" x2="52" y2="38" stroke="#fff" stroke-width="1.5"/>
      <!-- Tech lines -->
      <path d="M40 46 L40 52 M34 48 L34 52 M46 48 L46 52" stroke="#9ca3af" stroke-width="1.5"/>
      <circle cx="22" cy="38" r="3" fill="#06b6d4"/>
      <circle cx="58" cy="38" r="3" fill="#06b6d4"/>
