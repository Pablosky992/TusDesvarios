<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-cosmic-portal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0a0a23"/>
    </radialGradient>
    <filter id="glow-cosmic-portal" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#6366f1" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Background circle -->
  <circle cx="40" cy="40" r="37" fill="url(#bg-cosmic-portal)" stroke="#6366f1" stroke-width="2.5" filter="url(#glow-cosmic-portal)"/>
  <!-- Artwork -->
  <g filter="url(#glow-cosmic-portal)">
    <!-- Dimensional Portal Vortex -->
      <ellipse cx="40" cy="40" rx="20" ry="10" fill="none" stroke="#818cf8" stroke-width="2.5" transform="rotate(-25 40 40)"/>
      <ellipse cx="40" cy="40" rx="14" ry="6" fill="none" stroke="#c084fc" stroke-width="2" transform="rotate(-25 40 40)"/>
      <circle cx="40" cy="40" r="5" fill="#ffffff" filter="drop-shadow(0 0 6px #6366f1)"/>
      <!-- Little stars -->
      <circle cx="25" cy="26" r="1.5" fill="#fff"/>
      <circle cx="54" cy="24" r="1" fill="#fff"/>
      <circle cx="56" cy="52" r="1.5" fill="#fff"/>
      <circle cx="24" cy="54" r="1" fill="#fff"/>
  </g>
</svg>