  <script>
    const TEST_DATA = {"id":"acertijos-pensamiento-lateral","slug":"acertijos-pensamiento-lateral","titulo":"Desafío de Pensamiento Lateral: Acertijos que Rompen la Lógica Lineal","subtitulo":"6 enigmas desconcertantes donde la deducción evidente es siempre una trampa.","descripcionCorta":"Pon a prueba tu creatividad e intuición deductiva frente a paradojas situacionales con pistas progresivas y explicaciones reveladoras.","tipo":"enigma","categoria":"logica","categoriaLabel":"Lógica & Pensamiento Lateral","icono":"🧩","tiempoMin":5,"color":"#0ea5e9","enigmas":[{"id":"pl1","titulo":"Enigma 1: El Hombre del Rascacielos y los Días Lluviosos","planteamiento":"Un hombre vive en el **piso 20** de un lujoso edificio residencial.\n\nCada mañana toma el ascensor en el piso 20 y baja hasta la planta baja para ir a trabajar.\n\nPor la tarde, al regresar:\n- Si ha llovido o si hay más personas en el ascensor, sube directamente hasta el **piso 20**.\n- Si hace sol y sube completamente solo, viaja en ascensor hasta el **piso 10**, sale y sube los últimos 10 pisos **a pie por las escaleras**.\n\n¿Por qué hace esto si odia hacer ejercicio?","pistas":["Pista 1: El ascensor funciona a la perfección y no tiene restricciones horarias.","Pista 2: La lluvia no afecta a la maquinaria del edificio ni a su salud física.","Pista 3: ¿Qué lleva una persona en la mano los días de lluvia que no suele llevar los días soleados?"],"opciones":[{"id":"claustro","texto":"Sufre de una fobia rara que solo se activa a partir del piso 10 si no hay testigos.","correcta":false},{"id":"estatura","texto":"Es una persona de muy baja estatura (o un niño) y solo llega al botón 20 con el paraguas o si alguien se lo pulsa.","correcta":true},{"id":"electricidad","texto":"El ascensor corta la energía a partir del piso 10 los días soleados por ahorro solar.","correcta":false}],"explicacion":"¡Brillante deducción lateral! El hombre tiene una estatura muy reducida (o padece enanismo). En el panel de la botonera, sus brazos solo alcanzan hasta el botón del **piso 10**. Si sube con otros vecinos, les pide amablemente que pulsen el 20. Si llueve, utiliza la punta alargada de su **paraguas** para pulsar el botón 20. Los días soleados y en soledad, no tiene cómo alcanzarlo y se ve obligado a caminar desde el 10."},{"id":"pl2","titulo":"Enigma 2: El Contraseña Secreta en la Puerta del Castillo","planteamiento":"Un espía intenta infiltrarse en una fortaleza custodiada por centinelas. Para entrar se requiere una contraseña verbal. Se oculta tras un arbusto para escuchar el santo y seña:\n\n1. Llega un mercader. El centinela dice: *«OCHO»*, el mercader responde *«CUATRO»* y le permiten pasar.\n2. Llega un noble. El centinela dice: *«CATORCE»*, el noble responde *«SIETE»* y le permiten pasar.\n\nEl espía sonríe creyendo haber descubierto la regla matemática: basta con responder la mitad del número. Se acerca con paso firme. El guardia le dice: *«SEIS»*. El espía responde ufano: *«TRES»*.\n\nEl guardia desenvaina su espada y lo arresta de inmediato. ¿Cuál era la respuesta correcta y por qué?","pistas":["Pista 1: Olvídate de la aritmética (dividir entre dos fue una coincidencia calculada).","Pista 2: La regla tiene que ver con las palabras en sí mismas, no con su valor numérico.","Pista 3: Cuenta las letras de la palabra «O-C-H-O» y las letras de «C-A-T-O-R-C-E»."],"opciones":[{"id":"cuatro","texto":"«CUATRO» (Porque la palabra 'SEIS' tiene 4 letras).","correcta":true},{"id":"cero","texto":"«CERO» (Porque 6 menos 6 es la clave de equilibrio).","correcta":false},{"id":"dos","texto":"«DOS» (Porque la serie numérica desciende en números pares).","correcta":false}],"explicacion":"¡Magistral! El centinela no pedía la mitad matemática, sino el **número de letras de la palabra pronunciada**:\n- «O-C-H-O» tiene **4** letras.\n- «C-A-T-O-R-C-E» tiene **7** letras.\n- «S-E-I-S» tiene **4** letras.\nEl espía cayó en la trampa del sesgo de confirmación numérico y respondió «tres» en vez de **«cuatro»**."},{"id":"pl3","titulo":"Enigma 3: La Cabaña Helada en la Ventisca","planteamiento":"Te encuentras atrapado en un refugio de montaña en mitad de una tormenta de nieve feroz. La temperatura está bajo cero y no tienes calefacción.\n\nEn la habitación hay tres cosas apagadas que podrían darte luz y calor:\n1. Una **lámpara de aceite de ballena**.\n2. Una **chimenea de leña seca** preparada con astillas.\n3. Una **vela de cera gruesa**.\n\nEn tu mano solo te queda **una única cerilla de madera**. ¿Qué debes encender primero?","pistas":["Pista 1: Analiza la secuencia física y literal de los acontecimientos.","Pista 2: Ninguno de los tres artefactos puede prenderse por combustión espontánea.","Pista 3: ¿Qué tiene que estar ardiendo antes de que cualquier otra cosa arda?"],"opciones":[{"id":"vela","texto":"La vela, porque es la más fácil de transportar para prender lo demás.","correcta":false},{"id":"cerilla","texto":"La cerilla.","correcta":true},{"id":"chimenea","texto":"La chimenea, porque el frío te matará en minutos si no calientas la estancia.","correcta":false}],"explicacion":"¡Exacto! El cerebro humano tiende a saltar directamente a evaluar las opciones complejas (la vela, el aceite o la leña) olvidando el requisito físico inicial indispensable: **lo primero que tienes que encender es la cerilla**, sin la cual no podrás prender absolutamente nada más."},{"id":"pl4","titulo":"Enigma 4: El Naufragio en el Desierto","planteamiento":"En mitad de las dunas interminables del desierto de Atacama, a más de 300 kilómetros de cualquier rastro de civilización o de agua, se encuentra el cadáver de un hombre.\n\n- Está desnudo y no tiene marcas de violencia ni mordeduras de serpiente.\n- En su mano derecha sostiene con fuerza **medio fósforo quemado**.\n- No hay huellas de pisadas en la arena a su alrededor.\n\n¿Cómo murió y qué significa el medio fósforo?","pistas":["Pista 1: El hombre no llegó caminando por tierra.","Pista 2: Viajaba acompañado en el aire.","Pista 3: El vehículo aéreo comenzó a perder altura de forma catastrófica y tiraron todo el lastre posible, incluida la ropa."],"opciones":[{"id":"globo","texto":"Iba en un globo aerostático averiado; echaron a suertes con fósforos quién debía saltar para salvar a los demás.","correcta":true},{"id":"avion","texto":"Cayó de un avión comercial tras intentar incendiar los motores de emergencia.","correcta":false},{"id":"sol","texto":"Murió por insolación tras encender una fogata nocturna para pedir auxilio.","correcta":false}],"explicacion":"¡Impecable pensamiento lateral! El hombre viajaba en un **globo aerostático** con varios tripulantes. El globo sufrió una fuga y comenzó a precipitarse. Arrojaron todo el lastre posible (equipaje, provisiones y hasta su ropa), pero no fue suficiente. Al ver que se estrellarían todos, decidieron sacar pajitas partiendo un fósforo en dos: al hombre le tocó el fósforo corto/quemado y tuvo que sacrificarse saltando al vacío para que el resto sobreviviera."},{"id":"pl5","titulo":"Enigma 5: La Extraña Paradoja de los Dos Gemelos","planteamiento":"Dos gemelos idénticos nacieron de la misma madre biológica en el mismo parto con apenas 20 minutos de diferencia.\n\nSin embargo, el gemelo que nació **más tarde cronológicamente** celebra su cumpleaños oficial dos días antes en el calendario legal civil que su hermano mayor.\n\n¿Cómo es esto posible sin que haya ningún error burocrático?","pistas":["Pista 1: El parto tuvo lugar en un medio de transporte en movimiento constante.","Pista 2: Involucra geografía planetaria y husos horarios.","Pista 3: Piensa en la Línea Internacional de Cambio de Fecha en el Océano Pacífico."],"opciones":[{"id":"bisiesto","texto":"Uno nació el 28 de febrero y el otro el 29 en año bisiesto.","correcta":false},{"id":"fecha","texto":"Nacieron en un barco cruzando la Línea Internacional de Cambio de Fecha de oeste a este en Nochevieja.","correcta":true},{"id":"adopcion","texto":"Fueron adoptados por familias en hemisferios opuestos con estaciones invertidas.","correcta":false}],"explicacion":"¡Asombrosa deducción! El parto ocurrió a bordo de un barco o avión que cruzaba la **Línea Internacional de Cambio de Fecha** justo a medianoche del 31 de diciembre al 1 de enero. El primer gemelo nació a las 23:50 del 1 de marzo en el lado oeste; el barco cruzó la línea hacia el este (donde era todavía 28 de febrero), y 20 minutos después nació el segundo hermano. Legalmente, el menor nació en una fecha anterior en el calendario."},{"id":"pl6","titulo":"Enigma 6: El Asesinato en la Habitación Cerrada","planteamiento":"Un hombre es hallado muerto ahorcado de una viga en el centro de una habitación completamente vacía y sellada por dentro:\n\n- Las ventanas están enrejadas y la puerta tiene el cerrojo echado desde el interior.\n- No hay mesas, sillas, escaleras ni muebles en toda la estancia.\n- Los pies del hombre cuelgan a **medio metro del suelo**.\n- Justo debajo de él hay un gran charco de agua limpia en el suelo.\n\n¿Cómo logró colgarse sin ningún apoyo donde subirse?","pistas":["Pista 1: El agua del suelo no vino de ninguna gotera ni tubería.","Pista 2: La materia cambia de estado físico con el tiempo y la temperatura.","Pista 3: ¿Qué objeto sólido y alto se transforma en un charco de agua líquida al cabo de unas horas?"],"opciones":[{"id":"hielo","texto":"Se subió sobre un gran bloque de hielo que se derritió por completo tras su muerte.","correcta":true},{"id":"cuerda","texto":"Saltó desde la ventana y la elasticidad de la soga lo impulsó hacia el centro.","correcta":false},{"id":"inundacion","texto":"La habitación se inundó previamente y flotó hasta colocar la soga.","correcta":false}],"explicacion":"¡Un clásico inmortal del misterio deductivo! El hombre se subió a un **gran bloque de hielo macizo**. Una vez colocada y tensada la soga al cuello, la temperatura ambiente del cuarto derritió paulatinamente el bloque de hielo con el paso de las horas, dejando el cuerpo suspendido a medio metro y solo un inocente charco de agua en el suelo."}]};

    const mentalApp = {
      currentTest: TEST_DATA,
      currentStep: 0,
      userAnswers: [],
      revealedClues: {},
      enigmaAnswers: {},

      init() {
        if (this.currentTest.tipo === 'enigma') {
          this.renderEnigmaStep();
        } else {
          this.renderQuestionStep();
        }
      },

      // --- Personality & Score Flow ---
      answerQuestion(optionIndex) {
        const q = this.currentTest.preguntas[this.currentStep];
        const opt = q.opciones[optionIndex];
        this.userAnswers.push(opt);

        this.currentStep++;
        if (this.currentStep < this.currentTest.preguntas.length) {
          this.renderQuestionStep();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        } else {
          this.renderResult();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      },

      // --- Enigmas Flow ---
      toggleClue(stepIdx) {
        const currentCount = this.revealedClues[stepIdx] || 0;
        this.revealedClues[stepIdx] = currentCount + 1;
        this.renderEnigmaStep();
      },

      selectEnigmaOption(stepIdx, optionId) {
        if (this.enigmaAnswers[stepIdx]) return;
        const enigma = this.currentTest.enigmas[stepIdx];
        const selectedOpt = enigma.opciones.find(o => o.id === optionId);
        
        this.enigmaAnswers[stepIdx] = {
          selectedId: optionId,
          isCorrect: !!(selectedOpt && selectedOpt.correcta)
        };

        if (selectedOpt && selectedOpt.correcta) {
          this.fireConfetti();
        }

        this.renderEnigmaStep();
      },

      nextEnigma() {
        this.currentStep++;
        if (this.currentStep < this.currentTest.enigmas.length) {
          this.renderEnigmaStep();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        } else {
          this.renderEnigmaFinalSummary();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      },

      restart() {
        this.currentStep = 0;
        this.userAnswers = [];
        this.revealedClues = {};
        this.enigmaAnswers = {};
        if (this.currentTest.tipo === 'enigma') {
          this.renderEnigmaStep();
        } else {
          this.renderQuestionStep();
        }
        window.scrollTo({ top: 0, behavior: 'smooth' });
      },

      formatMarkdown(text) {
        if (!text) return '';
        const blocks = text.split(/\n\s*\n/);
        return blocks.map(block => {
          const trimmed = block.trim();
          let formatted = trimmed
            .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
            .replace(/\*(.*?)\*/g, '<em>$1</em>')
            .replace(/\n/g, '<br>');

          if (trimmed.startsWith('>')) {
            const quote = formatted.replace(/^>\s*/gm, '');
            return '<blockquote>' + quote + '</blockquote>';
          }
          if (trimmed.startsWith('- ') || trimmed.startsWith('• ') || trimmed.startsWith('* ')) {
            const items = trimmed.split(/\n/).map(line => {
              const clean = line.replace(/^[-•*]\s*/, '')
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>');
              return '<li style="margin-bottom:0.4rem;">' + clean + '</li>';
            }).join('');
            return '<ul style="margin:0.75rem 0; padding-left:1.4rem; list-style-type:disc;">' + items + '</ul>';
          }
          return '<p style="margin-bottom:0.85rem;">' + formatted + '</p>';
        }).join('');
      },

      renderQuestionStep() {
        const root = document.getElementById('app-root');
        const test = this.currentTest;
        const total = test.preguntas.length;
        const q = test.preguntas[this.currentStep];
        const pct = Math.round(((this.currentStep + 1) / total) * 100);

        const optionsHtml = q.opciones.map((opt, idx) => {
          const letter = String.fromCharCode(65 + idx);
          return `
            <button class="option-btn" onclick="mentalApp.answerQuestion(${idx})">
              <span class="option-indicator">${letter}</span>
              <span>${opt.texto}</span>
            </button>
          `;
        }).join('');

        root.innerHTML = `
          <div class="runner-wrapper">
            <div style="margin-bottom:1rem;">
              <a href="desvarios-mentales.html" class="btn-secondary" style="font-size:0.82rem;">
                ← Volver a Todos los Tests
              </a>
            </div>

            <div class="runner-header-card">
              <span style="font-size:0.85rem; font-weight:600; color:var(--text-secondary);">${test.icono} Desafío de Pensamiento Lateral: Acertijos que Rompen la Lógica Lineal</span>
              <div class="runner-progress-track">
                <div class="runner-progress-fill" style="width:${pct}%;"></div>
              </div>
              <span style="font-size:0.8rem; color:var(--text-muted);">${this.currentStep + 1} / ${total}</span>
            </div>

            <div class="question-card">
              <div class="question-step-badge">Pregunta ${this.currentStep + 1} de ${total}</div>
              <div class="question-text">${this.formatMarkdown(q.texto)}</div>
              <div class="options-grid">
                ${optionsHtml}
              </div>
            </div>
          </div>
        `;
      },

      renderEnigmaStep() {
        const root = document.getElementById('app-root');
        const test = this.currentTest;
        const total = test.enigmas.length;
        const enigma = test.enigmas[this.currentStep];
        const pct = Math.round(((this.currentStep + 1) / total) * 100);
        const answered = this.enigmaAnswers[this.currentStep];
        const clueCount = this.revealedClues[this.currentStep] || 0;

        let cluesHtml = '';
        if (enigma.pistas && enigma.pistas.length > 0) {
          const visibleClues = enigma.pistas.slice(0, clueCount);
          cluesHtml = `
            <div style="margin-top:1.25rem;">
              ${clueCount < enigma.pistas.length && !answered ? `
                <button class="clue-toggle-btn" onclick="mentalApp.toggleClue(${this.currentStep})">
                  <span>💡</span> <span>Revelar Pista (${clueCount + 1}/${enigma.pistas.length})</span>
                </button>
              ` : ''}
              ${visibleClues.map(c => `<div class="clue-box">🔍 ${this.formatMarkdown(c)}</div>`).join('')}
            </div>
          `;
        }

        let feedbackHtml = '';
        if (answered) {
          feedbackHtml = `
            <div class="feedback-box ${answered.isCorrect ? 'correct' : 'incorrect'}">
              <div style="font-weight:700; font-size:1.1rem; margin-bottom:0.5rem; color:${answered.isCorrect ? '#34d399' : '#f87171'};">
                ${answered.isCorrect ? '✨ ¡Respuesta Correcta!' : '❌ Respuesta Incorrecta'}
              </div>
              <div style="font-size:0.95rem; line-height:1.6;">${this.formatMarkdown(enigma.explicacion)}</div>
              <button class="btn-result-main" style="margin-top:1.25rem;" onclick="mentalApp.nextEnigma()">
                <span>${this.currentStep + 1 < total ? 'Siguiente Pregunta ➜' : 'Ver Puntuación Final 🏆'}</span>
              </button>
            </div>
          `;
        }

        const optionsHtml = enigma.opciones.map((opt, idx) => {
          let extraStyle = '';
          if (answered) {
            if (opt.correcta) {
              extraStyle = 'border-color:#10b981; background:rgba(16,185,129,0.15);';
            } else if (answered.selectedId === opt.id) {
              extraStyle = 'border-color:#ef4444; background:rgba(239,68,68,0.15);';
            } else {
              extraStyle = 'opacity:0.5;';
            }
          }

          return `
            <button class="option-btn" style="${extraStyle}" onclick="mentalApp.selectEnigmaOption(${this.currentStep}, '${opt.id}')" ${answered ? 'disabled' : ''}>
              <span class="option-indicator">${idx + 1}</span>
              <span>${opt.texto}</span>
            </button>
          `;
        }).join('');

        root.innerHTML = `
          <div class="runner-wrapper">
            <div style="margin-bottom:1rem;">
              <a href="desvarios-mentales.html" class="btn-secondary" style="font-size:0.82rem;">
                ← Volver a Todos los Tests
              </a>
            </div>

            <div class="runner-header-card">
              <span style="font-size:0.85rem; font-weight:600; color:var(--text-secondary);">🧩 ${enigma.titulo}</span>
              <div class="runner-progress-track">
                <div class="runner-progress-fill" style="width:${pct}%;"></div>
              </div>
              <span style="font-size:0.8rem; color:var(--text-muted);">${this.currentStep + 1} / ${total}</span>
            </div>

            <div class="question-card">
              <div class="question-text" style="font-family:var(--font-reading); font-size:1.25rem; font-weight:400; line-height:1.7; color:#e2e8f0;">
                ${this.formatMarkdown(enigma.planteamiento)}
              </div>
              ${cluesHtml}
              <div class="options-grid" style="margin-top:1rem;">
                ${optionsHtml}
              </div>
              ${feedbackHtml}
            </div>
          </div>
        `;
      },

      renderResult() {
        const root = document.getElementById('app-root');
        const test = this.currentTest;

        if (window.DesvariosAuth) {
          window.DesvariosAuth.unlockMedal('mental-arquetipo');
          if (test && (test.slug === 'test-dilemas-morales' || test.slug === 'dilemas-morales')) {
            window.DesvariosAuth.unlockMedal('mental-filosofo');
          }
        }

        if (test.tipo === 'personalidad') {
          const counts = {};
          this.userAnswers.forEach(opt => {
            counts[opt.arquetipo] = (counts[opt.arquetipo] || 0) + 1;
          });

          const keys = Object.keys(test.resultados);
          let topArquetipo = keys.reduce((a, b) => (counts[a] || 0) > (counts[b] || 0) ? a : b, keys[0]);
          const res = test.resultados[topArquetipo] || test.resultados[keys[0]];

          this.fireConfetti();

          root.innerHTML = `
            <div class="runner-wrapper">
              <div class="result-card" style="border-color:${res.color};">
                <span class="result-icon-large">${res.icono}</span>
                <div>
                  <span class="result-badge" style="background:${res.color}22; color:${res.color}; border:1px solid ${res.color}55;">
                    Tu Resultado
                  </span>
                </div>
                <h1 class="result-title">${res.nombre}</h1>
                <div class="result-subtitle">«${res.tituloCorto}»</div>

                <div class="result-desc">
                  ${this.formatMarkdown(res.descripcion)}
                </div>

                <div class="result-traits-grid">
                  <div class="result-trait-box">
                    <div class="result-trait-label">⚔️ Mayor Fortaleza</div>
                    <div class="result-trait-val">${res.fortaleza}</div>
                  </div>
                  <div class="result-trait-box">
                    <div class="result-trait-label">🌀 Tu Desvarío Oculto</div>
                    <div class="result-trait-val">${res.desvario}</div>
                  </div>
                </div>

                <div style="font-size:0.88rem; color:var(--text-muted); margin-bottom:1.5rem;">
                  ✨ ${res.afinidad}
                </div>

                <div class="result-actions">
                  <button class="btn-result-main" onclick="mentalApp.restart()">↺ Repetir Test</button>
                  <a href="desvarios-mentales.html" class="btn-secondary" style="padding:0.85rem 1.4rem;">🧪 Explorar más tests</a>
                </div>
              </div>
            </div>
          `;
        } else if (test.tipo === 'puntuacion') {
          const totalPoints = this.userAnswers.reduce((sum, opt) => sum + (opt.puntos || 0), 0);
          const range = test.rangos.find(r => totalPoints >= r.min && totalPoints <= r.max) || test.rangos[0];

          this.fireConfetti();

          root.innerHTML = `
            <div class="runner-wrapper">
              <div class="result-card" style="border-color:${range.color};">
                <span class="result-icon-large">${range.icono}</span>
                <div>
                  <span class="result-badge" style="background:${range.color}22; color:${range.color}; border:1px solid ${range.color}55;">
                    ${range.nivel} — ${totalPoints} Puntos
                  </span>
                </div>
                <h1 class="result-title">${range.titulo}</h1>

                <div class="result-desc">
                  ${this.formatMarkdown(range.descripcion)}
                </div>

                <div class="result-traits-grid">
                  <div class="result-trait-box" style="grid-column: 1 / -1;">
                    <div class="result-trait-label">💡 Consejo de los Sabios</div>
                    <div class="result-trait-val">${range.consejo}</div>
                  </div>
                </div>

                <div class="result-actions">
                  <button class="btn-result-main" onclick="mentalApp.restart()">↺ Volver a diagnosticar</button>
                  <a href="desvarios-mentales.html" class="btn-secondary" style="padding:0.85rem 1.4rem;">🧪 Otros tests</a>
                </div>
              </div>
            </div>
          `;
        }
      },

      renderEnigmaFinalSummary() {
        const root = document.getElementById('app-root');
        const test = this.currentTest;
        const total = test.enigmas.length;
        let correctCount = 0;
        for (let i = 0; i < total; i++) {
          if (this.enigmaAnswers[i] && this.enigmaAnswers[i].isCorrect) {
            correctCount++;
          }
        }

        let rankTitle = 'Mente Curiosa';
        let rankIcon = '🧐';
        let rankColor = '#f59e0b';
        let rankDesc = 'Has superado varios retos, aunque algunas trampas han conseguido despistarte.';

        const pctScore = Math.round((correctCount / total) * 100);
        if (pctScore === 100) {
          rankTitle = 'Gran Maestro de la Sabiduría';
          rankIcon = '👑';
          rankColor = '#10b981';
          rankDesc = `¡Puntuación perfecta! Has resuelto los ${total} retos sin caer en ninguna trampa. Tu agudeza mental es prodigiosa.`;
        } else if (pctScore >= 60) {
          rankTitle = 'Erudito Sagaz';
          rankIcon = '⚡';
          rankColor = '#06b6d4';
          rankDesc = `Muy buen desempeño analítico (${correctCount} de ${total} aciertos). Posees un pensamiento lateral agudo y gran capacidad deductiva.`;
        }

        if (correctCount >= Math.ceil(total / 2)) {
          this.fireConfetti();
        }
        if (window.DesvariosAuth) {
          window.DesvariosAuth.unlockMedal('mental-logica');
        }

        root.innerHTML = `
          <div class="runner-wrapper">
            <div class="result-card" style="border-color:${rankColor};">
              <span class="result-icon-large">${rankIcon}</span>
              <div>
                <span class="result-badge" style="background:${rankColor}22; color:${rankColor}; border:1px solid ${rankColor}55;">
                  Puntuación: ${correctCount} de ${total} Aciertos (${pctScore}%)
                </span>
              </div>
              <h1 class="result-title">${rankTitle}</h1>

              <div class="result-desc">
                ${rankDesc}
              </div>

              <div class="result-actions">
                <button class="btn-result-main" onclick="mentalApp.restart()">↺ Reintentar Reto</button>
                <a href="desvarios-mentales.html" class="btn-secondary" style="padding:0.85rem 1.4rem;">🧪 Más Desvaríos Mentales</a>
              </div>
            </div>
          </div>
        `;
      },

      fireConfetti() {
        const canvas = document.getElementById('confetti-canvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const pieces = [];
        const colors = ['#06b6d4', '#a855f7', '#10b981', '#ffffff', '#f59e0b'];

        for (let i = 0; i < 70; i++) {
          pieces.push({
            x: canvas.width / 2,
            y: canvas.height * 0.6,
            vx: (Math.random() - 0.5) * 12,
            vy: (Math.random() - 0.8) * 14,
            size: Math.random() * 8 + 4,
            color: colors[Math.floor(Math.random() * colors.length)],
            rotation: Math.random() * 360,
            vRot: (Math.random() - 0.5) * 10
          });
        }

        let animationFrame;
        let count = 0;

        function update() {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          pieces.forEach(p => {
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.35;
            p.rotation += p.vRot;

            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate((p.rotation * Math.PI) / 180);
            ctx.fillStyle = p.color;
            ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
            ctx.restore();
          });

          count++;
          if (count < 140) {
            animationFrame = requestAnimationFrame(update);
          } else {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
          }
        }

        update();
      }
    };

    document.addEventListener('DOMContentLoaded', () => {
      mentalApp.init();
    });
  </script>
  <script src="js/cookie-banner.js"></script>
</body>
