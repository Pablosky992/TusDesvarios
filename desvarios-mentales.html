  <script>
    const TESTS_DB = {"acertijos-pensamiento-lateral":{"id":"acertijos-pensamiento-lateral","slug":"acertijos-pensamiento-lateral","titulo":"Desafío de Pensamiento Lateral: Acertijos que Rompen la Lógica Lineal","subtitulo":"6 enigmas desconcertantes donde la deducción evidente es siempre una trampa.","descripcionCorta":"Pon a prueba tu creatividad e intuición deductiva frente a paradojas situacionales con pistas progresivas y explicaciones reveladoras.","tipo":"enigma","categoria":"logica","categoriaLabel":"Lógica & Pensamiento Lateral","icono":"🧩","tiempoMin":5,"color":"#0ea5e9","enigmas":[{"id":"pl1","titulo":"Enigma 1: El Hombre del Rascacielos y los Días Lluviosos","planteamiento":"Un hombre vive en el **piso 20** de un lujoso edificio residencial.\n\nCada mañana toma el ascensor en el piso 20 y baja hasta la planta baja para ir a trabajar.\n\nPor la tarde, al regresar:\n- Si ha llovido o si hay más personas en el ascensor, sube directamente hasta el **piso 20**.\n- Si hace sol y sube completamente solo, viaja en ascensor hasta el **piso 10**, sale y sube los últimos 10 pisos **a pie por las escaleras**.\n\n¿Por qué hace esto si odia hacer ejercicio?","pistas":["Pista 1: El ascensor funciona a la perfección y no tiene restricciones horarias.","Pista 2: La lluvia no afecta a la maquinaria del edificio ni a su salud física.","Pista 3: ¿Qué lleva una persona en la mano los días de lluvia que no suele llevar los días soleados?"],"opciones":[{"id":"claustro","texto":"Sufre de una fobia rara que solo se activa a partir del piso 10 si no hay testigos.","correcta":false},{"id":"estatura","texto":"Es una persona de muy baja estatura (o un niño) y solo llega al botón 20 con el paraguas o si alguien se lo pulsa.","correcta":true},{"id":"electricidad","texto":"El ascensor corta la energía a partir del piso 10 los días soleados por ahorro solar.","correcta":false}],"explicacion":"¡Brillante deducción lateral! El hombre tiene una estatura muy reducida (o padece enanismo). En el panel de la botonera, sus brazos solo alcanzan hasta el botón del **piso 10**. Si sube con otros vecinos, les pide amablemente que pulsen el 20. Si llueve, utiliza la punta alargada de su **paraguas** para pulsar el botón 20. Los días soleados y en soledad, no tiene cómo alcanzarlo y se ve obligado a caminar desde el 10."},{"id":"pl2","titulo":"Enigma 2: El Contraseña Secreta en la Puerta del Castillo","planteamiento":"Un espía intenta infiltrarse en una fortaleza custodiada por centinelas. Para entrar se requiere una contraseña verbal. Se oculta tras un arbusto para escuchar el santo y seña:\n\n1. Llega un mercader. El centinela dice: *«OCHO»*, el mercader responde *«CUATRO»* y le permiten pasar.\n2. Llega un noble. El centinela dice: *«CATORCE»*, el noble responde *«SIETE»* y le permiten pasar.\n\nEl espía sonríe creyendo haber descubierto la regla matemática: basta con responder la mitad del número. Se acerca con paso firme. El guardia le dice: *«SEIS»*. El espía responde ufano: *«TRES»*.\n\nEl guardia desenvaina su espada y lo arresta de inmediato. ¿Cuál era la respuesta correcta y por qué?","pistas":["Pista 1: Olvídate de la aritmética (dividir entre dos fue una coincidencia calculada).","Pista 2: La regla tiene que ver con las palabras en sí mismas, no con su valor numérico.","Pista 3: Cuenta las letras de la palabra «O-C-H-O» y las letras de «C-A-T-O-R-C-E»."],"opciones":[{"id":"cuatro","texto":"«CUATRO» (Porque la palabra 'SEIS' tiene 4 letras).","correcta":true},{"id":"cero","texto":"«CERO» (Porque 6 menos 6 es la clave de equilibrio).","correcta":false},{"id":"dos","texto":"«DOS» (Porque la serie numérica desciende en números pares).","correcta":false}],"explicacion":"¡Magistral! El centinela no pedía la mitad matemática, sino el **número de letras de la palabra pronunciada**:\n- «O-C-H-O» tiene **4** letras.\n- «C-A-T-O-R-C-E» tiene **7** letras.\n- «S-E-I-S» tiene **4** letras.\nEl espía cayó en la trampa del sesgo de confirmación numérico y respondió «tres» en vez de **«cuatro»**."},{"id":"pl3","titulo":"Enigma 3: La Cabaña Helada en la Ventisca","planteamiento":"Te encuentras atrapado en un refugio de montaña en mitad de una tormenta de nieve feroz. La temperatura está bajo cero y no tienes calefacción.\n\nEn la habitación hay tres cosas apagadas que podrían darte luz y calor:\n1. Una **lámpara de aceite de ballena**.\n2. Una **chimenea de leña seca** preparada con astillas.\n3. Una **vela de cera gruesa**.\n\nEn tu mano solo te queda **una única cerilla de madera**. ¿Qué debes encender primero?","pistas":["Pista 1: Analiza la secuencia física y literal de los acontecimientos.","Pista 2: Ninguno de los tres artefactos puede prenderse por combustión espontánea.","Pista 3: ¿Qué tiene que estar ardiendo antes de que cualquier otra cosa arda?"],"opciones":[{"id":"vela","texto":"La vela, porque es la más fácil de transportar para prender lo demás.","correcta":false},{"id":"cerilla","texto":"La cerilla.","correcta":true},{"id":"chimenea","texto":"La chimenea, porque el frío te matará en minutos si no calientas la estancia.","correcta":false}],"explicacion":"¡Exacto! El cerebro humano tiende a saltar directamente a evaluar las opciones complejas (la vela, el aceite o la leña) olvidando el requisito físico inicial indispensable: **lo primero que tienes que encender es la cerilla**, sin la cual no podrás prender absolutamente nada más."},{"id":"pl4","titulo":"Enigma 4: El Naufragio en el Desierto","planteamiento":"En mitad de las dunas interminables del desierto de Atacama, a más de 300 kilómetros de cualquier rastro de civilización o de agua, se encuentra el cadáver de un hombre.\n\n- Está desnudo y no tiene marcas de violencia ni mordeduras de serpiente.\n- En su mano derecha sostiene con fuerza **medio fósforo quemado**.\n- No hay huellas de pisadas en la arena a su alrededor.\n\n¿Cómo murió y qué significa el medio fósforo?","pistas":["Pista 1: El hombre no llegó caminando por tierra.","Pista 2: Viajaba acompañado en el aire.","Pista 3: El vehículo aéreo comenzó a perder altura de forma catastrófica y tiraron todo el lastre posible, incluida la ropa."],"opciones":[{"id":"globo","texto":"Iba en un globo aerostático averiado; echaron a suertes con fósforos quién debía saltar para salvar a los demás.","correcta":true},{"id":"avion","texto":"Cayó de un avión comercial tras intentar incendiar los motores de emergencia.","correcta":false},{"id":"sol","texto":"Murió por insolación tras encender una fogata nocturna para pedir auxilio.","correcta":false}],"explicacion":"¡Impecable pensamiento lateral! El hombre viajaba en un **globo aerostático** con varios tripulantes. El globo sufrió una fuga y comenzó a precipitarse. Arrojaron todo el lastre posible (equipaje, provisiones y hasta su ropa), pero no fue suficiente. Al ver que se estrellarían todos, decidieron sacar pajitas partiendo un fósforo en dos: al hombre le tocó el fósforo corto/quemado y tuvo que sacrificarse saltando al vacío para que el resto sobreviviera."},{"id":"pl5","titulo":"Enigma 5: La Extraña Paradoja de los Dos Gemelos","planteamiento":"Dos gemelos idénticos nacieron de la misma madre biológica en el mismo parto con apenas 20 minutos de diferencia.\n\nSin embargo, el gemelo que nació **más tarde cronológicamente** celebra su cumpleaños oficial dos días antes en el calendario legal civil que su hermano mayor.\n\n¿Cómo es esto posible sin que haya ningún error burocrático?","pistas":["Pista 1: El parto tuvo lugar en un medio de transporte en movimiento constante.","Pista 2: Involucra geografía planetaria y husos horarios.","Pista 3: Piensa en la Línea Internacional de Cambio de Fecha en el Océano Pacífico."],"opciones":[{"id":"bisiesto","texto":"Uno nació el 28 de febrero y el otro el 29 en año bisiesto.","correcta":false},{"id":"fecha","texto":"Nacieron en un barco cruzando la Línea Internacional de Cambio de Fecha de oeste a este en Nochevieja.","correcta":true},{"id":"adopcion","texto":"Fueron adoptados por familias en hemisferios opuestos con estaciones invertidas.","correcta":false}],"explicacion":"¡Asombrosa deducción! El parto ocurrió a bordo de un barco o avión que cruzaba la **Línea Internacional de Cambio de Fecha** justo a medianoche del 31 de diciembre al 1 de enero. El primer gemelo nació a las 23:50 del 1 de marzo en el lado oeste; el barco cruzó la línea hacia el este (donde era todavía 28 de febrero), y 20 minutos después nació el segundo hermano. Legalmente, el menor nació en una fecha anterior en el calendario."},{"id":"pl6","titulo":"Enigma 6: El Asesinato en la Habitación Cerrada","planteamiento":"Un hombre es hallado muerto ahorcado de una viga en el centro de una habitación completamente vacía y sellada por dentro:\n\n- Las ventanas están enrejadas y la puerta tiene el cerrojo echado desde el interior.\n- No hay mesas, sillas, escaleras ni muebles en toda la estancia.\n- Los pies del hombre cuelgan a **medio metro del suelo**.\n- Justo debajo de él hay un gran charco de agua limpia en el suelo.\n\n¿Cómo logró colgarse sin ningún apoyo donde subirse?","pistas":["Pista 1: El agua del suelo no vino de ninguna gotera ni tubería.","Pista 2: La materia cambia de estado físico con el tiempo y la temperatura.","Pista 3: ¿Qué objeto sólido y alto se transforma en un charco de agua líquida al cabo de unas horas?"],"opciones":[{"id":"hielo","texto":"Se subió sobre un gran bloque de hielo que se derritió por completo tras su muerte.","correcta":true},{"id":"cuerda","texto":"Saltó desde la ventana y la elasticidad de la soga lo impulsó hacia el centro.","correcta":false},{"id":"inundacion","texto":"La habitación se inundó previamente y flotó hasta colocar la soga.","correcta":false}],"explicacion":"¡Un clásico inmortal del misterio deductivo! El hombre se subió a un **gran bloque de hielo macizo**. Una vez colocada y tensada la soga al cuello, la temperatura ambiente del cuarto derritió paulatinamente el bloque de hielo con el paso de las horas, dejando el cuerpo suspendido a medio metro y solo un inocente charco de agua en el suelo."}]},"arquetipo-oscuro":{"id":"arquetipo-oscuro","slug":"arquetipo-oscuro","titulo":"¿Qué Arquetipo Oscuro Habita en Ti?","subtitulo":"Descubre qué fuerza primordial y secreta gobierna tus decisiones cuando nadie te observa.","descripcionCorta":"8 dilemas morales e insólitos para desentrañar tu arquetipo psicológico gótico: Alquimista, Erudito, Espectro o Guardián.","tipo":"personalidad","categoria":"personalidad","categoriaLabel":"Personalidad & Arquetipos","icono":"🧙","tiempoMin":3,"color":"#a855f7","preguntas":[{"id":"p1","texto":"Caminas de noche por un bosque en penumbra y encuentras una torre de piedra sin puertas, solo con una ventana iluminada a diez metros de altura. ¿Cuál es tu primer impulso?","opciones":[{"texto":"Buscar runas o marcas en los cimientos para comprender quién la construyó y por qué.","arquetipo":"erudito"},{"texto":"Idear un brebaje o mecanismo para trepar y obtener el poder que se oculta arriba.","arquetipo":"alquimista"},{"texto":"Rodearla en silencio, asegurándome de que nada peligroso escape de su interior.","arquetipo":"guardian"},{"texto":"Observar desde las sombras a quien vive allí, esperando el momento justo para intervenir.","arquetipo":"espectro"}]},{"id":"p2","texto":"Un coleccionista te ofrece un espejo antiguo que supuestamente muestra a tu peor enemigo sufriendo. ¿Qué respondes?","opciones":[{"texto":"«No me interesa el rencor ajeno; prefiero un artefacto que me otorgue conocimiento prohibido».","arquetipo":"erudito"},{"texto":"«Lo compraré para analizar qué leyes físicas o mágicas alteran el reflejo».","arquetipo":"alquimista"},{"texto":"«Un objeto así corrompe el alma. Debe ser destruido o custodiado bajo llave».","arquetipo":"guardian"},{"texto":"«Dámelo. La justicia poética es el mejor de los placeres».","arquetipo":"espectro"}]},{"id":"p3","texto":"En un debate acalorado donde sabes con certeza que tienes la razón absoluta, ¿cómo actúas?","opciones":[{"texto":"Expongo datos implacables, textos y pruebas irrefutables hasta desarmar su lógica.","arquetipo":"erudito"},{"texto":"Les propongo un experimento práctico: cuando fallen, aprenderán por la fuerza.","arquetipo":"alquimista"},{"texto":"Mantengo la calma para evitar que el conflicto destruya la paz del grupo.","arquetipo":"guardian"},{"texto":"Sonrío en silencio, dejo que se equivoquen y disfruto cuando todo colapsa.","arquetipo":"espectro"}]},{"id":"p4","texto":"¿Qué cualidad te resulta más imperdonable en los demás?","opciones":[{"texto":"La ignorancia voluntaria y el desprecio por la verdad.","arquetipo":"erudito"},{"texto":"El conformismo y la cobardía ante lo desconocido.","arquetipo":"alquimista"},{"texto":"La traición a la confianza y la falta de lealtad.","arquetipo":"guardian"},{"texto":"La hipocresía y la soberbia inmerecida.","arquetipo":"espectro"}]},{"id":"p5","texto":"Si pudieras obtener un don sobrenatural inmediato, ¿cuál elegirías sin dudar?","opciones":[{"texto":"Omnisciencia: poder leer cualquier lengua muerta y conocer todos los secretos de la historia.","arquetipo":"erudito"},{"texto":"Transmutación: transformar la materia y doblegar los límites de la mortalidad.","arquetipo":"alquimista"},{"texto":"Invulnerabilidad: ser un baluarte inquebrantable capaz de proteger a los míos.","arquetipo":"guardian"},{"texto":"Intangibilidad: moverme como una sombra invisible entre los vivos sin ser detectado.","arquetipo":"espectro"}]},{"id":"p6","texto":"Te confían un secreto peligroso que podría destruir a una figura poderosa. ¿Qué haces con él?","opciones":[{"texto":"Lo transcribo en clave y lo archivo en mi biblioteca secreta.","arquetipo":"erudito"},{"texto":"Busco la manera de utilizar esa información como palanca para avanzar en mis metas.","arquetipo":"alquimista"},{"texto":"Lo sepulto en el olvido para evitar que cause caos inocente.","arquetipo":"guardian"},{"texto":"Espero al momento exacto de mayor debilidad para revelarlo y ver su caída.","arquetipo":"espectro"}]},{"id":"p7","texto":"¿Cuál es tu escenario ideal para una noche de desconexión absoluta?","opciones":[{"texto":"Un sillón cómodo, lluvia golpeando el cristal y una enciclopedia de misterios.","arquetipo":"erudito"},{"texto":"Un taller o espacio creativo probando nuevas ideas hasta altas horas de la madrugada.","arquetipo":"alquimista"},{"texto":"Una fogata tranquila con las pocas personas que considero de mi más leal círculo.","arquetipo":"guardian"},{"texto":"Pasear en soledad por calles vacías y silenciosas bajo la luz de la luna.","arquetipo":"espectro"}]},{"id":"p8","texto":"Al final del camino, ¿cómo te gustaría que te recordasen?","opciones":[{"texto":"«Aquel que descubrió verdades que nadie más se atrevió a buscar».","arquetipo":"erudito"},{"texto":"«Aquel que transformó su realidad y desafió lo imposible».","arquetipo":"alquimista"},{"texto":"«El escudo inamovible que nunca abandonó a los suyos».","arquetipo":"guardian"},{"texto":"«La presencia enigmática que nadie logró doblegar ni olvidar».","arquetipo":"espectro"}]}],"resultados":{"erudito":{"nombre":"El Erudito Hereje","tituloCorto":"Buscador de Verdades Prohibidas","icono":"📜","color":"#38bdf8","descripcion":"Te impulsa una sed insaciable de conocimiento y comprensión. No aceptas dogmas ni verdades a medias; necesitas llegar a la raíz de las cosas, incluso si la respuesta resulta inquietante. Tu mente es analítica, meticulosa y profundamente estratégica.","fortaleza":"Agudeza intelectual, memoria prodigiosa y pensamiento crítico implacable.","desvario":"Tendencia a aislarte en tus pensamientos y priorizar la lógica fría sobre las emociones.","afinidad":"88% Afin con la investigación, el misterio y el análisis deductivo."},"alquimista":{"nombre":"El Alquimista Obsesivo","tituloCorto":"Transformador de la Realidad","icono":"⚗️","color":"#f59e0b","descripcion":"No te conformas con el mundo tal y como es: sientes la urgencia constante de mejorarlo, retorcerlo o reinventarlo. Eres ambicioso, creativo y posees una curiosidad que a menudo bordea la imprudencia genial.","fortaleza":"Innovación constante, tenacidad ante el fracaso y audacia transformadora.","desvario":"Impaciencia cuando los demás no siguen tu ritmo y obsesión por controlar el resultado.","afinidad":"92% Afin con la creación, la experimentación y el desafío a las normas establecidas."},"guardian":{"nombre":"El Guardián del Umbral","tituloCorto":"Baluarte de Lealtad y Orden","icono":"🛡️","color":"#10b981","descripcion":"Eres el pilar inquebrantable en medio de la tormenta. Valoras el honor, la lealtad y la protección de tu círculo más íntimo por encima de todo. Sabes guardar secretos y tu palabra tiene el peso del granito.","fortaleza":"Lealtad indomable, templanza bajo presión y sentido protector.","desvario":"Dificultad para perdonar la traición y reticencia a confiar en extraños.","afinidad":"85% Afin con el liderazgo protector, la justicia y la defensa de principios."},"espectro":{"nombre":"El Espectro Vengativo","tituloCorto":"Sombra Silenciosa e Implacable","icono":"🌑","color":"#ec4899","descripcion":"Prefieres moverte en un segundo plano, observando lo que otros pasan por alto. Posees una intuición psicológica letal: calas a las personas al instante y sabes con precisión quirúrgica dónde son vulnerables.","fortaleza":"Paciencia infinita, sutileza táctica y memoria infalible para los agravios.","desvario":"Rencor silencioso y tendencia a guardar cuentas pendientes durante años.","afinidad":"90% Afin con la psicología oscura, la discreción y el cálculo a largo plazo."}}},"brujula-moral-maquiavelica":{"id":"brujula-moral-maquiavelica","slug":"brujula-moral-maquiavelica","titulo":"La Brújula Maquiavélica: ¿Estratega Frío o Idealista Puro?","subtitulo":"Descubre qué grado de maquiavelismo, diplomacia y pragmatismo guía tus decisiones de poder y ambición.","descripcionCorta":"8 dilemas éticos y tácticos para desentrañar cómo navegas la ambición, las alianzas, las traiciones y la lucha por el poder.","tipo":"personalidad","categoria":"personalidad","categoriaLabel":"Personalidad & Psicología","icono":"♟️","tiempoMin":4,"color":"#e11d48","preguntas":[{"id":"bm1","texto":"Un rival competitivo pero respetable comete un error administrativo grave que nadie ha notado aún. Si lo denuncias en secreto, obtendrás su puesto de inmediato. ¿Qué haces?","opciones":[{"texto":"Filtro la información de forma anónima y quirúrgica. En el juego del poder, los descuidos se pagan.","arquetipo":"arquitecto"},{"texto":"Me acerco a él en privado, le advierto del error y me gano una deuda de gratitud perpetua que cobraré más adelante.","arquetipo":"diplomatico"},{"texto":"No intervengo ni me aprovecho de su desgracia; prefiero ascender únicamente por mis propios méritos y esfuerzo limpio.","arquetipo":"idealista"},{"texto":"Modifico las reglas del departamento para que ese error deje en evidencia la hipocresía de todo el sistema de ascensos.","arquetipo":"anarquista"}]},{"id":"bm2","texto":"Para lograr un proyecto que beneficiará a cientos de personas vulnerables, es estrictamente necesario prometer favores a un magnate corrupto. ¿Cómo procedes?","opciones":[{"texto":"Le prometo lo que pida; una vez cumplido el proyecto social, buscaré una cláusula legal o resquicio para neutralizar su exigencia.","arquetipo":"arquitecto"},{"texto":"Negocio un pacto ambiguo donde él sienta que gana estatus público mientras limito al máximo sus contrapartidas reales.","arquetipo":"diplomatico"},{"texto":"Me niego categóricamente. El fin noble no justifica pactar con la podredumbre moral; buscaré otra vía ética aunque tarde más.","arquetipo":"idealista"},{"texto":"Acepto la reunión, grabo en secreto sus peticiones ilícitas y las publico en redes para dinamitar su impunidad.","arquetipo":"anarquista"}]},{"id":"bm3","texto":"Descubres que un aliado cercano y leal tiene debilidades evidentes que amenazan con hundir un plan estratégico crucial. ¿Qué decisión tomas?","opciones":[{"texto":"Lo aparto fríamente a un puesto decorativo sin acceso a decisiones clave. La lealtad no compensa la incompetencia.","arquetipo":"arquitecto"},{"texto":"Hablo con él con tacto exquisito, elogiando sus virtudes y convenciéndole de que dar un paso al costado es idea suya.","arquetipo":"diplomatico"},{"texto":"Asumo el riesgo, permanezco a su lado e intento formar y blindar sus puntos débiles. La lealtad es innegociable.","arquetipo":"idealista"},{"texto":"Permito que el plan colapse si es necesario: el fracaso forzará a todos a reinventarse desde cero sin jerarquías rígidas.","arquetipo":"anarquista"}]},{"id":"bm4","texto":"En una mesa de negociación tensa, ¿cuál es tu principal arma psicológica?","opciones":[{"texto":"Tener tres planes de contingencia ocultos y saber exactamente el punto de quiebre financiero del interlocutor.","arquetipo":"arquitecto"},{"texto":"La sonrisa empática, escuchar el 80% del tiempo y hacer que la otra parte crea que ha ganado mientras cede en lo esencial.","arquetipo":"diplomatico"},{"texto":"La transparencia absoluta, los datos honestos y la coherencia moral irreprochable.","arquetipo":"idealista"},{"texto":"La imprevisibilidad radical: descolocar a todos diciendo verdades incómodas que nadie se atreve a pronunciar.","arquetipo":"anarquista"}]},{"id":"bm5","texto":"¿Qué opinión te merece la célebre máxima maquiavélica: «Vale más ser temido que amado, si no se puede ser ambas cosas»?","opciones":[{"texto":"Es una verdad sociológica indiscutible: el amor es volátil y depende del súbdito; el temor depende del soberano.","arquetipo":"arquitecto"},{"texto":"Prefiero ser indispensable: si dependen de mis contactos y mediación, no necesitan amarme ni temerme para obedecer.","arquetipo":"diplomatico"},{"texto":"Es un error destructivo a largo plazo: el respeto genuino y la admiración construyen legados duraderos; el miedo engendra rebelión.","arquetipo":"idealista"},{"texto":"Los tiranos que buscan temor siempre terminan colgados boca abajo. El poder concentrado es una farsa patética.","arquetipo":"anarquista"}]},{"id":"bm6","texto":"Tienes la oportunidad de recibir un premio prestigioso por una investigación en la que participaste, pero sabes que el mayor mérito fue de un colega tímido que no se promociona. ¿Qué haces?","opciones":[{"texto":"Acepto el foco público para posicionarme como líder y luego recompenso al colega con presupuesto y recursos entre bambalinas.","arquetipo":"arquitecto"},{"texto":"Comparto el galardón en el escenario, elogiando públicamente al colega para cultivar una imagen de líder generoso y cohesionador.","arquetipo":"diplomatico"},{"texto":"Rechazo la autoría principal y exijo que el reconocimiento y el premio íntegro se le otorguen en solitario a él.","arquetipo":"idealista"},{"texto":"Aprovecho el discurso de aceptación para denunciar cómo las academias premian el espectáculo antes que el talento real.","arquetipo":"anarquista"}]},{"id":"bm7","texto":"¿Cómo reaccionas ante una traición flagrante por parte de alguien en quien confiabas?","opciones":[{"texto":"No muestro ira. Espero pacientemente semanas o meses hasta ejecutar una respuesta fría que lo deje sin opciones.","arquetipo":"arquitecto"},{"texto":"Mantengo una cordialidad impecable mientras construyo una red de influencia que lo aísle social y laboralmente sin aspavientos.","arquetipo":"diplomatico"},{"texto":"Corto todo lazo de raíz, experimento el dolor, pero no busco venganza: ensuciarme con su fango me degradaría a su nivel.","arquetipo":"idealista"},{"texto":"Hago pública su traición con pelos y señales para que todo el mundo vea con quién tratan y arda su reputación.","arquetipo":"anarquista"}]},{"id":"bm8","texto":"Al final de tu carrera o tu vida, ¿qué epitafio te llenaría de mayor satisfacción?","opciones":[{"texto":"«Pensó cada jugada con décadas de anticipación y construyó un imperio que sobrevivió a sus enemigos».","arquetipo":"arquitecto"},{"texto":"«Nadie salió de su mesa con las manos vacías ni con rencor en el corazón; fue el gran tejedor de voluntades».","arquetipo":"diplomatico"},{"texto":"«Jamás dobló la rodilla ante el poder ni vendió su conciencia por una corona».","arquetipo":"idealista"},{"texto":"«Encendió la mecha que demolió las viejas cadenas y demostró que los reyes sangran como cualquiera».","arquetipo":"anarquista"}]}],"resultados":{"arquitecto":{"nombre":"El Arquitecto Maquiavélico","tituloCorto":"Estratega Implacable a Largo Plazo","icono":"♟️","color":"#e11d48","descripcion":"Tu mente opera como un tablero de ajedrez tridimensional. No te mueves por impulsos viscerales ni por romanticismos morales: analizas relaciones de fuerzas, costes de oportunidad y consecuencias a tres jugadas vista. Entiendes que el poder no se mendiga ni se promete, sino que se administra con frialdad matemática.","fortaleza":"Visión estratégica panorámica, dominio absoluto del autocontrol emocional y ejecución calculada.","desvario":"Riesgo de paranoia táctica, deshumanizar los vínculos y terminar rodeado de peones en lugar de amigos.","afinidad":"94% Afinidad con el liderazgo estratégico, la geopolítica y la alta dirección."},"diplomatico":{"nombre":"El Diplomático Camaleónico","tituloCorto":"Tejedor Invisible de Voluntades","icono":"🎭","color":"#f59e0b","descripcion":"Has dominado el arte supremo de Sun Tzu: vencer al enemigo sin necesidad de desenvainar la espada. Tu habilidad social, carisma adaptativo y capacidad para leer entre líneas te permiten alinear intereses opuestos haciéndoles creer que la idea fue de ellos.","fortaleza":"Persuasión empática, negociación de alto nivel y red de contactos inquebrantable.","desvario":"Dificultad para mostrar tu verdadero rostro y tendencia a sobre-adaptarte para evitar fricciones directas.","afinidad":"91% Afinidad con las relaciones públicas, la mediación de conflictos y el poder blando."},"idealista":{"nombre":"El Idealista Incorruptible","tituloCorto":"Faro Ético en Tiempos Cínicos","icono":"⚖️","color":"#10b981","descripcion":"Perteneces a esa rara estirpe que valora más dormir con la conciencia tranquila que sentarse en un trono forjado con mentiras. Tu fortaleza emana de una integridad de hierro: tus aliados saben que jamás los venderás y tus adversarios temen tu incorruptibilidad.","fortaleza":"Coherencia moral admirable, lealtad a prueba de fuego y magnetismo ético natural.","desvario":"Vulnerabilidad ante rivales despiadados que no respetan las reglas y rigidez ante compromisos pragmáticos necesarios.","afinidad":"89% Afinidad con la defensa de derechos, la justicia social y el liderazgo transformacional."},"anarquista":{"nombre":"El Disruptor del Caos","tituloCorto":"Dinamitero de Falsos Templos","icono":"🔥","color":"#8b5cf6","descripcion":"Te niegas a jugar bajo las reglas de un sistema que consideras podrido o artificial. Si el tablero está trucado, tu respuesta es patear la mesa. Eres temido porque no tienes precio: el dinero, el estatus y las condecoraciones institucionales no te seducen.","fortaleza":"Valentía suicida ante la autoridad, pensamiento lateral fuera de caja y desparpajo para decir la verdad.","desvario":"Tendencia a dinamitar puentes que aún necesitabas cruzar y dificultad para construir estructuras sostenibles.","afinidad":"93% Afinidad con la innovación radical, el periodismo de investigación y la rebelión cultural."}}},"curiosidades-insolitas":{"id":"curiosidades-insolitas","slug":"curiosidades-insolitas","titulo":"¿Mito, Realidad o Desvarío? 8 Hechos Insólitos del Mundo","subtitulo":"Adivina si estas afirmaciones históricas y científicas son 100% reales o pura invención.","descripcionCorta":"8 afirmaciones tan disparatadas que parecen ficción. Descubre si tu detector de desvaríos está bien calibrado.","tipo":"enigma","categoria":"curiosidades","categoriaLabel":"Curiosidades & Trivia","icono":"🌍","tiempoMin":4,"color":"#3b82f6","enigmas":[{"id":"ci1","titulo":"Curiosidad 1: Los Tiburones y los Árboles","planteamiento":"**Afirmación:** *«Los tiburones aparecieron en el planeta Tierra mucho antes de que existieran los primeros árboles y antes que los dinosaurios y los anillos de Saturno.»*\n\n¿Es esta afirmación Real o un Desvarío inventado?","pistas":["Pista 1: Los fósiles de escamas de tiburón más antiguos datan de hace más de 400 millones de años.","Pista 2: Las primeras plantas leñosas (árboles primitivos como Archaeopteris) aparecieron hace unos 350 millones de años."],"opciones":[{"id":"real","texto":"VERDADERO (100% Real)","correcta":true},{"id":"mito","texto":"FALSO (Mito / Desvarío)","correcta":false}],"explicacion":"¡Es 100% REAL! Los tiburones tienen más de **400 millones de años de antigüedad**, mientras que los primeros árboles aparecieron hace unos 350 millones de años y los dinosaurios hace 230 millones. ¡Los tiburones han sobrevivido a cuatro extinciones masivas!"},{"id":"ci2","titulo":"Curiosidad 2: Cleopatra y el iPhone","planteamiento":"**Afirmación:** *«La reina Cleopatra vivió cronológicamente más cerca en el tiempo del lanzamiento del primer iPhone (año 2007) que de la construcción de la Gran Pirámide de Guiza.»*\n\n¿Es esta afirmación Real o un Mito?","pistas":["Pista 1: La Gran Pirámide de Guiza fue construida hacia el año 2560 a.C.","Pista 2: Cleopatra reinó en Egipto entre el 51 a.C. y el 30 a.C."],"opciones":[{"id":"real","texto":"VERDADERO (100% Real)","correcta":true},{"id":"mito","texto":"FALSO (Mito / Desvarío)","correcta":false}],"explicacion":"¡Es 100% REAL! La Gran Pirámide se construyó en torno al 2560 a.C. (~2.500 años antes de Cleopatra). Cleopatra vivió en el año 30 a.C., es decir, a solo **2.037 años del primer iPhone (2007)**. ¡Cleopatra estaba más cerca de Steve Jobs que de los constructores de las pirámides!"},{"id":"ci3","titulo":"Curiosidad 3: La Gran Guerra del Emú","planteamiento":"**Afirmación:** *«En 1932, el ejército de Australia declaró oficialmente la guerra militar a una población de 20.000 aves emús con soldados armados con ametralladoras pesadas... y los emús ganaron la guerra.»*\n\n¿Es esto un hecho histórico o una leyenda urbana?","pistas":["Pista 1: Ocurrió en Australia Occidental tras las quejas de los granjeros por el destrozo de sus cultivos de trigo.","Pista 2: Los emús se dispersaban a gran velocidad en pequeños grupos tácticos imposibles de abatir con fuego de ametralladora."],"opciones":[{"id":"real","texto":"VERDADERO (100% Real)","correcta":true},{"id":"mito","texto":"FALSO (Mito / Desvarío)","correcta":false}],"explicacion":"¡Es 100% REAL! La **«Guerra del Emú»** de 1932 fue una operación militar oficial de Australia. Los soldados dispararon más de 10.000 proyectiles de ametralladora Lewis, pero las aves corrían a 50 km/h y esquivaban el fuego. El Mayor Meredith reconoció la derrota y retiró las tropas ante la 'astucia táctica de mando' de las aves."},{"id":"ci4","titulo":"Curiosidad 4: Las Nubes y su Peso de Pluma","planteamiento":"**Afirmación:** *«Una nube blanca esponjosa típica de verano (cúmulo de tamaño mediano) pesa menos de 50 kilogramos en total, por eso flota fácilmente en el aire.»*\n\n¿Es esta afirmación Real o un Mito científico?","pistas":["Pista 1: Una nube está compuesta por miles de millones de microgotas de agua condensada en un volumen gigantesco.","Pista 2: 1 metro cúbico de nube contiene alrededor de 0,5 gramos de agua, pero un cúmulo mide cientos de metros de ancho y alto."],"opciones":[{"id":"real","texto":"VERDADERO (100% Real)","correcta":false},{"id":"mito","texto":"FALSO (Mito / Desvarío)","correcta":true}],"explicacion":"¡Es FALSO! Un cúmulo medio pesa aproximadamente **500.000 kilogramos (unas 500 toneladas)**, ¡el equivalente a unos 100 elefantes adultos! Flota porque ese peso colosal está distribuido en millones de metros cúbicos de aire caliente y húmedo que asciende."},{"id":"ci5","titulo":"Curiosidad 5: Los Hongos y el ADN Humano","planteamiento":"**Afirmación:** *«Genéticamente y a nivel evolutivo, los seres humanos estamos más emparentados con los hongos (setas, levaduras) que los hongos con las plantas verdes.»*\n\n¿Es esta afirmación Real o un Desvarío biológico?","pistas":["Pista 1: Tanto los animales como los hongos pertenecen al supergrupo de los opistocontos (*Opisthokonta*).","Pista 2: A diferencia de las plantas, los hongos no hacen fotosíntesis y sintetizan quitina, igual que los exoesqueletos de los insectos."],"opciones":[{"id":"real","texto":"VERDADERO (100% Real)","correcta":true},{"id":"mito","texto":"FALSO (Mito / Desvarío)","correcta":false}],"explicacion":"¡Es 100% REAL! En el árbol de la vida evolutivo, el reino *Fungi* (hongos) comparte un ancestro común más reciente con el reino animal (*Animalia*) que con el reino vegetal (*Plantae*). Respiran oxígeno, no hacen fotosíntesis y comparten estructuras moleculares con los animales."},{"id":"ci6","titulo":"Curiosidad 6: La Lluvia de Peces de Yoro","planteamiento":"**Afirmación:** *«En la ciudad de Yoro (Honduras), ocurre anualmente desde hace más de un siglo un fenómeno meteorológico verificado donde llueven cientos de peces vivos del cielo tras una tormenta.»*\n\n¿Es este fenómeno Real o una fábula folclórica?","pistas":["Pista 1: El fenómeno se conoce como la 'Lluvia de Peces de Yoro' y se celebra cada año con un festival local.","Pista 2: La ciencia lo explica por trombas marinas o corrientes freáticas subterráneas que emergen tras lluvias torrenciales."],"opciones":[{"id":"real","texto":"VERDADERO (100% Real)","correcta":true},{"id":"mito","texto":"FALSO (Mito / Desvarío)","correcta":false}],"explicacion":"¡Es 100% REAL! La **Lluvia de Peces de Yoro** ocurre entre mayo y julio. Cientos de pequeños peces de agua dulce quedan esparcidos por el suelo tras tormentas devastadoras. National Geographic ha documentado el fenómeno, atribuido a tornados de agua o peces subterráneos cegados por corrientes de lluvia."},{"id":"ci7","titulo":"Curiosidad 7: La Muralla China desde el Espacio","planteamiento":"**Afirmación:** *«La Gran Muralla China es la única construcción humana que se puede ver a simple vista desde la Luna sin telescopio ni prismáticos.»*\n\n¿Es esta afirmación Real o un Mito popular?","pistas":["Pista 1: La Muralla China tiene miles de kilómetros de longitud, pero su anchura promedio es de solo 5 a 6 metros.","Pista 2: Ver algo de 6 metros de ancho desde la Luna (a 384.000 km) equivaldría a ver un cabello humano a 3 kilómetros de distancia."],"opciones":[{"id":"real","texto":"VERDADERO (100% Real)","correcta":false},{"id":"mito","texto":"FALSO (Mito / Desvarío)","correcta":true}],"explicacion":"¡Es un MITO FALSO! Astronautas como Neil Armstrong y Yang Liwei han confirmado que la Gran Muralla es completamente invisible a simple vista desde el espacio y desde la Luna, ya que sus materiales (arcilla y piedra) se mimetizan con el terreno y su anchura es de apenas unos metros."},{"id":"ci8","titulo":"Curiosidad 8: El Tiempo de los Mamuts y las Pirámides","planteamiento":"**Afirmación:** *«Aún quedaban mamuts lanudos vivos caminando por la Tierra mientras los egipcios estaban construyendo las Pirámides de Guiza.»*\n\n¿Es esta afirmación Real o un Desvarío anacrónico?","pistas":["Pista 1: Una población aislada de mamuts sobrevivió en la Isla de Wrangel (océano Ártico).","Pista 2: Esa población no se extinguió hasta aproximadamente el año 1650 a.C."],"opciones":[{"id":"real","texto":"VERDADERO (100% Real)","correcta":true},{"id":"mito","texto":"FALSO (Mito / Desvarío)","correcta":false}],"explicacion":"¡Es 100% REAL! Mientras la mayoría de mamuts continentales se extinguieron hace 10.000 años, una colonia relicta en la **Isla de Wrangel** sobrevivió hasta el año **1650 a.C.** Las pirámides de Guiza se construyeron hacia el 2560 a.C., por lo que los mamuts y los faraones compartieron el planeta durante casi mil años."}]},"detective-crimen-deduccion":{"id":"detective-crimen-deduccion","slug":"detective-crimen-deduccion","titulo":"Gabinete de Crímenes: Desafío de Deducción Sherlockiana","subtitulo":"6 escenas del crimen con pistas sutiles, coartadas contradictorias y física forense.","descripcionCorta":"Asume el rol de detective jefe: analiza los escenarios criminales, detecta inconsistencias físicas y testimoniales y desenmascara la verdad oculta.","tipo":"enigma","categoria":"logica","categoriaLabel":"Misterio & Deducción","icono":"🔍","tiempoMin":7,"color":"#6366f1","enigmas":[{"id":"det1","titulo":"Caso 1: El Despacho Insonorizado y la Grabadora de Cinta","planteamiento":"Un acaudalado inversor aparece sin vida con un disparo en la cabeza en su despacho blindado e insonorizado. Sobre la mesa de caoba descansa una grabadora de cinta magnetofónica analógica.\n\nEl detective de guardia se acerca y pulsa el botón de reproducción (*Play*). Inmediatamente se oye la voz nítida de la víctima diciendo: *«No puedo soportar la bancarrota que se avecina... perdónenme todos, hasta siempre»*. Tras un segundo de silencio atronador, se escucha el disparo en la cinta y un golpe sordo.\n\nLa policía local da el caso por cerrado como suicidio trágico. Sin embargo, el detective jefe sacude la cabeza y afirma: *«Es un asesinato por encargo. El asesino cometió un error fatal con el dispositivo»*.\n\n¿Qué detalle irrefutable descarta el suicidio?","pistas":["Pista 1: El mecanismo de una grabadora analógica de casete no tiene funciones digitales automatizadas.","Pista 2: Reflexiona sobre qué ocurre físicamente con la persona inmediatamente después de apretar el gatillo.","Pista 3: ¿En qué posición estaba la cinta cuando el detective pulsó Play al llegar?"],"opciones":[{"id":"polvora","texto":"Un disparo a corta distancia siempre impregna la cinta magnética de pólvora alterando el sonido.","correcta":false},{"id":"rebobinar","texto":"Si se hubiera suicidado mientras grababa su última nota, el muerto jamás habría podido rebobinar la cinta hasta el inicio para que el detective la escuchara desde el principio.","correcta":true},{"id":"acustica","texto":"En un despacho insonorizado la reverberación del disparo satura el micrófono y borra el audio.","correcta":false}],"explicacion":"¡Brillante ojo clínico! Si el magnate hubiera grabado su nota suicida en tiempo real y disparado, la cinta habría continuado corriendo hasta agotarse o se habría quedado parada justo al final del audio del disparo. Un cadáver no puede pulsar el botón de 'Rewind' para rebobinar la cinta hacia atrás y dejarla lista en el segundo cero. El asesino grabó o forzó la grabación, detuvo el casete, lo rebobinó torpemente para que sonara al entrar y se delató a sí mismo."},{"id":"det2","titulo":"Caso 2: El Envenenamiento del Café con Hielo","planteamiento":"Dos socias de una firma millonaria acuden a una terraza en una tarde de calor abrasador. Piden dos vasos idénticos de café americano helado con abundantes cubitos de hielo, servidos a la vez desde la misma jarra.\n\n- La socia **Laura**, con una sed insaciable, bebe a gran velocidad y se termina casi todo su vaso en menos de 40 segundos, dejando los cubitos en el fondo.\n- La socia **Marta** bebe con exquisita lentitud, dando pequeños sorbos mientras conversa durante más de 45 minutos.\n\nAl cabo de una hora, Marta sufre convulsiones y fallece por una dosis letal de cianuro concentrado, mientras que Laura no muestra ni el más mínimo síntoma de intoxicación.\n\nSi ambos vasos eran idénticos y venían de la misma preparación, ¿cómo logró el asesino que solo muriera quien bebía despacio?","pistas":["Pista 1: El veneno no estaba untado en los bordes del vaso ni en las pajitas.","Pista 2: Ni Laura ni Marta tenían inmunidad biológica ni tomaron antídotos.","Pista 3: Considera el estado del hielo a los 40 segundos frente al hielo tras 45 minutos."],"opciones":[{"id":"hielo","texto":"El veneno estaba congelado dentro de los cubitos de hielo: Laura bebió antes de que se descongelaran, mientras que en el vaso de Marta el hielo se derritió disolviendo el tóxico.","correcta":true},{"id":"velocidad","texto":"El estómago metaboliza el cianuro como glucosa si se absorbe a un ritmo superior a 100 ml por minuto.","correcta":false},{"id":"densidad","texto":"El cianuro flota en la superficie del café y Laura bebió desde el fondo con una pajita larga.","correcta":false}],"explicacion":"¡Precisión analítica impecable! El veneno fue introducido en el agua con la que se fabricaron los cubos de hielo. Cuando Laura bebió su café en apenas unos segundos, los cubos aún estaban sólidamente congelados y la sustancia tóxica no se había mezclado con el líquido. Marta, en cambio, permitió que el hielo se licuara lentamente durante tres cuartos de hora, transformando su bebida en un cóctel letalmente envenenado."},{"id":"det3","titulo":"Caso 3: La Coartada del Coche Nevado","planteamiento":"Durante una gélida noche de tormenta, cae una nevada ininterrumpida y uniforme entre las **20:00 y las 23:00** horas. A las 21:30 se comete un audaz asalto a un banco en el centro de la ciudad.\n\nLa policía acude a medianoche a la solitaria casa rural del sospechoso principal, situada a 20 kilómetros de la ciudad. El sospechoso sale en bata y asegura con desdén: *«No he salido de casa en toda la tarde ni en toda la noche; estuve leyendo junto a la chimenea»*.\n\nEl detective se asoma al camino exterior y observa el automóvil del sospechoso:\n- El techo, el capó y las ventanillas están cubiertos por una gruesa capa de 12 cm de nieve.\n- El detective toca el capó y el motor está frío como el hielo.\n\nA pesar de la nieve acumulada y el motor frío, el detective lo esposa de inmediato: *«Ese coche estuvo rodando a las 21:30»*. ¿Qué delató al sospechoso?","pistas":["Pista 1: La nieve caía de forma completamente perpendicular sin ráfagas de viento lateral.","Pista 2: La superficie del camino es de grava rústica.","Pista 3: ¿Qué había exactamente debajo de los bajos y ruedas del vehículo en el suelo?"],"opciones":[{"id":"suelo","texto":"En el suelo bajo el coche había nieve acumulada: si hubiera estado aparcado desde antes de las 20:00, el suelo bajo el chasis estaría completamente seco.","correcta":true},{"id":"cristal","texto":"El parabrisas térmico deja un patrón de descongelación visible incluso 4 horas después de apagarse.","correcta":false},{"id":"tubo","texto":"El tubo de escape siempre retiene hollín húmedo si ha circulado con temperaturas bajo cero.","correcta":false}],"explicacion":"¡Elemental deducción física! Si el automóvil hubiese estado estacionado en ese punto desde antes de que empezara a nevar a las 20:00, el chasis y la carrocería habrían actuado como un paraguas perfecto: el suelo de grava directamente debajo del coche estaría 100% seco y limpio. Si el suelo bajo el coche tenía nieve, significa que el vehículo llegó y aparcó cuando la nevada ya llevaba una hora o más cayendo con fuerza."},{"id":"det4","titulo":"Caso 4: El Mensaje en el Espejo Empañado del Baño Turco","planteamiento":"Un anciano magnate es hallado sin vida en el jacuzzi de su spa privado, ahogado en agua templada. En el gigantesco espejo de la pared, completamente cubierto por una densa capa de vaho caliente, aparece escrito con el dedo de forma trémula: *«Mi sobrino Bruno me empujó»*.\n\nBruno era el heredero universal provisional, pero el anciano tenía cita con el notario a la mañana siguiente para desheredarlo en favor de una fundación benéfica. Parecía la prueba definitiva para encarcelar a Bruno.\n\nSin embargo, el perito criminalista inspecciona el espejo durante unos segundos y declara: *«Bruno no lo empujó; alguien asesinó al anciano y preparó este mensaje falso antes del crimen para culpar al sobrino»*.\n\n¿Por qué el mensaje en el vaho delató la manipulación previa?","pistas":["Pista 1: ¿Qué le sucede al vaho de agua caliente cuando deslizas un dedo mojado sobre él?","Pista 2: La tensión superficial del agua y la condensación crean un efecto muy diferente si el cristal está frío y seco o si ya está lleno de vapor.","Pista 3: ¿Cómo permanecen las letras escritas en un cristal seco cuando posteriormente sube la humedad?"],"opciones":[{"id":"vaho_goteo","texto":"Escribir sobre un espejo ya empañado hace que las gotas resbalen en chorretones verticales deformando las letras; solo cuando se escribe en seco con la grasa del dedo las letras aparecen nítidas al subir el vapor después.","correcta":true},{"id":"altura","texto":"Los espejos de baño turco se empañan de abajo hacia arriba impidiendo escribir a la altura de los ojos.","correcta":false},{"id":"huella","texto":"El agua caliente borra de inmediato los aminoácidos de las huellas dactilares impidiendo todo trazo.","correcta":false}],"explicacion":"¡Magistral apreciación de la física de fluidos! Si una persona al borde de la muerte escribe sobre un espejo que YA está empañado por vapor hirviente, el dedo arrastra el exceso de condensado y produce regueros de agua verticales que distorsionan y borran las letras. En cambio, si alguien escribe con el dedo sobre el cristal limpio, frío y seco horas antes, la grasa natural de la piel altera la condensación superficial: cuando el spa se enciende y el vapor sube, el texto 'invisible' se revela con una nitidez perfecta. Fue una trampa orquestada con antelación."},{"id":"det5","titulo":"Caso 5: La Balística Inversa de la Ventana del Jardín","planteamiento":"En una lujosa villa de campo, el dueño de una galería de arte aparece desplomado en su sillón frente a la biblioteca con un impacto de bala en el pecho. En el centro del gran ventanal acristalado que da a un oscuro jardín trasero, hay un orificio de bala limpio.\n\nEl mayordomo testifica que vio una sombra entre los arbustos del jardín exterior, oyó una detonación y vio cómo el vidrio saltaba en pedazos cuando el asesino disparó desde fuera hacia el interior.\n\nEl detective forense no busca huellas ni casquillos: se agacha, examina el borde del orificio en el cristal y la dispersión de las astillas de vidrio en el suelo. Sin titubear, ordena la detención del mayordomo por falso testimonio y encubrimiento:\n*«La bala jamás entró desde el jardín. El disparo se hizo desde DENTRO de esta habitación hacia el exterior»*.\n\n¿Qué principio físico de la fractura del vidrio reveló la dirección del proyectil?","pistas":["Pista 1: Las balas a alta velocidad provocan una rotura asimétrica en láminas de vidrio plano.","Pista 2: La fuerza de compresión y cizallamiento genera una forma geométrica específica en el orificio.","Pista 3: Compara el diámetro y forma del orificio en la cara de impacto frente a la cara de salida."],"opciones":[{"id":"temperatura","texto":"El calor de la bala funde los bordes del vidrio en el lado donde se originó el disparo.","correcta":false},{"id":"cono_crater","texto":"Un impacto de bala crea un cráter cónico cuya base más ancha y la gran mayoría de esquirlas se proyectan siempre en la cara de salida (en este caso, hacia el césped exterior del jardín).","correcta":true},{"id":"polvora_cristal","texto":"La onda expansiva sónica empuja el marco de la ventana en ángulo obtuso hacia el tirador.","correcta":false}],"explicacion":"¡Deducción forense de libro! En balística de impacto en vidrio, el lado por donde PENETRA el proyectil presenta un orificio cilíndrico limpio y de menor diámetro. Al atravesarlo, la onda de presión expulsa una masa cónica de material hacia adelante, formando un cráter en bisel mucho más ancho en la cara de SALIDA, donde cae la gran mayoría de las esquirlas. Al hallarse el cráter cónico y las astillas en el exterior de la casa sobre el césped, la bala viajó indiscutiblemente de adentro hacia afuera."},{"id":"det6","titulo":"Caso 6: La Mentira del Testigo Ocular Nocturno","planteamiento":"A las 03:15 de una noche cerrada y sin luna, un disparo acaba con un transeúnte en una callejuela mal iluminada de la ciudad. A la mañana siguiente, la inquilina del primer piso de la finca contigua presta declaración solemne:\n\n*«Estaba profundamente dormida en mi dormitorio cuando escuché gritos en la calle. Me asusté, encendí de inmediato la lámpara del techo de mi habitación, corrí hacia la ventana cerrada y miré fijamente hacia la calle en penumbra. Vi a un hombre con una cazadora roja brillante y una cicatriz profunda en la mejilla derecha empuñar el arma y huir hacia el callejón»*.\n\nEl inspector deja su libreta sobre la mesa y le dice con una sonrisa severa:\n*«Señora, inventó esa descripción al milímetro. Usted no pudo ver el rostro ni la ropa de nadie desde esa ventana con su lámpara encendida»*.\n\n¿Por qué el inspector supo al instante que mentía?","pistas":["Pista 1: Leyes de reflexión y refracción en superficies transparentes con distinto nivel lumínico a cada lado.","Pista 2: Piensa en lo que experimentas tú mismo de noche cuando enciendes la luz de tu salón y miras a la ventana.","Pista 3: ¿Qué refleja el cristal cuando dentro hay mucha luz y fuera reina la oscuridad?"],"opciones":[{"id":"iluminacion_espejo","texto":"Al encender la potente luz de su dormitorio estando el exterior en completa oscuridad, el cristal de la ventana actúa como un espejo reflector: solo podía ver el reflejo de su propia habitación, siendo incapaz de ver el exterior.","correcta":true},{"id":"pupila","texto":"La luz artificial quema temporalmente los bastones de la retina impidiendo ver tonos rojos durante 15 minutos.","correcta":false},{"id":"angulo","texto":"Desde un primer piso el ángulo de declinación visual oculta el 80% de la acera si la ventana está cerrada.","correcta":false}],"explicacion":"¡Fenómeno óptico elemental! Cuando el interior de un recinto está vivamente iluminado y el exterior está oscuro, la cantidad de luz que se refleja en la superficie del cristal hacia adentro es cientos de veces más intensa que la escasa luz que ingresa desde el exterior. El cristal se transforma en un espejo casi perfecto de la habitación. Salvo que hubiera apagado la luz o pegado el rostro al vidrio cubriendo toda iluminación con las manos, era ópticamente imposible distinguir colores o rasgos en la calle oscura."}]},"dilemas-morales":{"id":"dilemas-morales","slug":"dilemas-morales","titulo":"El Tranvía Desquiciado: Tu Brújula Moral al Límite","subtitulo":"6 dilemas éticos donde no hay respuesta correcta, solo consecuencias imprevisibles.","descripcionCorta":"Enfréntate a encrucijadas filosóficas extremas y descubre qué escuela de pensamiento rige tus decisiones éticas.","tipo":"personalidad","categoria":"personalidad","categoriaLabel":"Personalidad & Arquetipos","icono":"⚖️","tiempoMin":4,"color":"#f59e0b","preguntas":[{"id":"dm1","texto":"El clásico **Dilema del Tranvía**: Un tranvía descontrolado avanza hacia 5 personas atadas a la vía. Tienes una palanca: si la accionas, desviarás el tranvía a una vía secundaria donde hay **1 sola persona** atada. ¿Qué haces?","opciones":[{"texto":"Accionar la palanca sin vacilar: 5 vidas valen matemáticamente más que 1.","arquetipo":"utilitarista"},{"texto":"No tocar la palanca: participar activamente me convierte en responsable directo de un homicidio.","arquetipo":"deontologo"},{"texto":"Intentar descarrilar el tranvía lanzando una piedra a las ruedas a ver qué pasa.","arquetipo":"caos"},{"texto":"Gritar desesperadamente para avisar a todos mientras se me desgarra el alma por la situación.","arquetipo":"empatico"}]},{"id":"dm2","texto":"Un médico tiene **5 pacientes en estado crítico**, cada uno necesitando un trasplante urgente de un órgano distinto para no morir hoy. En la sala de espera hay un **viajero perfectamente sano** cuyos 5 órganos son compatibles. ¿Qué dicta tu moral?","opciones":[{"texto":"Salvar 5 sacrificando a 1 sigue siendo el mal menor matemático, aunque suene aterrador.","arquetipo":"utilitarista"},{"texto":"Jamás violar los derechos fundamentales de un inocente; el fin nunca justifica los medios.","arquetipo":"deontologo"},{"texto":"Proponerles a los 5 pacientes jugar al parchís a ver si el destino elige a otro.","arquetipo":"caos"},{"texto":"Llorar con los pacientes y acompañarles hasta el final respetando la vida de todos.","arquetipo":"empatico"}]},{"id":"dm3","texto":"Un **algoritmo de Inteligencia Artificial** te ofrece erradicar toda la delincuencia del planeta, a cambio de que todos los ciudadanos cedan el 100% de su privacidad y sus pensamientos íntimos sean monitorizados. ¿Aceptas?","opciones":[{"texto":"Acepto: la seguridad y la supervivencia de millones supera con creces el concepto de privacidad.","arquetipo":"utilitarista"},{"texto":"Rechazo categóricamente: la libertad y la dignidad individual son sagradas e inviolables.","arquetipo":"deontologo"},{"texto":"Acepto solo para ver qué cara pone la IA cuando lea los pensamientos bizarros de la humanidad.","arquetipo":"caos"},{"texto":"Me aterra el dolor de la delincuencia pero también la deshumanización; buscaría una vía intermedia.","arquetipo":"empatico"}]},{"id":"dm4","texto":"Estás en un bote salvavidas abarrotado en mitad del océano que se está hundiendo por exceso de peso. Tirar **una maleta llena de reliquias históricas invaluables** salvará a la tripulación. ¿Qué decides?","opciones":[{"texto":"Arrojar la maleta al fondo del mar al instante: el patrimonio cultural no respira, las personas sí.","arquetipo":"utilitarista"},{"texto":"La vida humana es el único deber ético primordial; la maleta va al agua sin dudar.","arquetipo":"deontologo"},{"texto":"Tirar la maleta pero quedarme con la corona de oro puesta por si acaso llegamos a una isla desierta.","arquetipo":"caos"},{"texto":"Sentir una pena inmensa por la pérdida de la historia de la humanidad mientras achico agua.","arquetipo":"empatico"}]},{"id":"dm5","texto":"Descubres que tu mejor amigo ha cometido un fraude fiscal menor para poder pagar los estudios de su hermana pequeña. Un inspector te pregunta directamente si sabes algo. ¿Qué haces?","opciones":[{"texto":"Evaluar si el beneficio social de la hermana supera el daño al estado antes de decidir.","arquetipo":"utilitarista"},{"texto":"Mentir es moralmente incorrecto por principio universal, pero la lealtad es un deber; estoy atrapado.","arquetipo":"deontologo"},{"texto":"Fingir amnesia repentina o responder en un idioma inventado para confundir al inspector.","arquetipo":"caos"},{"texto":"Proteger a mi amigo y a su hermana cueste lo que me cueste; el amor familiar está por encima.","arquetipo":"empatico"}]},{"id":"dm6","texto":"Una máquina del tiempo te permite viajar al pasado para evitar una guerra histórica, pero eso **borrará de la existencia a millones de personas actuales** (incluyéndote a ti). ¿Presionas el botón?","opciones":[{"texto":"Si el balance neto de sufrimiento global disminuye a lo largo de los siglos, presiono el botón.","arquetipo":"utilitarista"},{"texto":"No tengo derecho a decidir quién existe y quién no; el orden temporal no debe profanarse.","arquetipo":"deontologo"},{"texto":"Viajar al pasado solo para avisarles de que no inventen las reuniones de trabajo de los lunes.","arquetipo":"caos"},{"texto":"No podría soportar la idea de borrar a mis seres queridos y sus recuerdos del universo.","arquetipo":"empatico"}]}],"resultados":{"utilitarista":{"nombre":"El Utilitarista Implacable","tituloCorto":"El Matemático del Mal Menor","icono":"🧮","color":"#06b6d4","descripcion":"Para ti la moral es una ecuación de suma cero: el mayor bien para el mayor número de personas. No te tiembla el pulso al tomar decisiones difíciles porque entiendes que la inacción también tiene consecuencias medibles.","fortaleza":"Claridad analítica en situaciones de máxima crisis y liderazgo resolutivo.","desvario":"A veces suenas tan pragmático que tus amigos sospechan que eres un androide de última generación.","afinidad":"Alta afinidad con hojas de cálculo y pensadores como Jeremy Bentham."},"deontologo":{"nombre":"El Deontólogo Inquebrantable","tituloCorto":"El Guardián del Imperativo Categórico","icono":"🏛️","color":"#f59e0b","descripcion":"Crees firmemente en el deber moral, la justicia y la dignidad innegociable. Para ti hay líneas rojas que jamás deben cruzarse, sin importar cuántos beneficios prometa el atajo. Tus principios son tu brújula eterna.","fortaleza":"Integridad moral intachable y lealtad absoluta a los valores éticos.","desvario":"Prefieres que el universo colapse antes que decir una mentira piadosa sobre el peinado de alguien.","afinidad":"Alta afinidad con la filosofía de Immanuel Kant y las leyes inquebrantables."},"caos":{"nombre":"El Agente del Caos Creativo","tituloCorto":"El Rompedor de Falsas Dicotomías","icono":"🃏","color":"#ec4899","descripcion":"Te niegas a aceptar los dilemas encasillados. Si te dan a elegir entre la opción A y la opción B, tú buscas la opción Z: descarrilar el tranvía, hackear la máquina del tiempo o negociar con la IA. El pensamiento lateral es tu mayor arma.","fortaleza":"Encuentras salidas innovadoras donde todo el mundo solo ve callejones sin salida.","desvario":"Tu sentido del humor filosófico desconcierta a partes iguales a sabios y villanos.","afinidad":"Alta afinidad con paradojas cuánticas y planes disparatados que inexplicablemente funcionan."},"empatico":{"nombre":"El Empático Atormentado","tituloCorto":"El Corazón Sintiente de la Humanidad","icono":"❤️","color":"#10b981","descripcion":"Sientes el dolor y la alegría de cada persona involucrada en cada decisión. No ves números ni estadísticas, ves historias humanas, rostros y familias. Tu ética nace del afecto, la compasión y el cuidado mutuo.","fortaleza":"Capacidad infinita de conexión humana, consuelo y protección de los vulnerables.","desvario":"Te llevas a la cama los problemas éticos de personajes de ficción que viste en una película en 2014.","afinidad":"Alta afinidad con la ética del cuidado y los abrazos reconfortantes."}}},"efecto-mandela":{"id":"efecto-mandela","slug":"efecto-mandela","titulo":"El Gran Test del Efecto Mandela: ¿Tu Memoria te Engaña?","subtitulo":"¿Monopoly con monóculo? ¿El final de Blancanieves? Descubre si recuerdas la historia real o vives en un universo alternativo.","descripcionCorta":"8 pruebas históricas sobre el fenómeno del falso recuerdo colectivo. ¿Cuántos mitos das por ciertos sin haber existido jamás?","tipo":"enigma","categoria":"curiosidades","categoriaLabel":"Curiosidades & Trivia","icono":"👁️","tiempoMin":4,"color":"#10b981","enigmas":[{"id":"em1","titulo":"Prueba 1: El Magnate del Monopoly (Rich Uncle Pennybags)","planteamiento":"Cierra los ojos e imagina al famoso personaje con chistera y bigote blanco del juego de mesa **Monopoly**.\n\nEn su ojo derecho o izquierdo... **¿lleva un monóculo dorado puesto?**","pistas":["Pista 1: Millones de personas en todo el mundo recuerdan con total nitidez su monóculo redondo con cordón.","Pista 2: Piénsalo bien: ¿lo confundes con la mascota de cacahuetes Mr. Peanut?","Pista 3: La ilustración original de Hasbro/Parker Brothers guarda un secreto desconcertante."],"opciones":[{"id":"si","texto":"Sí, siempre ha llevado un monóculo circular en un ojo.","correcta":false},{"id":"no","texto":"No, JAMÁS ha llevado monóculo en ninguna edición oficial.","correcta":true}],"explicacion":"¡Fascinante! Es uno de los Efectos Mandela más famosos del planeta: **el señor del Monopoly NUNCA ha llevado monóculo**. Nuestro cerebro asocia su chistera, bastón y frac burgués con personajes de la época victoriana (como Mr. Peanut de Planters) y 'rellena' el recuerdo falso automáticamente."},{"id":"em2","titulo":"Prueba 2: La Frase Legendaria de Darth Vader en Star Wars","planteamiento":"En la escena cumbre de «El Imperio Contraataca» (1980), Darth Vader arrincona a Luke Skywalker en la pasarela de Bespin. Luke grita que Obi-Wan le dijo que él mató a su padre.\n\n¿Cuáles son las palabras EXACTAS que pronuncia Darth Vader?","pistas":["Pista 1: La cultura pop, las camisetas y las parodias siempre citan una frase que incluye el nombre 'Luke'.","Pista 2: El actor de voz James Earl Jones grabó algo ligeramente distinto en el guión original de George Lucas."],"opciones":[{"id":"a","texto":"«Luke, yo soy tu padre» (Luke, I am your father).","correcta":false},{"id":"b","texto":"«No, yo soy tu padre» (No, I am your father).","correcta":true}],"explicacion":"¡Increíble pero cierto! Darth Vader jamás dice «Luke, yo soy tu padre». Cuando Luke grita: *«¡Él me dijo que tú le mataste!»*, Vader responde directamente: **«No, yo soy tu padre»**. La versión con el nombre 'Luke' se popularizó en radio y comedias porque fuera de contexto hacía falta especificar a quién se dirigía."},{"id":"em3","titulo":"Prueba 3: La Cola de Pikachu en Pokémon","planteamiento":"Visualiza a **Pikachu**, el Pokémon ratón eléctrico más famoso de Nintendo.\n\nFíjate en el extremo final de su cola en forma de rayo:\n**¿Tiene la punta de la cola negra o marrón?**","pistas":["Pista 1: Millones de jugadores de Game Boy aseguran recordar una franja negra en la punta superior de la cola.","Pista 2: Revisa mentalmente las orejas: las orejas sí tienen las puntas negras.","Pista 3: ¿La cola comparte ese mismo patrón bicolor en la punta?"],"opciones":[{"id":"negra","texto":"Sí, la punta de la cola tiene una marca o franja negra.","correcta":false},{"id":"amarilla","texto":"No, la cola es completamente amarilla (solo la base inferior es marrón).","correcta":true}],"explicacion":"¡Sorpresa cuántica! La cola de Pikachu **es 100% amarilla en su punta**. Solo la base donde se une al cuerpo tiene una pequeña mancha marrón. Como sus orejas sí tienen la punta negra, la memoria colectiva transfirió automáticamente ese detalle a la cola."},{"id":"em4","titulo":"Prueba 4: El Espejo Mágico de Blancanieves (Disney 1937)","planteamiento":"En el clásico animado de Disney de 1937, la Reina Malvada se acerca a su espejo mágico para preguntarle quién es la más bella del reino.\n\n¿Cómo comienza exactamente su famosa invocación en la versión original en español?","pistas":["Pista 1: La frase popularizada en cuentos infantiles dice siempre una palabra repetida.","Pista 2: En la película de Disney de 1937, la frase no usa la palabra en diminutivo."],"opciones":[{"id":"a","texto":"«Espejito, espejito mágico, dime una cosa...»","correcta":false},{"id":"b","texto":"«Espejo mágico en la pared, ¿quién es la más hermosa de este reino?»","correcta":true}],"explicacion":"¡Exacto! Tanto en inglés (*«Magic mirror on the wall...»* y no *«Mirror, mirror...»*) como en el doblaje clásico en español, la reina dice: **«Espejo mágico...»**, sin repetir 'espejito'. La frase duplicada proviene de traducciones no oficiales de los hermanos Grimm."},{"id":"em5","titulo":"Prueba 5: El Logotipo de las Barritas KitKat","planteamiento":"Piensa en el envoltorio rojo brillante de las famosas barritas de chocolate y galleta **KitKat** de Nestlé.\n\nEn las letras del logo oficial:\n**¿Lleva un guion en medio (Kit-Kat) o va todo junto (KitKat)?**","pistas":["Pista 1: Mucha gente recuerda con total certeza haber visto un guion estilizado entre las dos palabras.","Pista 2: Busca en el archivo histórico de marcas registradas desde 1935."],"opciones":[{"id":"guion","texto":"Lleva un guion en medio: Kit-Kat.","correcta":false},{"id":"junto","texto":"Va todo junto sin guion: KitKat.","correcta":true}],"explicacion":"¡Correcto! En toda la historia moderna de la marca, el logotipo oficial **siempre ha sido 'KitKat' sin guion**. El cerebro humano tiende a buscar simetría entre dos palabras monosilábicas idénticas y asume inconscientemente la presencia de un guion ortográfico."},{"id":"em6","titulo":"Prueba 6: ¿Tiene Cola el Monito 'Jorge el Curioso'?","planteamiento":"El entrañable personaje infantil **Jorge el Curioso** (Curious George) es famoso por sus travesuras.\n\nAl ser un pequeño primate que trepa por árboles y cuerdas:\n**¿Tiene una larga cola o no tiene cola?**","pistas":["Pista 1: Si es un mono, los monos suelen tener cola para balancearse.","Pista 2: Sin embargo, los simios (como los chimpancés) carecen de cola.","Pista 3: Revisa las ilustraciones originales de H.A. Rey desde 1941."],"opciones":[{"id":"con_cola","texto":"Sí tiene cola larga, como todos los monitos de dibujos.","correcta":false},{"id":"sin_cola","texto":"No tiene cola en absoluto; biológicamente es un simio sin cola.","correcta":true}],"explicacion":"¡Falso recuerdo generalizado! A pesar de que en los libros lo llaman 'el monito', **Jorge el Curioso NO tiene cola**. Trepa usando únicamente sus manos y pies. La inmensa mayoría de las personas dibuja a Jorge con una larga cola prensil que jamás existió."},{"id":"em7","titulo":"Prueba 7: El Traje Negro y Rojo de C-3PO en Star Wars","planteamiento":"El androide de protocolo **C-3PO** en la trilogía clásica original de Star Wars:\n\n¿De qué color es **su pierna derecha por debajo de la rodilla** en el Episodio IV?","pistas":["Pista 1: Todo el mundo recuerda a C-3PO como un androide dorado brillante de la cabeza a los pies.","Pista 2: Pero Anthony Daniels llevaba una pieza de metal diferente en una de las extremidades inferiores."],"opciones":[{"id":"dorada","texto":"Es 100% dorada, igual que todo el resto de su cuerpo.","correcta":false},{"id":"plateada","texto":"Es completamente PLATEADA desde la rodilla hacia abajo.","correcta":true}],"explicacion":"¡Impresionante! En la película original de 1977, **la pantorrilla y el pie derecho de C-3PO son de color PLATA**. Debido a que reflejaba la arena dorada de Tatooine y los pósteres promocionales lo coloreaban todo de oro, casi nadie se percató de que una de sus piernas era plateada."},{"id":"em8","titulo":"Prueba 8: El Origen Histórico del Término 'Efecto Mandela'","planteamiento":"¿Por qué este fenómeno psicológico fue bautizado específicamente con el apellido del líder sudafricano **Nelson Mandela** por la investigadora Fiona Broome en 2009?","pistas":["Pista 1: Piensa en el destino de Nelson Mandela en prisión durante el Apartheid versus su liberación en 1990 y posterior presidencia.","Pista 2: Miles de personas recordaban haber visto en televisión su funeral en los años 80."],"opciones":[{"id":"a","texto":"Porque miles de personas recordaban con certeza que Mandela había muerto en prisión en los años 80, cuando en realidad fue liberado, fue presidente y falleció en 2013.","correcta":true},{"id":"b","texto":"Porque Mandela propuso una ley en la ONU sobre la fragilidad de los testimonios oculares en juicios penales.","correcta":false},{"id":"c","texto":"Porque Mandela tenía una memoria eidética que le permitía recordar cada día de su encierro.","correcta":false}],"explicacion":"¡Exacto! En 2009, Fiona Broome descubrió que infinidad de personas compartían el recuerdo vívido y detallado de haber visto el funeral de Nelson Mandela en prisión durante los años 80, con discursos de su viuda incluidos. En realidad, Mandela fue liberado en 1990, ganó las elecciones, gobernó Sudáfrica y falleció en 2013."}]},"enigmas-logica":{"id":"enigmas-logica","slug":"enigmas-logica","titulo":"El Misterio de la Cámara de los Sabios: 5 Enigmas de Lógica","subtitulo":"Pon a prueba tu agudeza mental con acertijos clásicos y dilemas deductivos.","descripcionCorta":"5 acertijos de ingenio y lógica pura. Usa las pistas con sabiduría y demuestra si posees una mente analítica superior.","tipo":"enigma","categoria":"logica","categoriaLabel":"Lógica & Paradojas","icono":"🧩","tiempoMin":4,"color":"#06b6d4","enigmas":[{"id":"e1","titulo":"Enigma 1: Los Tres Cofres del Alquimista","planteamiento":"Frente a ti hay tres cofres cerrados: uno de **Oro**, uno de **Plata** y uno de **Plomo**. Dentro de uno de ellos está la *Piedra Filosofal*; los otros dos están vacíos.\n\nCada cofre tiene una inscripción grabada:\n- **Cofre de Oro:** «La Piedra está en este cofre».\n- **Cofre de Plata:** «La Piedra no está en este cofre».\n- **Cofre de Plomo:** «La Piedra no está en el cofre de Oro».\n\nEl alquimista te advierte: **Sólo UNA de las tres inscripciones es VERDADERA; las otras dos son FALSAS.**\n\n¿En qué cofre está la Piedra Filosofal?","pistas":["Pista 1: Si la inscripción de Oro fuera verdadera, ¿qué pasaría con la de Plomo?","Pista 2: Observa que la inscripción de Oro y la de Plomo dicen cosas directamente contradictorias (una afirma que está en Oro, la otra que NO está en Oro). Por tanto, una de ellas debe ser verdadera y la otra falsa.","Pista 3: Como solo hay UNA inscripción verdadera en total, la inscripción del cofre de Plata tiene que ser obligatoriamente FALSA."],"opciones":[{"id":"oro","texto":"En el Cofre de Oro","correcta":false},{"id":"plata","texto":"En el Cofre de Plata","correcta":true},{"id":"plomo","texto":"En el Cofre de Plomo","correcta":false}],"explicacion":"¡Exacto! El cofre de Oro y el de Plomo se contradicen, por lo que una de sus frases es la única verdadera. Esto obliga a que la frase del cofre de Plata («La Piedra no está en este cofre») sea FALSA. Si es falsa que no está en Plata... ¡significa que la Piedra está en el **Cofre de Plata**!"},{"id":"e2","titulo":"Enigma 2: El Prisionero y las Dos Puertas","planteamiento":"Estás encerrado en una celda con **dos puertas**: una conduce a la **Libertad** y la otra al **Abismo eterno**.\n\nFrente a cada puerta hay un guardián:\n- Uno de ellos **SIEMPRE dice la verdad**.\n- El otro **SIEMPRE miente**.\n- No sabes cuál es cuál, y solo puedes hacer **UNA sola pregunta a UNO solo de los guardianes**.\n\n¿Qué pregunta te garantiza descubrir con 100% de seguridad la puerta de la Libertad?","pistas":["Pista 1: Si preguntas directamente por la puerta a uno solo, el mentiroso te engañará y el verídico te dirá la verdad, pero como no sabes quién es quién, no te sirve.","Pista 2: Necesitas una pregunta que involucre lo que respondería el OTRO guardián (doble negación lógica)."],"opciones":[{"id":"a","texto":"«¿Eres tú el guardián que siempre dice la verdad?»","correcta":false},{"id":"b","texto":"«Si le preguntara al OTRO guardián cuál es la puerta de la Libertad, ¿qué puerta me señalaría?»","correcta":true},{"id":"c","texto":"«¿Cuál es la puerta que tú elegirías para salvarte?»","correcta":false},{"id":"d","texto":"«¿La puerta de la izquierda conduce a la Libertad?»","correcta":false}],"explicacion":"¡Brillante deducción! Si le preguntas eso:\n- Si le preguntas al **Verídico**, él sabe con verdad que el Mentiroso señalará la puerta del Abismo, y te dirá con verdad: «El Abismo».\n- Si le preguntas al **Mentiroso**, él sabe que el Verídico señalaría la Libertad, pero al mentir te dirá: «El Abismo».\nEn ambos casos, **ambos guardianes te señalarán la puerta del Abismo**. Por tanto, sólo tienes que elegir la PUERTA CONTRARIA a la que te indiquen."},{"id":"e3","titulo":"Enigma 3: La Carrera de los Monjes en el Claustro","planteamiento":"Durante una prueba de agilidad en el monasterio, compites en una carrera de obstáculos.\n\nEn la última curva, aceleras a fondo y **adelantas al corredor que iba en SEGUNDA posición** justo antes de cruzar la meta.\n\n¿En qué posición quedas clasificado?","pistas":["Pista 1: No te apresures; piensa en quién estaba delante de ti antes del adelantamiento.","Pista 2: Si adelantas al segundo... ¿qué puesto ocupaba él y cuál ocupas tú ahora?"],"opciones":[{"id":"primero","texto":"1º lugar (Primer puesto / Ganador)","correcta":false},{"id":"segundo","texto":"2º lugar (Segundo puesto)","correcta":true},{"id":"tercero","texto":"3º lugar (Tercer puesto)","correcta":false}],"explicacion":"¡Correcto! Si adelantas al que iba segundo, tú pasas a ocupar su puesto: el **2º lugar**. El primer clasificado sigue yendo delante de ti."},{"id":"e4","titulo":"Enigma 4: El Barquero, el Lobo, la Cabra y la Col","planteamiento":"Un barquero debe cruzar un río con un **Lobo**, una **Cabra** y una **Col**. En su pequeña barca solo cabe él y **uno** de los tres elementos por viaje.\n\n- Si deja al Lobo y a la Cabra solos, el Lobo se comerá a la Cabra.\n- Si deja a la Cabra y a la Col solas, la Cabra se comerá la Col.\n- El Lobo no come Col.\n\n¿Cuál debe ser el **primer viaje de ida** indispensable para que nadie sea devorado?","pistas":["Pista 1: ¿Qué dos elementos pueden quedarse juntos en la orilla sin peligro?","Pista 2: El Lobo y la Col nunca se atacarán."],"opciones":[{"id":"lobo","texto":"Cruzar primero con el Lobo","correcta":false},{"id":"cabra","texto":"Cruzar primero con la Cabra","correcta":true},{"id":"col","texto":"Cruzar primero con la Col","correcta":false}],"explicacion":"¡Excelente! El único primer paso seguro es **cruzar a la Cabra**. Así, en la orilla original se quedan el Lobo y la Col (que no se tocan). Después cruza el Lobo, se trae de vuelta a la Cabra, cruza la Col y finalmente vuelve a por la Cabra."},{"id":"e5","titulo":"Enigma 5: La Vela y la Oscuridad","planteamiento":"Entras a medianoche en una habitación completamente helada y a oscuras. En el bolsillo tienes **una única cerilla**. Dentro de la habitación hay:\n- Una lámpara de aceite.\n- Una vela de cera virgen.\n- Una chimenea de leña seca lista para encender.\n\n¿Qué es lo primero que debes encender?","pistas":["Pista 1: Antes de iluminar nada en la habitación, necesitas fuego en la mano.","Pista 2: Piensa en el orden físico de las cosas."],"opciones":[{"id":"vela","texto":"La vela de cera","correcta":false},{"id":"cerilla","texto":"La cerilla","correcta":true},{"id":"lampara","texto":"La lámpara de aceite","correcta":false},{"id":"chimenea","texto":"La chimenea","correcta":false}],"explicacion":"¡Elemental! Antes de poder prender la vela, la lámpara o la chimenea, lo primero que debes encender de forma obligada es **la cerilla**."}]},"filosofia-existencial-abismo":{"id":"filosofia-existencial-abismo","slug":"filosofia-existencial-abismo","titulo":"¿Qué Escuela Filosófica Guía Tu Alma ante el Abismo?","subtitulo":"Descubre si eres Estoico, Nihilista Optimista, Existencialista o Absurdista ante el misterio de la existencia.","descripcionCorta":"8 dilemas ontológicos y existenciales para descubrir la brújula filosófica con la que enfrentas la libertad, el dolor, el destino y el vacío.","tipo":"personalidad","categoria":"personalidad","categoriaLabel":"Filosofía & Existencialismo","icono":"🌌","tiempoMin":4,"color":"#6366f1","preguntas":[{"id":"fa1","texto":"Miras el cielo estrellado en una noche despejada y tomas conciencia de que la Tierra es solo una mota de polvo insignificante en un universo frío de 93.000 millones de años luz. ¿Qué pensamiento cruza tu mente?","opciones":[{"texto":"«Qué alivio maravilloso: si nada tiene un significado cósmico impuesto, mis errores son diminutos y soy libre de crear mi propio sentido».","arquetipo":"nihilista"},{"texto":"«El universo no me debe nada ni tiene propósito, pero mi deber como ser racional es actuar con virtud y serenidad en mi pequeña esfera».","arquetipo":"estoico"},{"texto":"«Estamos condenados a ser libres: la inmensidad no importa, lo único real son mis decisiones y la responsabilidad de mis actos aquí y ahora».","arquetipo":"existencialista"},{"texto":"«El abismo es absurdo, frío e indiferente... y precisamente por eso sonrío, enciendo un cigarro y celebro la belleza trágica de estar vivo».","arquetipo":"absurdista"}]},{"id":"fa2","texto":"Un revés inesperado del destino (un despido injusto, una pérdida material o una traición) destruye de golpe meses de trabajo duro. ¿Cómo procesas el golpe?","opciones":[{"texto":"Distingo de inmediato: lo sucedido está fuera de mi control; lo único bajo mi control es mi juicio y cómo elijo responder. La queja es inútil.","arquetipo":"estoico"},{"texto":"Acepto el dolor visceral, pero no me victimizo: este golpe redefine mi presente y me obliga a redefinir quién elijo ser a partir de hoy.","arquetipo":"existencialista"},{"texto":"Es una muestra más de la comedia caótica del universo. Como Sísifo, empujaré la piedra de nuevo cuesta arriba con una sonrisa desafiante.","arquetipo":"absurdista"},{"texto":"La rueda de la fortuna gira sin malicia personal. Toda estructura se derrumba tarde o temprano; el vacío es el lienzo para empezar de cero.","arquetipo":"nihilista"}]},{"id":"fa3","texto":"Si te demostraran científicamente más allá de toda duda que NO existe ningún dios, ningún más allá ni ningún plan divino para la humanidad, ¿cómo cambiaría tu vida?","opciones":[{"texto":"En nada: la virtud, el autodominio y la rectitud moral tienen valor por sí mismos, no por el miedo al castigo ni por promesas de paraíso.","arquetipo":"estoico"},{"texto":"Reafirmaría mi convicción: el ser humano está solo y debe asumir la angustia y la gloria de forjar su propia esencia sin apoyos metafísicos.","arquetipo":"existencialista"},{"texto":"Sería la confirmación perfecta del Absurdo: buscar significado en un mundo sin sentido es la mayor aventura heroica del intelecto humano.","arquetipo":"absurdista"},{"texto":"Sería una gran fiesta de emancipación: liberados del peso de mandamientos artificiales, podemos vivir con gozo desinhibido el presente.","arquetipo":"nihilista"}]},{"id":"fa4","texto":"¿Qué concepto te resulta más intolerable o peligroso para la condición humana?","opciones":[{"texto":"Dejarse arrastrar por las pasiones ciegas, la ira desmedida y lamentarse por cosas que no se pueden cambiar.","arquetipo":"estoico"},{"texto":"La 'mala fe': esconderse tras excusas como 'no tuve elección' o 'la sociedad me obligó' para eludir la propia libertad.","arquetipo":"existencialista"},{"texto":"El suicidio filosófico: refugiarse en falsas esperanzas sobrenaturales o dogmas ciegos para escapar del choque con la realidad.","arquetipo":"absurdista"},{"texto":"El nihilismo pasivo y pesimista: creer que como nada importa, la respuesta es la apatía, el cinismo destructivo y la inacción.","arquetipo":"nihilista"}]},{"id":"fa5","texto":"¿Cómo te relacionas con la noción de tu propia muerte inevitable (*Memento Mori*)?","opciones":[{"texto":"Es un recordatorio diario indispensable: la muerte no es un castigo, sino la ley natural. Meditar en ella me hace sabio y moderado.","arquetipo":"estoico"},{"texto":"Es el límite que le otorga urgencia, peso y autenticidad a cada una de mis elecciones. Morir sin haber elegido mi camino sería el único fracaso.","arquetipo":"existencialista"},{"texto":"Es el chiste final de la existencia: saber que el te
