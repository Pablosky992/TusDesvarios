lón caerá hace que cada acto de la obra, por ridículo que sea, merezca ser vivido con pasión.","arquetipo":"absurdista"},{"texto":"Es el descanso pacífico de los átomos: volveré al mismo estado de nada dichosa en el que estuve durante los miles de millones de años antes de nacer.","arquetipo":"nihilista"}]},{"id":"fa6","texto":"¿Qué representa el arte, la literatura y la creatividad humana en un cosmos transitorio?","opciones":[{"texto":"Un ejercicio de disciplina interior y cultivo del alma para armonizarnos con el Logos y la razón universal.","arquetipo":"estoico"},{"texto":"El acto supremo de rebelión y auto-definición: un testimonio de que una conciencia libre habitó este rincón del tiempo.","arquetipo":"existencialista"},{"texto":"La revuelta más bella contra el silencio del universo: crear belleza en un mundo que no la solicitó ni la recordará.","arquetipo":"absurdista"},{"texto":"El juego más refinado de la materia consciente: inventamos historias porque es el deleite más elevado que nos permite la biología.","arquetipo":"nihilista"}]},{"id":"fa7","texto":"Un amigo entra en crisis existencial y te pregunta desesperado: «¿Para qué estamos aquí? ¿Qué sentido tiene todo esto?». ¿Qué le respondes?","opciones":[{"texto":"«Estamos aquí para cumplir con nuestro deber natural como seres racionales y cooperar con nuestros semejantes con templanza».","arquetipo":"estoico"},{"texto":"«No hay ningún 'para qué' esperándote ahí fuera; el sentido es una tarea que tienes que construir tú con cada acto a partir de hoy».","arquetipo":"existencialista"},{"texto":"«No tiene ningún sentido... ¡y esa es la mejor noticia del mundo! Deja de buscar un guión y vive con pasión la aventura rebelde de existir».","arquetipo":"absurdista"},{"texto":"«El universo no tiene planes para ti, lo que te otorga licencia completa para disfrutar del camino, saborear un café y no tomarte tan en serio».","arquetipo":"nihilista"}]},{"id":"fa8","texto":"Si pudieras cenar con uno de estos cuatro pensadores históricos, ¿a quién elegirías para mantener la charla más lúcida?","opciones":[{"texto":"Marco Aurelio: para aprender cómo mantener la paz mental y la serenidad gobernando el mayor imperio del mundo antiguo.","arquetipo":"estoico"},{"texto":"Jean-Paul Sartre o Simone de Beauvoir: para debatir sobre la angustia de la libertad, el compromiso político y la autenticidad.","arquetipo":"existencialista"},{"texto":"Albert Camus: para charlar sobre el sol del Mediterráneo, el mito de Sísifo y cómo rebelarse contra el absurdo sin perder la ternura.","arquetipo":"absurdista"},{"texto":"Friedrich Nietzsche: para comprender la voluntad de poder, el eterno retorno y cómo decir 'sí' a la vida tras la muerte de los dioses.","arquetipo":"nihilista"}]}],"resultados":{"estoico":{"nombre":"El Bastión Estoico","tituloCorto":"Ciudadela Interior de Serenidad","icono":"🏛️","color":"#10b981","descripcion":"Tu alma resuena con las enseñanzas de Séneca, Epicteto y Marco Aurelio. Comprendes con lucidez cristalina la dicotomía del control: no puedes controlar el viento, la fortuna ni las opiniones ajenas, pero tienes soberanía absoluta sobre tus propios pensamientos, juicios y reacciones.","fortaleza":"Imperturbabilidad ante la adversidad, templanza moral inquebrantable y lucidez racional.","desvario":"Riesgo de intelectualizar en exceso las emociones o parecer distante y frío ante los afectos de los demás.","afinidad":"93% Afinidad con el estoicismo romano, la disciplina personal y la sabiduría clásica."},"absurdista":{"nombre":"El Rebelde Absurdista","tituloCorto":"El Héroe que Sonríe al Abismo","icono":"🧗","color":"#f59e0b","descripcion":"Bebes de la estirpe de Albert Camus. Eres plenamente consciente del choque irreconciliable entre el anhelo humano de significado y el silencio indiferente del universo: el Absurdo. Pero en lugar de desesperar o buscar refugio en supersticiones, eliges la rebelión: vivir con intensidad, pasión creadora, libertad y una sonrisa desafiante.","fortaleza":"Vitalidad apasionada, sentido del humor frente a la tragedia y autenticidad rebelde.","desvario":"Desdén ocasional por metas institucionales tradicionales y tendencia a relativizar compromisos a muy largo plazo.","afinidad":"95% Afinidad con la filosofía de Camus, el arte contestatario y la libertad vital."},"existencialista":{"nombre":"El Artífice Existencialista","tituloCorto":"Arquitecto de su Propia Esencia","icono":"⚡","color":"#06b6d4","descripcion":"Heredero de Sartre, Simone de Beauvoir y Kierkegaard, asumes con valentía la premisa nuclear: la existencia precede a la esencia. No naciste con un destino preescrito ni con una naturaleza fija: eres, de forma absoluta y radical, la suma de tus elecciones. Rechazas el victimismo y la 'mala fe', abrazando el peso y la gloria de tu libertad.","fortaleza":"Responsabilidad ética radical, honestidad implacable consigo mismo y compromiso activo con el presente.","desvario":"Angustia existencial recurrente por el peso de las decisiones y autoexigencia implacable.","afinidad":"91% Afinidad con el existencialismo, la psicología humanista y el pensamiento crítico."},"nihilista":{"nombre":"El Nihilista Optimista","tituloCorto":"Espíritu Libre del Cosmos","icono":"🌌","color":"#ec4899","descripcion":"Lejos del nihilismo oscuro y derrotista, has descubierto la revelación más liberadora: si el universo carece de un propósito cósmico predeterminado, el lienzo está completamente en blanco. Eres un espíritu libre nietzscheano que celebra el 'Amor Fati' (amar el destino) y encuentra un gozo inmenso en la belleza transitoria de cada instante.","fortaleza":"Desapego saludable de vanidades materiales, sentido del humor cósmico y capacidad para disfrutar el presente sin culpas.","desvario":"Dificultad para conectar con personas atadas a dogmas rígidos y tentación de desentenderse de normas sociales convencionales.","afinidad":"94% Afinidad con el nietzscheanismo afirmativo, la ciencia cósmica y la emancipación intelectual."}}},"la-simulacion":{"id":"la-simulacion","slug":"la-simulacion","titulo":"El Test de la Simulación: ¿Vives en Matrix o en la Realidad?","subtitulo":"Un diagnóstico ontológico para medir tu nivel de sospecha frente al código fuente del universo.","descripcionCorta":"8 dilemas cotidianos y sincronicidades para evaluar si percibes el mundo como una realidad física u holográfica.","tipo":"puntuacion","categoria":"curiosidades","categoriaLabel":"Curiosidades & Trivia","icono":"🌐","tiempoMin":3,"color":"#06b6d4","preguntas":[{"id":"sim1","texto":"Caminas por la calle y experimentas un *déjà vu* extremadamente intenso: una persona pasa con un paraguas amarillo y un perro ladra exactamente igual que hace 10 segundos. ¿Qué piensas?","opciones":[{"texto":"Un simple desajuste neuroquímico entre mis dos hemisferios cerebrales; nada de qué preocuparse.","puntos":0},{"texto":"Una extraña coincidencia estadística, curiosa pero intrascendente.","puntos":5},{"texto":"Me detengo y miro alrededor buscando una cámara o un fallo en el renderizado de la escena.","puntos":10},{"texto":"«Han modificado algo en el servidor central». Mantengo la calma y no miro fijamente a nadie.","puntos":15}]},{"id":"sim2","texto":"La física cuántica moderna demuestra que las partículas subatómicas no tienen una posición definida hasta que son observadas por un medidor consciente. ¿Cómo interpretas este hecho?","opciones":[{"texto":"Es una propiedad matemática de la mecánica de ondas cuánticas, sin implicaciones filosóficas sobre la realidad.","puntos":0},{"texto":"Demuestra que la conciencia y la materia tienen un vínculo más misterioso de lo que creemos.","puntos":8},{"texto":"Es exactamente como la oclusión ambiental en los videojuegos 3D: el motor solo renderiza lo que el jugador está mirando para ahorrar memoria RAM.","puntos":15},{"texto":"Una prueba clara de que los desarrolladores de esta simulación tienen limitaciones de procesamiento.","puntos":12}]},{"id":"sim3","texto":"Pierdes las llaves de tu casa. Las buscas durante 20 minutos por cada rincón. Te rindes, vuelves al salón y aparecen sobre la mesa despejada donde jurarías que ya habías mirado 5 veces. ¿Cuál es tu conclusión?","opciones":[{"texto":"Ceguera por falta de atención: mi cerebro filtró el objeto por estrés.","puntos":0},{"texto":"Un duendecillo doméstico o despiste simpático.","puntos":5},{"texto":"Un retraso en la carga de texturas o respawn de objetos en el inventario del mapa.","puntos":12},{"texto":"Un parche rápido del sistema que detectó que un elemento clave había desaparecido de mi inventario.","puntos":15}]},{"id":"sim4","texto":"Si te encontraras cara a cara con el creador o programador de este universo y te ofreciera revelarte el código fuente completo a cambio de no poder volver jamás, ¿qué harías?","opciones":[{"texto":"Rechazarlo: prefiero mis afectos, mi familia y la experiencia cálida de la vida humana imperfecta.","puntos":0},{"texto":"Pedirle primero que arregle la economía, las enfermedades y los mosquitos antes de contestar.","puntos":5},{"texto":"Aceptar solo si me deja una consola de comandos con permisos de administrador en modo incógnito.","puntos":10},{"texto":"Aceptar de inmediato: la verdad absoluta sobre la naturaleza del cosmos vale cualquier sacrificio.","puntos":15}]},{"id":"sim5","texto":"Piensas en un amigo de la infancia del que no sabías nada hace 8 años y, exactamente tres minutos después, te llega un mensaje suyo al móvil. ¿Qué sientes?","opciones":[{"texto":"Azar puro: pensamos en cientos de personas al mes, alguna vez tenía que coincidir matemáticamente.","puntos":0},{"texto":"Una sincronicidad junguiana fascinante que demuestra la conexión del inconsciente colectivo.","puntos":8},{"texto":"El algoritmo de recomendación predictivo de la simulación ha cruzado nuestros metadatos en caché.","puntos":12},{"texto":"Una llamada de función RPC evidente ejecutada por el script de eventos aleatorios de la simulación.","puntos":15}]},{"id":"sim6","texto":"Observas el cielo nocturno despejado con miles de millones de galaxias y planetas, pero no hay ni una sola señal de vida extraterrestre inteligente (Paradoja de Fermi). ¿Cuál es tu teoría?","opciones":[{"texto":"Las distancias interestelares son inmensas y la vida compleja es extremadamente rara en el cosmos.","puntos":0},{"texto":"Civilizaciones avanzadas se ocultan voluntariamente para no interferir con nuestra evolución.","puntos":5},{"texto":"No hay extraterrestres porque esta simulación es un entorno monousuario para un solo planeta; generar vida en otras galaxias consumiría demasiados recursos.","puntos":15},{"texto":"Las estrellas son simplemente un fondo de cielo estático (skybox) de alta resolución proyectado en la cúpula celeste.","puntos":10}]},{"id":"sim7","texto":"¿Qué probabilidad real le otorgas a la hipótesis del filósofo Nick Bostrom de que la humanidad viva en una simulación informática de ancestros?","opciones":[{"texto":"Menos del 5%: una ocurrencia divertida de ciencia ficción sin base empírica.","puntos":0},{"texto":"Entre un 20% y un 40%: un argumento lógico sólido que no podemos descartar.","puntos":8},{"texto":"Más del 50%: matemáticamente, si las simulaciones son posibles, las simuladas superarán por millones a la original.","puntos":12},{"texto":"99.9%: los indicios están por todas partes, solo hay que saber leer los píxeles de la realidad.","puntos":15}]},{"id":"sim8","texto":"Al final del día, cuando te vas a dormir en penumbra absoluta y cierras los ojos, ¿cuál es tu sensación íntima sobre tu propia existencia?","opciones":[{"texto":"Paz biológica: un organismo vivo que descansa para recargar energía metabólica.","puntos":0},{"texto":"Asombro místico por el milagro inexplicable de estar consciente en este mundo.","puntos":5},{"texto":"La sensación de que al dormir el universo entra en modo suspensión para ahorrar ciclos de CPU.","puntos":12},{"texto":"Un usuario que se desconecta temporalmente del terminal a la espera del reinicio matutino.","puntos":15}]}],"rangos":[{"min":0,"max":30,"nivel":"Ancla Orgánica (Fiel a la Realidad Física)","titulo":"El Terrícola Inquebrantable","icono":"🌲","color":"#10b981","descripcion":"Tu percepción está firmemente enraizada en el mundo tangible. Para ti los árboles huelen a madera, la lluvia moja y el café quema porque la biología y la física newtoniana son sólidas como una roca. Rara vez pierdes el tiempo buscando fantasmas en el código, lo que te permite disfrutar de la vida terrenal con plenitud y calma envidiables.","consejo":"Sigue disfrutando del barro y del sol; si esto es una simulación, tú eres de los pocos que le sacan verdadero provecho emocional."},{"min":31,"max":65,"nivel":"Curioso Escéptico (Observador de Sincronicidades)","titulo":"El Filósofo de la Grieta","icono":"🔎","color":"#3b82f6","descripcion":"No afirmas con soberbia que vivamos en un ordenador cuántico, pero tampoco te tragas que el universo sea tan simple como nos contaron en la escuela. Te fascinan las coincidencias asombrosas, las paradojas de la física cuántica y esa extraña sensación de que hay algo detrás del telón que se nos escapa por una fracción de segundo.","consejo":"Mantén esa curiosidad abierta y analítica: el límite entre la ciencia de vanguardia y la especulación filosófica es donde surgen los grandes descubrimientos."},{"min":66,"max":95,"nivel":"Hacker Ontológico (Cuestionador del Código)","titulo":"El Cazador de Glitches","icono":"⚡","color":"#a855f7","descripcion":"Tienes un ojo entrenado para detectar las costuras del tapiz cósmico. Cada vez que experimentas un déjà vu, una coincidencia imposible o lees sobre el principio holográfico del espaciotiempo, una voz en tu nuca te susurra que este escenario tiene fecha de compilación y servidores dedicados. No te asusta: te divierte desafiar sus límites.","consejo":"Ten cuidado de no obsesionarte con los píxeles; aunque el juego sea simulado, las victorias y los abrazos siguen sintiéndose 100% reales."},{"min":96,"max":120,"nivel":"Neófilo Despierto (El Algoritmo te Teme)","titulo":"El Neo de la Calle Real","icono":"🕶️","color":"#06b6d4","descripcion":"Para ti no hay duda: la cuchara no existe. Vives con la serena certeza de que la realidad física es una elegante interfaz gráfica construida para contener tu consciencia. Desafías las probabilidades estadísticas a diario y casi puedes escuchar el zumbido de los ventiladores de la máquina universal cuando hay silencio absoluto.","consejo":"Usa tus poderes con responsabilidad: no intentes atravesar paredes de hormigón un lunes por la mañana antes del primer café."}]},"monstruo-interior":{"id":"monstruo-interior","slug":"monstruo-interior","titulo":"¿Qué Criatura Mitológica Eres Según tu Forma de Estresarte?","subtitulo":"Descubre qué bestia legendaria toma el control de tu mente cuando el caos se desata.","descripcionCorta":"Test de personalidad cómica: cómo reaccionas ante los plazos de entrega, los mensajes sin responder y la falta de café.","tipo":"personalidad","categoria":"personalidad","categoriaLabel":"Personalidad & Arquetipos","icono":"🦖","tiempoMin":3,"color":"#10b981","preguntas":[{"id":"m1","texto":"Son las 18:00 y tienes una entrega crucial para mañana a las 9:00 AM. Apenas llevas un 10% hecho. ¿Cuál es tu **mecanismo de defensa**?","opciones":[{"texto":"Hundirme en las profundidades del sofá y ver 4 episodios de una serie documental sobre pingüinos.","arquetipo":"kraken"},{"texto":"Buscar en Google si el tic que tengo en el párpado es un síntoma de estrés terminal.","arquetipo":"basilisco"},{"texto":"Bloquear a todo el mundo en el móvil y amenazar con fuego a quien se acerque a mi cueva.","arquetipo":"dragon"},{"texto":"Irme a cenar tranquilamente; sé que mi verdadero poder despierta mágicamente a las 2:30 AM.","arquetipo":"fenix"}]},{"id":"m2","texto":"Te despiertas con un mensaje grupal de 47 notificaciones y un audio de 6 minutos de un familiar. ¿Qué haces?","opciones":[{"texto":"Extender mis tentáculos, archivar el chat y fingir que ese grupo jamás existió.","arquetipo":"kraken"},{"texto":"Escucharlo al 2x con taquicardia pensando que alguien ha tenido un percance grave.","arquetipo":"basilisco"},{"texto":"Responder escuetamente con un 'Ok' para proteger mi valioso tiempo como si fuera oro puro.","arquetipo":"dragon"},{"texto":"Ignorarlo todo el día y responder a las 4:00 AM con un mensaje filosófico de tres párrafos.","arquetipo":"fenix"}]},{"id":"m3","texto":"Se acaba el café en casa justo un lunes por la mañana con lluvia. ¿Cuál es tu transformación?","opciones":[{"texto":"Paralización total; me quedo inmóvil esperando que la marea de la vida me arrastre.","arquetipo":"kraken"},{"texto":"Una mirada petrificante que hiela la sangre de cualquiera que ose desearme 'buenos días'.","arquetipo":"basilisco"},{"texto":"Acaparar el último sobre de té caducado del fondo de la despensa como un tesoro sagrado.","arquetipo":"dragon"},{"texto":"No necesito café diurno; mi energía solar interior se recarga misteriosamente cuando anochece.","arquetipo":"fenix"}]},{"id":"m4","texto":"¿Cuál es tu relación con tu bandeja de correo electrónico o mensajes pendientes?","opciones":[{"texto":"3.420 correos sin leer sepultados en el abismo marino de mi bandeja de entrada.","arquetipo":"kraken"},{"texto":"Cero correos sin leer; me da ansiedad ver un solo globo rojo de notificación.","arquetipo":"basilisco"},{"texto":"Solo respondo si el correo incluye una compensación directa o beneficio incuestionable.","arquetipo":"dragon"},{"texto":"Dejo que se acumulen durante semanas y los respondo todos en un ataque de inspiración nocturna.","arquetipo":"fenix"}]},{"id":"m5","texto":"Un amigo te cancela un plan de salir el viernes por la noche con 30 minutos de antelación. Tu reacción interior sincera es:","opciones":[{"texto":"¡Victoria colosal! Me deslizo sigilosamente hacia la cama con pijama antes de que cambie de opinión.","arquetipo":"kraken"},{"texto":"Analizar obsesivamente si he dicho algo en los últimos 3 meses que haya ofendido a su linaje.","arquetipo":"basilisco"},{"texto":"Alivio absoluto: 4 horas extra ganadas para custodiarlas en mi solitaria fortaleza.","arquetipo":"dragon"},{"texto":"Perfecto, ahora puedo empezar a escribir mi novela / proyecto loco a las 23:00 sin distracciones.","arquetipo":"fenix"}]},{"id":"m6","texto":"Cuando tienes que tomar una decisión importante en tu vida, ¿cómo procedes?","opciones":[{"texto":"Esperar tanto tiempo a que la decisión se resuelva sola por la inercia del universo.","arquetipo":"kraken"},{"texto":"Imaginar con precisión quirúrgica los 40 peores escenarios catastróficos posibles.","arquetipo":"basilisco"},{"texto":"La opción que me cueste menos dinero, menos energía y me deje más tiempo libre.","arquetipo":"dragon"},{"texto":"Tener una revelación mística a medianoche tras horas de insomnio creativo.","arquetipo":"fenix"}]},{"id":"m7","texto":"Tu entorno de trabajo o escritorio suele estar en estado de:","opciones":[{"texto":"Un arrecife caótico donde conviven tazas, libretas de 2021 y cables enredados.","arquetipo":"kraken"},{"texto":"Milimétricamente limpio porque cualquier desorden altera mi equilibrio neuronal.","arquetipo":"basilisco"},{"texto":"Rodeado de mis objetos favoritos que nadie tiene permiso para tocar o mover un milímetro.","arquetipo":"dragon"},{"texto":"Una lámpara tenue, música ambiental a oscuras y tres ventanas abiertas con ideas a medio hacer.","arquetipo":"fenix"}]},{"id":"m8","texto":"Si pudieras tener un superpoder para lidiar con el mundo moderno, ¿cuál elegirías?","opciones":[{"texto":"Hacerme invisible y sumergirme en el abismo cuando alguien me pida un favor.","arquetipo":"kraken"},{"texto":"Inmunidad total a cualquier virus, bacteria, dolor de espalda o incertidumbre vital.","arquetipo":"basilisco"},{"texto":"El poder de incinerar compromisos sociales absurdos con solo una mirada.","arquetipo":"dragon"},{"texto":"Días de 30 horas donde las 6 extra sean de noche silenciosa sin nadie molestando.","arquetipo":"fenix"}]}],"resultados":{"kraken":{"nombre":"El Kraken Procrastinador","tituloCorto":"El Señor del Abismo Cómodo","icono":"🐙","color":"#06b6d4","descripcion":"Cuando la presión aumenta, tus tentáculos se extienden en 14 direcciones simultáneas excepto en la que deberías trabajar. Tu capacidad para sumergirte en el abismo de la pereza y esquivar responsabilidades con elegancia oceánica es legendaria.","fortaleza":"Inmunidad al pánico colectivo: mientras el barco se hunde, tú estás plácidamente sumergido.","desvario":"Eres capaz de aprender ruso antiguo en Duolingo con tal de no contestar un correo urgente.","afinidad":"Alta compatibilidad con camas mullidas y mantas pesadas."},"basilisco":{"nombre":"El Basilisco Hipocondríaco","tituloCorto":"La Mirada del Hiperanálisis","icono":"🐍","color":"#10b981","descripcion":"Posees una mente analítica tan afilada que a veces te corta a ti mismo. Un leve dolor de cabeza se convierte en un diagnóstico de enciclopedia médica y un mensaje seco en una crisis diplomática. Tu mirada todo lo detecta.","fortaleza":"Capacidad de anticipación brutal: jamás te pillará desprevenido ningún imprevisto.","desvario":"Petrificas a la gente con tu sobreanálisis de conversaciones que ocurrieron en 2018.","afinidad":"Afinidad con infusiones relajantes y modos 'No Molestar' activados."},"dragon":{"nombre":"El Dragón Acaparador","tituloCorto":"El Guardián del Tiempo y la Paz","icono":"🐉","color":"#f59e0b","descripcion":"Tu mayor tesoro no es el oro ni las joyas: es tu tiempo, tu silencio y tu espacio personal. Quien ose interrumpir tu reposo en tu cueva se arriesga a una llamarada de sarcasmo cortante. Eres protector férreo de tus horas libres.","fortaleza":"Estableces límites infranqueables y sabes decir 'NO' sin que te tiemble el pulso.","desvario":"Tratas tu fin de semana como un tesoro sagrado que defenderías con fuego y garras.","afinidad":"Afinidad con la soledad reconfortante y las fortalezas inexpugnables."},"fenix":{"nombre":"El Fénix Trasnochador","tituloCorto":"El Resurgir de las 3:00 AM","icono":"🔥","color":"#ec4899","descripcion":"Durante el día eres una pila de cenizas funcionales que apenas sobrevive a las reuniones. Pero cuando cae la noche y el mundo duerme, tus llamas despiertan con una energía creativa y una lucidez asombrosa que deja a todos boquiabiertos.","fortaleza":"Productividad explosiva de última hora: resuelves en 40 minutos lo que otros tardan tres días.","desvario":"Tu reloj circadiano pertenece a otra dimensión temporal no registrada por la física moderna.","afinidad":"Afinidad con la noche silenciosa, las bombillas cálidas y las ideas brillantes."}}},"nivel-introversion-extrema":{"id":"nivel-introversion-extrema","slug":"nivel-introversion-extrema","titulo":"El Medidor de Introversión: ¿Ermitaño Filosófico o Bicho Social?","subtitulo":"Un diagnóstico perspicaz y divertido sobre tu verdadera batería social y tu relación con el aislamiento.","descripcionCorta":"Responde a 7 situaciones cotidianas y mordaces sobre cancelaciones de planes, llamadas inesperadas y el sublime placer de no salir de casa.","tipo":"puntuacion","categoria":"humor","categoriaLabel":"Psicología & Humor","icono":"🕯️","tiempoMin":3,"color":"#8b5cf6","preguntas":[{"id":"ie1","texto":"Viernes por la tarde, 19:30. Te llega un mensaje de WhatsApp al grupo: «Chicos, se cancela la cena de hoy que varios estamos cansados». ¿Cuál es tu reacción física instantánea?","opciones":[{"texto":"Me invade una profunda decepción; ya me estaba vistiendo y busco plan alternativo de inmediato.","puntos":0},{"texto":"Me da cierta pereza haberme arreglado a medias, pero aprovecho para ver una serie.","puntos":10},{"texto":"Siento una oleada de dopamina, júbilo y paz celestial recorriendo mi columna vertebral.","puntos":25},{"texto":"Me arrodillo a dar gracias a los dioses mientras me pongo el pijama a la velocidad del rayo.","puntos":35}]},{"id":"ie2","texto":"Tu teléfono móvil empieza a vibrar con una llamada de voz de un número que NO tienes guardado en la agenda. ¿Qué haces?","opciones":[{"texto":"Descuelgo con normalidad: «¿Sí, dígame?». Podría ser un paquete o un asunto urgente.","puntos":0},{"texto":"Espero a que termine de sonar y busco el número en Google por si es spam.","puntos":15},{"texto":"Pongo el móvil boca abajo, contengo la respiración y me quedo inmóvil como si el aparato pudiera verme.","puntos":25},{"texto":"Considero seriamente cambiar de identidad, arrojar el teléfono al mar y mudarme a un monasterio tibetano.","puntos":35}]},{"id":"ie3","texto":"Sales al rellano de tu casa para tirar la basura y escuchas que la puerta del vecino de enfrente se está abriendo. ¿Cuál es tu maniobra?","opciones":[{"texto":"Salgo con alegría y aprovecho para saludarlo y preguntarle qué tal la semana.","puntos":0},{"texto":"Mantengo el paso normal, suelto un «hola buenas» educado y continúo hacia el ascensor.","puntos":10},{"texto":"Me congelo en la mirilla durante 45 segundos hasta que oigo el clic del ascensor cerrándose en su planta.","puntos":25},{"texto":"Finjo que se me han olvidado las llaves dentro, doy media vuelta y me encierro en casa hasta que haya silencio sepulcral.","puntos":35}]},{"id":"ie4","texto":"Asistes a una fiesta o evento social grande donde solo conoces a la persona que te invitó. Esa persona desaparece 20 minutos a saludar a otros. ¿Dónde te encuentras?","opciones":[{"texto":"Charloteando animadamente con un grupo de desconocidos junto a la barra.","puntos":0},{"texto":"Revisando el móvil de forma casual cerca de la comida para no parecer desubicado.","puntos":15},{"texto":"Acariciando al perro o al gato de la casa como si fuera mi mejor amigo de toda la vida.","puntos":25},{"texto":"Escondido en el baño inspeccionando las marcas del champú del anfitrión para ganar tiempo.","puntos":35}]},{"id":"ie5","texto":"Sábado noche. Has pasado 36 horas seguidas en casa sin hablar con ningún ser humano cara a cara. ¿Cómo te sientes?","opciones":[{"texto":"Asfixiado, deprimido y con necesidad imperiosa de salir a que me dé el aire y ver gente.","puntos":0},{"texto":"Bien, descansado, pero listo para quedar con alguien el domingo por la tarde.","puntos":10},{"texto":"En mi auténtico estado de gracia zen: productivo, en paz y con la mente regenerada.","puntos":25},{"texto":"¿36 horas? Eso son números de principiante. Podría estar 3 meses así y alcanzar la iluminación mística.","puntos":35}]},{"id":"ie6","texto":"Entras a una tienda de ropa y un dependiente sonriente se te acerca a dos palmos diciendo: «¡Hola! ¿Buscabas algo en especial o te puedo ayudar?». ¿Qué piensas?","opciones":[{"texto":"«¡Qué atento! Le pregunto directamente por tallas y consejos».","puntos":0},{"texto":"«Solo estoy mirando, gracias», y sigo ojeando sin agobios.","puntos":10},{"texto":"«Por favor, mantén tu aura a cinco metros de mí o dejaré la prenda que tengo en la mano».","puntos":25},{"texto":"Suelto la camiseta de inmediato, digo «gracias» mirando al suelo y huyo de la tienda como si me persiguiera la Interpol.","puntos":35}]},{"id":"ie7","texto":"¿Qué frase resume con mayor precisión tu filosofía de recarga energética?","opciones":[{"texto":"«La soledad prolongada me marchita; la energía me la dan las risas y la vida compartida».","puntos":0},{"texto":"«Disfruto tanto de una buena fiesta con amigos como de una tarde tranquila de lectura en el sofá».","puntos":10},{"texto":"«Mi batería social dura exactamente dos horas; a partir de ahí, solo soy un holograma educado pero ausente».","puntos":25},{"texto":"«El infierno son los otros... sobre todo si te piden que pongas la cámara en una videollamada de trabajo».","puntos":35}]}],"rangos":[{"min":0,"max":40,"nivel":"Nivel 1","titulo":"Mariposa Social Extrovertida","icono":"🦋","color":"#10b981","descripcion":"Tu ecosistema natural es la multitud, el bullicio y la interacción continua. Las cancelaciones de planes te arruinan el día y tu batería social parece alimentada por un reactor nuclear. Posees don de gentes, soltura conversacional y eres incapaz de pasar un fin de semana entero sin intercambiar palabras con alguien.","consejo":"Intenta dedicar de vez en cuando un par de horas a la introspección en soledad: descubrirás que tu propio diálogo interior también es una compañía fascinante."},{"min":41,"max":85,"nivel":"Nivel 2","titulo":"Ambivertido con Filtro Selectivo","icono":"⚖️","color":"#06b6d4","descripcion":"Has alcanzado el equilibrio aristotélico entre la vida social y el recogimiento personal. Sabes brillar en reuniones y pasártelo en grande cuando el grupo vale la pena, pero valoras enormemente tus horas de silencio, series y café en calma para reiniciar el sistema operativo de tu cabeza.","consejo":"Sigue protegiendo tus límites sin sentir culpa: decir 'no me apetece hoy' es el mayor superpoder del bienestar mental moderno."},{"min":86,"max":130,"nivel":"Nivel 3","titulo":"Introvertido de Cueva Sagrada","icono":"🕯️","color":"#8b5cf6","descripcion":"Tu hogar es tu templo inexpugnable. Tu batería social es de litio de gama baja: tras dos horas de exposición a grupos humanos entras en modo 'ahorro de energía'. Odias las llamadas imprevistas por encima de todas las cosas y consideras que una cancelación de planes a última hora es el mejor regalo que el universo te puede brindar.","consejo":"No te aísles tanto que termines perdiendo contacto con esos 2 o 3 amigos leales que respetan tus silencios. Una pequeña dosis de mundo exterior de vez en cuando previene el anquilosamiento."},{"min":131,"max":245,"nivel":"Nivel 4","titulo":"Ermitaño Cuántico de Otra Galaxia","icono":"🌌","color":"#ec4899","descripcion":"Si el filósofo Diógenes de Sínope viviese en el siglo XXI, te pediría asesoría sobre cómo aislarse del género humano. La interacción no programada te produce alergia metafísica y sospechas que la humanidad en general habla demasiado para lo poco que tiene que decir. Te bastan tus libros, tus proyectos y el gato.","consejo":"Asegúrate de comprobar de vez en cuando que el sol sigue existiendo y que recuerdas cómo pronunciar consonantes en voz alta. Por lo demás, tu paz mental es envidiable."}]},"paradojas-temporales":{"id":"paradojas-temporales","slug":"paradojas-temporales","titulo":"El Laberinto de las Paradojas: 5 Desafíos de Lógica Cuántica","subtitulo":"Pon a prueba tu intuición con acertijos contraintuitivos y dilemas reales de la física y la filosofía.","descripcionCorta":"5 enigmas cerebrales de alto nivel sobre paradojas temporales, teoría de juegos y causalidad con pistas paso a paso.","tipo":"enigma","categoria":"logica","categoriaLabel":"Lógica & Paradojas","icono":"🌀","tiempoMin":5,"color":"#0284c7","enigmas":[{"id":"pt1","titulo":"Enigma 1: La Paradoja de la Información Sin Origen (Bootstrap Paradox)","planteamiento":"Un viajero temporal del año 2050 viaja al año 1600 y le entrega a William Shakespeare un ejemplar encuadernado de «Hamlet». Shakespeare, asombrado por la obra maestra, la copia a mano palabra por palabra y la estrena en Londres. Siglos después, ese mismo texto impreso se vende en las librerías hasta que en 2050 el viajero compra un ejemplar y viaja al pasado para entregárselo a Shakespeare.\n\nLa pregunta fundamental de causalidad es:\n**¿Quién compuso o ideó originalmente los versos de Hamlet?**","pistas":["Pista 1: Analiza el recorrido del libro: Shakespeare no lo compuso (lo copió del libro que le dieron), y el viajero tampoco lo escribió (lo compró en una librería porque Shakespeare ya lo había publicado).","Pista 2: Se trata de un bucle de información causal cerrada (Ontological Paradox / Bootstrap Paradox).","Pista 3: En un bucle causal cerrado, la información existe sin haber sido jamás generada por un acto creativo."],"opciones":[{"id":"a","texto":"Shakespeare en una versión previa de la línea temporal antes de que el viajero interviniera.","correcta":false},{"id":"b","texto":"Nadie: la información existe en un bucle cerrado autorreferencial sin punto de origen creativo.","correcta":true},{"id":"c","texto":"El viajero temporal, pues fue quien tomó la decisión física de transportarlo.","correcta":false},{"id":"d","texto":"La imprenta del año 2050 donde se fabricaron las hojas de papel.","correcta":false}],"explicacion":"¡Magistral deducción! Es la célebre **Paradoja del Bucle Ontológico (Bootstrap Paradox)**. Shakespeare sólo copió el libro del futuro, y el viajero sólo compró el libro del pasado. La información existe en el universo pero carece por completo de un creador original: un efecto que se convierte en su propia causa."},{"id":"pt2","titulo":"Enigma 2: El Barbero de la Aldea y la Paradoja de Russell","planteamiento":"En una aldea medieval aislada rige una ley estricta dictada por el alcalde:\n\n*«El barbero afeita a todos los hombres de la aldea que NO se afeitan a sí mismos, y ÚNICAMENTE a ellos»*.\n\nEl barbero es un habitante varón de la aldea y cumple la ley al pie de la letra.\n\nLa pregunta del tribunal es: **¿Quién afeita al barbero?**","pistas":["Pista 1: Supón primero que el barbero se afeita a sí mismo. Si se afeita a sí mismo, ¿qué dice la ley sobre quién debe afeitarle?","Pista 2: Ahora supón lo contrario: que NO se afeita a sí mismo. ¿A quién tiene la obligación de afeitar el barbero según la orden?","Pista 3: Ambos caminos lógicos colapsan en una contradicción directa irresoluble bajo esa premisa."],"opciones":[{"id":"a","texto":"Se afeita él mismo los domingos fuera de horario laboral.","correcta":false},{"id":"b","texto":"Le afeita su aprendiz para esquivar el decreto.","correcta":false},{"id":"c","texto":"Es una contradicción lógica estricta: tal barbero no puede existir matemáticamente bajo esa definición.","correcta":true},{"id":"d","texto":"El barbero no tiene barba, por lo que la regla no le aplica.","correcta":false}],"explicacion":"¡Exacto! Bertrand Russell formuló esta paradoja en 1901 para demostrar una inconsistencia en la teoría ingenua de conjuntos. Si el barbero se afeita a sí mismo, viola la regla de que *sólo* afeita a quienes no se afeitan. Pero si no se afeita, la regla le *obliga* a afeitarse. La conclusión lógica irrefutable es que **un barbero con esa descripción no puede existir**."},{"id":"pt3","titulo":"Enigma 3: El Reloj que Atrasaba Más Cuanto Más Corría","planteamiento":"Dos astronautas gemelos idénticos tienen 30 años. Uno de ellos sube a una nave espacial que viaja a 0.99c (99% de la velocidad de la luz) durante lo que para él parecen **5 años de viaje** según el cronómetro de a bordo.\n\nAl regresar a la Tierra y reunirse con su hermano gemelo que se quedó en la base terrestre, ¿qué descubren al comparar sus edades biológicas?","pistas":["Pista 1: Recuerda la teoría de la Relatividad Especial de Einstein sobre la dilatación temporal a velocidades relativistas.","Pista 2: Para el observador que se desplaza a velocidades cercanas a la de la luz, el tiempo transcurre mucho más lento respecto al observador en reposo.","Pista 3: El gemelo que viajó tiene 35 años (30 + 5). Pero en la Tierra han pasado varias décadas."],"opciones":[{"id":"a","texto":"Ambos tienen exactamente la misma edad biológica de 35 años.","correcta":false},{"id":"b","texto":"El gemelo viajero tiene 35 años, mientras que su hermano en la Tierra es un anciano de más de 65 años.","correcta":true},{"id":"c","texto":"El gemelo de la Tierra ha rejuvenecido debido a la gravedad constante del planeta.","correcta":false},{"id":"d","texto":"El gemelo viajero envejeció más rápido debido a la radiación cósmica del vacío.","correcta":false}],"explicacion":"¡Física pura confirmada experimentalmente! La **Paradoja de los Gemelos** de Einstein no es una ilusión óptica: a 99% de la velocidad de la luz, el factor de Lorentz dilata el tiempo aproximadamente por un factor de 7. Para el astronauta pasaron 5 años (ahora tiene 35 años), pero en la Tierra pasaron unos 35 años (su gemelo terrestre tiene 65 años)."},{"id":"pt4","titulo":"Enigma 4: La Paradoja de los Cuervos de Hempel","planteamiento":"Un ornitólogo formula la siguiente hipótesis científica: **«Todos los cuervos son negros»**.\nEn lógica proposicional, esta afirmación es matemáticamente idéntica y equivalente a: **«Todo objeto que NO sea negro, NO es un cuervo»**.\n\nEl científico está en su despacho y ve sobre su mesa una **manzana verde**.\n\nSegún las reglas formales de la lógica inductiva, ¿observar esa manzana verde sirve como prueba que confirma que todos los cuervos son negros?","pistas":["Pista 1: Una manzana verde es un objeto 'no-negro' que a la vez es 'no-cuervo'.","Pista 2: Por equivalencia contrapositiva (A implica B es idéntico a No-B implica No-A), cualquier caso que confirme una premisa confirma la otra.","Pista 3: La paradoja radica en que teóricamente sí lo confirma, aunque en la práctica el incremento de probabilidad sea infinitesimalmente absurdo."],"opciones":[{"id":"a","texto":"No tiene ningún valor lógico; las manzanas no tienen plumas ni relación con las aves.","correcta":false},{"id":"b","texto":"Sí, lógicamente aporta evidencia confirmatoria positiva a la hipótesis, aunque resulte intuitivamente ridículo.","correcta":true},{"id":"c","texto":"Refuta la hipótesis porque introduce un color que no es negro en el conjunto del universo.","correcta":false},{"id":"d","texto":"Solo sirve si la manzana verde fue picoteada previamente por un cuervo negro.","correcta":false}],"explicacion":"¡Brillante! Carl Hempel expuso esta paradoja para evidenciar los límites de la inducción lógica: como «Todos los cuervos son negros» equivale lógicamente a «Todo lo no-negro no es cuervo», observar un calcetín blanco o una manzana verde confirma formalmente la regla. Demuestra que la lógica pura a veces desafía el sentido común humano."},{"id":"pt5","titulo":"Enigma 5: La Paradoja del Mentiroso Cuántico","planteamiento":"Un androide con inteligencia artificial avanzada entra en un bucle cognitivo y emite por sus altavoces una sola frase:\n\n**«Esta frase que estoy diciendo en este instante es COMPLETAMENTE FALSA»**.\n\nSi analizas la frase bajo la lógica binaria clásica de verdadero o falso, ¿cuál es el estado de verdad de la afirmación del androide?","pistas":["Pista 1: Si la frase es VERDADERA, entonces lo que afirma es cierto, por lo que debe ser FALSA (contradicción).","Pista 2: Si la frase es FALSA, entonces lo que afirma no se cumple, por lo que debe ser VERDADERA (contradicción).","Pista 3: Es la célebre Paradoja de Epiménides / Paradoja del Mentiroso, que llevó a Kurt Gödel a formular su Teorema de Incompletitud."],"opciones":[{"id":"a","texto":"Es definitivamente Verdadera porque el androide tiene prohibido mentir por sus circuitos.","correcta":false},{"id":"b","texto":"Es definitivamente Falsa porque las máquinas no poseen consciencia semántica.","correcta":false},{"id":"c","texto":"Es indecidible: crea una oscilación infinita de verdad que rompe los sistemas axiomáticos tradicionales.","correcta":true},{"id":"d","texto":"Es una metáfora poética sobre la fragilidad del silicio.","correcta":false}],"explicacion":"¡Correcto! La **Paradoja del Mentiroso** es el pilar sobre el que Kurt Gödel demostró en 1931 que en cualquier sistema formal matemático suficientemente rico siempre existirán proposiciones verdaderas que no pueden ser demostradas dentro del propio sistema. Una frase autorreferencial que revienta la lógica binaria."}]},"supervillano":{"id":"supervillano","slug":"supervillano","titulo":"¿Qué Tipo de Supervillano de Cómic Serías?","subtitulo":"Guaridas en volcanes, planes a 50 años y risas malévolas: descubre tu verdadero estilo de dominación mundial.","descripcionCorta":"8 situaciones límite para descubrir tu perfil antagonista de cómic: ¿Mente Maestra, Agente del Caos, Científico Loco o Burócrata Malvado?","tipo":"personalidad","categoria":"humor","categoriaLabel":"Humor & Diagnósticos","icono":"🦹","tiempoMin":3,"color":"#db2777","preguntas":[{"id":"vil1","texto":"Tienes que elegir la ubicación secreta de tu cuartel general supremo. ¿Dónde estableces tu base de operaciones?","opciones":[{"texto":"En una estación espacial orbital invisible que monitoriza todas las bolsas financieras del planeta.","arquetipo":"mentemaestra"},{"texto":"En una feria de atracciones abandonada llena de espejos deformantes, trampas absurdas y música de circo al revés.","arquetipo":"caotico"},{"texto":"En el cráter de un volcán extinto, repleto de bobinas de Tesla gigantes y robots con brazos hidráulicos.","arquetipo":"cientifico"},{"texto":"En la planta 42 de un rascacielos de cristal en el centro financiero: con seguridad privada, cafetería y todo 100% legal.","arquetipo":"burocrata"}]},{"id":"vil2","texto":"El superhéroe de turno cae finalmente en una de tus trampas y queda suspendido boca abajo sobre un foso peligroso. ¿Qué haces?","opciones":[{"texto":"No pierdo un segundo en monólogos: un disparo silenciado certero y me voy a ejecutar la fase 4 de mi plan.","arquetipo":"mentemaestra"},{"texto":"Le lanzo tartas de nata mientras toco la corneta y le pregunto si prefiere ser rescatado por un patito de goma gigante.","arquetipo":"caotico"},{"texto":"Le explico durante 45 minutos los principios termodinámicos del rayo desintegrador que tardé tres años en calibrar.","arquetipo":"cientifico"},{"texto":"Le entrego una notificación de desalojo inmediato de su guarida por carecer de licencia municipal de obras.","arquetipo":"burocrata"}]},{"id":"vil3","texto":"¿Cuál es tu vestimenta de trabajo ideal cuando sales a sembrar el pánico o hacer declaraciones a la prensa?","opciones":[{"texto":"Un traje a medida impecable de corte italiano color carbón, guantes de cuero fino y un bastón con punta de titanio.","arquetipo":"mentemaestra"},{"texto":"Un mono chillón de colores imposibles, maquillaje corrido y unas botas militares que no combinan con nada.","arquetipo":"caotico"},{"texto":"Una bata blanca chamuscada por el ácido, gafas protectoras con 6 lentes intercambiables y guantes de goma aislante.","arquetipo":"cientifico"},{"texto":"Camisa azul celeste, corbata sobria y un maletín de piel auténtica donde guardo los acuerdos de confidencialidad.","arquetipo":"burocrata"}]},{"id":"vil4","texto":"¿Qué motivo primordial te empujó a la senda de la villanía y el conflicto mundial?","opciones":[{"texto":"El mundo está gobernado por incompetentes; la humanidad necesita un arquitecto superior que imponga orden absoluto.","arquetipo":"mentemaestra"},{"texto":"La gente se toma la vida demasiado en serio. Un poco de anarquía purifica el espíritu y hace la rutina mucho más divertida.","arquetipo":"caotico"},{"texto":"Me rechazaron la tesis doctoral sobre generadores de agujeros de gusano domésticos. Ahora pagarán las consecuencias.","arquetipo":"cientifico"},{"texto":"El dinero y la rentabilidad neta anual: rescatar gatitos no paga las acciones preferentes ni los dividendos del consejo.","arquetipo":"burocrata"}]},{"id":"vil5","texto":"Tus esbirros han fallado en una misión sencilla y han dejado escapar una pieza clave. ¿Cómo gestionas el error?","opciones":[{"texto":"Lo tenía previsto como señuelo en la contingencia C-12. El fallo del esbirro ya forma parte de mi emboscada mayor.","arquetipo":"mentemaestra"},{"texto":"Nombro al esbirro 'Empleado del Mes', le regalo un ramo de flores explosivas y me río durante media hora.","arquetipo":"caotico"},{"texto":"Le conecto unos electrodos en el casco para 'optimizar' su capacidad sináptica mediante descargas moderadas.","arquetipo":"cientifico"},{"texto":"Le abro un expediente sancionador, le retiro el ticket restaurante y le obligo a hacer horas extras no remuneradas.","arquetipo":"burocrata"}]},{"id":"vil6","texto":"Tienes acceso a los satélites de telecomunicaciones mundiales para emitir un mensaje simultáneo a toda la Tierra. ¿Qué dices?","opciones":[{"texto":"«Tienen 24 horas para disolver sus ejércitos y transferir la autoridad a mi consejo. El futuro empieza hoy».","arquetipo":"mentemaestra"},{"texto":"«He escondido 500 patos de goma con códigos secretos en cada ciudad. El primero que los junte todos... no gana nada».","arquetipo":"caotico"},{"texto":"«Miren la Luna. En diez segundos cambiará de color gracias a mi rayo de refracción cromática. ¡Admiren mi genialidad!»","arquetipo":"cientifico"},{"texto":"«A partir de mañana, el IVA de todos los productos de consumo sube un 14% bajo la firma de nuestra nueva filial».","arquetipo":"burocrata"}]},{"id":"vil7","texto":"¿Cuál es tu punto débil secreto que un héroe perspicaz podría utilizar para derrotarte?","opciones":[{"texto":"Mi desprecio por el azar: si ocurre una casualidad estúpida e improbable de 1 entre un billón, descuadra mi cálculo.","arquetipo":"mentemaestra"},{"texto":"Que me aburro con demasiada facilidad; si el héroe no me divierte, puedo dejarlo ir y buscar otro pasatiempo.","arquetipo":"caotico"},{"texto":"Puse un botón de auto-destrucción con luz de neón roja en la consola central porque quedaba estéticamente fantástico.","arquetipo":"cientifico"},{"texto":"Una auditoría fiscal externa sorpresa de Hacienda realizada por un funcionario completamente incorruptible.","arquetipo":"burocrata"}]},{"id":"vil8","texto":"Si finalmente logras derrotar al héroe y conquistar el planeta, ¿qué haces al día siguiente?","opciones":[{"texto":"Implementar un plan quinquenal de infraestructura global, transporte supersónico y reordenación urbana impecable.","arquetipo":"mentemaestra"},{"texto":"Pintar todos los monumentos históricos de rosa fosforito y decretar que los martes sea obligatorio caminar hacia atrás.","arquetipo":"caotico"},{"texto":"Encerrarme en mi laboratorio definitivo con presupuesto infinito para construir un acelerador de partículas del tamaño de Europa.","arquetipo":"cientifico"},{"texto":"Reunirme con el comité de dirección a las 9:00 AM para revisar el informe de balance trimestral de la Tierra.","arquetipo":"burocrata"}]}],"resultados":{"mentemaestra":{"nombre":"La Mente Maestra Estratégica","tituloCorto":"El Ajedrecista en la Sombra","icono":"♟️","color":"#6366f1","descripcion":"Nunca ,"afinidad":"Te llevas bien con robots y autómatas; los humanos te parecen demasiado ruidosos e ineficientes."},"burocrata":{"nombre":"El Tirano Corporativo","tituloCorto":"El Mal en Letra Pequeña","icono":"💼","color":"#d97706","descripcion":"¿Por qué volar edificios si puedes comprar la compañía de aguas y triplicar las tarifas? Eres el villano más temido porque todo lo que haces es técnicamente 100% legal. Destruyes esperanzas mediante cláusulas abusivas, comisiones de mantenimiento y 45 minutos de música en espera telefónica.","fortaleza":"Poder financiero absoluto, bufetes de abogados implacables y sonrisa corporativa imperturbable.","desvario":"Careces por completo de drama heroico; tu mayor arma de destrucción masiva es un PDF protegido con contraseña.","afinidad":"Comprarías la empresa donde trabaja el superhéroe para despedirlo por reducción de plantilla."}}},"supervivencia-apocalipsis":{"id":"supervivencia-apocalipsis","slug":"supervivencia-apocalipsis","titulo":"¿Sobrevivirías a un Apocalipsis Absurdo?","subtitulo":"Decisiones extremas en un escenario donde todo lo que puede salir mal, saldrá peor.","descripcionCorta":"Evalúa tus instintos de supervivencia frente a hordas de mutantes, escasez de papel higiénico y dilemas de refugio.","tipo":"puntuacion","categoria":"humor","categoriaLabel":"Humor & Diagnósticos","icono":"⚔️","tiempoMin":3,"color":"#ef4444","preguntas":[{"id":"s1","texto":"Las sirenas de alarma mundial comienzan a sonar a las 3:00 AM. La radio anuncia un colapso inminente. ¿Cuál es tu **primer movimiento**?","opciones":[{"texto":"Correr al supermercado a llenar el carro con 400 rollos de papel higiénico y latas de atún.","puntos":5},{"texto":"Llenar todas las ollas, bañeras y botellas de agua potable, asegurar puertas y esperar información fiable.","puntos":15},{"texto":"Subir una foto a redes sociales con el texto: *«Vaya añito llevamos #FinDelMundo»*.","puntos":0},{"texto":"Coger una linterna, un cuchillo de cocina y subir a la azotea a o vida.","puntos":0},{"texto":"Miro discretamente alrededor para asegurarme de que nadie me ha visto hacer el ridículo.","puntos":10},{"texto":"Culpo a una falla temporal en la simulación o a duendes domésticos.","puntos":20},{"texto":"Sigo buscando otras cosas por si acaso he perdido también el sentido común.","puntos":30}]},{"id":"p2","texto":"Te vas a la cama a las 23:00 para descansar bien. Son las 02:30 y estás viendo un documental sobre cómo se fabrican los clips o teorías sobre la Atlántida. ¿Cómo te justificas?","opciones":[{"texto":"«Apago el móvil ya mismo, esto no tiene perdón».","puntos":0},{"texto":"«Un vídeo más de 3 minutos y a dormir... seguro».","puntos":10},{"texto":"«Es cultura general básica que podría salvarme la vida en un concurso de televisión».","puntos":20},{"texto":"«La sociedad duerme, pero las mentes brillantes producimos de madrugada».","puntos":30}]},{"id":"p3","texto":"Alguien que apenas conoces te dice: «Tenemos que hablar». ¿Cuál es tu primera hipótesis mental?","opciones":[{"texto":"Será algo trivial de trabajo o una pregunta cualquiera.","puntos":0},{"texto":"He hecho algo mal sin darme cuenta y me van a cantar las cuarenta.","puntos":10},{"texto":"Ha descubierto mi identidad secreta o me van a reclutar para una agencia clandestina.","puntos":25},{"texto":"Fingiré un desmayo teatral o cambiaré de país antes del mediodía.","puntos":35}]},{"id":"p4","texto":"Vas al supermercado a por leche y pan. Sales con 65 euros gastados en salsas asiáticas, calcetines con dibujos de aguacates y un destornillador. ¿Compraste la leche?","opciones":[{"texto":"Sí, traje todo lo de la lista y un extra.","puntos":0},{"texto":"Compré todo excepto la leche... tendré que volver.","puntos":15},{"texto":"No compré la leche, pero mira qué salsa de mango más exótica.","puntos":25},{"texto":"¿Había ido a por leche? Yo creía que iba a explorar el pasillo de novedades.","puntos":35}]},{"id":"p5","texto":"Mantienes una conversación completa con tu mascota o con una planta en voz alta. ¿Cuál es el tono?","opciones":[{"texto":"Solo les digo 'hola bonito' o cosas cortas de cariño.","puntos":0},{"texto":"Les cuento mis problemas del día porque son los únicos que no me juzgan.","puntos":15},{"texto":"Debatimos sobre geopolítica y decisiones financieras familiares.","puntos":25},{"texto":"Juro que el gato asintió con la cabeza y me dio la razón.","puntos":35}]},{"id":"p6","texto":"Escuchas una canción pegadiza en la radio que odias con toda tu alma. ¿Qué ocurre las siguientes 4 horas?","opciones":[{"texto":"Se me olvida a los dos minutos.","puntos":0},{"texto":"La tarareo con rabia sin poder evitarlo.","puntos":15},{"texto":"Creo una coreografía involuntaria mientras pongo la lavadora.","puntos":25},{"texto":"Se convierte en la banda sonora de mis pensamientos hasta el día del juicio final.","puntos":35}]},{"id":"p7","texto":"Si pudieras definir tu estado mental habitual con un fenómeno meteorológico, ¿cuál sería?","opciones":[{"texto":"Día despejado con brisa suave y predecible.","puntos":0},{"texto":"Parcialmente nublado con probabilidad de despistes aislados.","puntos":15},{"texto":"Tormenta eléctrica con ideas cayendo como rayos descontrolados.","puntos":25},{"texto":"Tornado de purpurina en una feria ambulante.","puntos":35}]}],"rangos":[{"min":0,"max":40,"nivel":"Cordura Sospechosa (0% - 20%)","titulo":"Ciudadano Peligrosamente Funcional","icono":"🧐","color":"#10b981","descripcion":"Increíble. Tu mente opera con la precisión de un reloj suizo. Duermes a tus horas, encuentras las cosas a la primera y no mantienes debates existenciales con la tostadora. O eres un monje zen o estás fingiendo muy bien.","consejo":"Atrévete a desvariar un poco, la vida con un 10% de caos es mucho más entretenida."},{"min":41,"max":100,"nivel":"Desvarío Moderado (25% - 50%)","titulo":"Desvariador Cotidiano con Estilo","icono":"☕","color":"#06b6d4","descripcion":"El punto dulce de la existencia. Tienes tus momentos de despiste antológico y tus obsesiones nocturnas con vídeos absurdos, pero sigues pagando las facturas y funcionando en sociedad sin alarmar a tus vecinos.","consejo":"Sigue así: el equilibrio perfecto entre sentido común y locura controlada."},{"min":101,"max":170,"nivel":"Filósofo del Caos (55% - 75%)","titulo":"Mente en Ebullición Perpetua","icono":"⚡","color":"#f59e0b","descripcion":"Tu cabeza es un navegador con 84 pestañas abiertas, de las cuales en 3 suena música de fondo que no sabes de dónde viene. Eres creativo, impredecible y una fuente inagotable de anécdotas estrambóticas.","consejo":"Anota tus ideas antes de que choquen entre sí y provoquen un cortocircuito."},{"min":171,"max":245,"nivel":"Desvarío Legendario (80% - 100%)","titulo":"Emperador Absoluto del Despropósito","icono":"👑","color":"#ec4899","descripcion":"Has trascendido la cordura ordinaria. Las leyes de la lógica mundana no aplican a tu universo. Vives en una realidad paralela fascinante donde los gatos dan consejos financieros y las madrugadas son el escenario de grandes epopeyas.","consejo":"No cambies nunca. Estás en la cúspide de Tus Desvaríos."}]},"trampas-mentales":{"id":"trampas-mentales","slug":"trampas-mentales","titulo":"¿Tu Cerebro te Engaña? Desafío de Sesgos y Paradojas","subtitulo":"6 trampas cognitivas y paradojas lógicas donde tu intuición fallará casi seguro.","descripcionCorta":"Pon a prueba tu pensamiento crítico frente a paradojas de probabilidad, falacias cotidianas e ilusiones del razonamiento.","tipo":"enigma","categoria":"logica","categoriaLabel":"Lógica & Paradojas","icono":"🧠","tiempoMin":5,"color":"#8b5cf6","enigmas":[{"id":"tm1","titulo":"Trampa 1: El Dilema de Monty Hall","planteamiento":"Estás en un concurso de televisión frente a **3 puertas cerradas**:\n- Tras una de ellas hay un **coche deportivo nuevo**.\n- Tras las otras dos hay **cabras**.\n\nEliges la **Puerta 1**. El presentador, que sabe perfectamente qué hay tras cada puerta, abre la **Puerta 3** y te muestra una cabra.\n\nLuego te pregunta: *«¿Deseas cambiar tu elección a la Puerta 2, o te quedas con la Puerta 1?»*\n\n¿Qué te conviene hacer matemáticamente?","pistas":["Pista 1: Cuando elegiste la Puerta 1 al principio, tu probabilidad de acertar era exactamente de 1/3 (33.3%).","Pista 2: La probabilidad de que el coche estuviera en una de las OTRAS DOS puertas combinadas era de 2/3 (66.6%).","Pista 3: El presentador ha eliminado deliberadamente una puerta perdedora del grupo del 2/3, concentrando toda esa probabilidad en la puerta restante."],"opciones":[{"id":"quedarse","texto":"Quedarse con la Puerta 1 (Da igual, ahora es 50% de probabilidad)","correcta":false},{"id":"cambiar","texto":"Cambiar SIEMPRE a la Puerta 2 (Duplicas tus probabilidades al 66.6%)","correcta":true},{"id":"indiferente","texto":"Es indiferente, el destino ya está escrito","correcta":false}],"explicacion":"¡Exacto! Aunque el sentido común nos grita «ahora quedan 2 puertas, es 50/50», la matemática demuestra que **cambiar duplica tus opciones de ganar (2 de cada 3 veces ganarás)**. Al principio tu puerta tenía solo 1/3 de probabilidad; el presentador te 'regala' la información del otro 2/3 eliminando la cabra."},{"id":"tm2","titulo":"Trampa 2: El Bate y la Pelota (Efecto Reflejo)","planteamiento":"Un bate de béisbol y una pelota cuestan en total **1,10 €**.\n\nEl bate cuesta **1,00 € más que la pelota**.\n\n¿Cuánto cuesta la pelota?","pistas":["Pista 1: No respondas con el primer número intuitivo que salte a tu cabeza sin hacer la resta formal.","Pista 2: Si la pelota costase 0,10 €, y el bate cuesta 1,00 € más, el bate costaría 1,10 € y el total sería 1,20 €.","Pista 3: Plantea la ecuación: Bate + Pelota = 1,10  =>  (Pelota + 1,00) + Pelota = 1,10."],"opciones":[{"id":"diez","texto":"0,10 € (10 céntimos)","correcta":false},{"id":"cinco","texto":"0,05 € (5 céntimos)","correcta":true},{"id":"uno","texto":"0,01 € (1 céntimo)","correcta":false}],"explicacion":"¡Bien pensado! El cerebro humano adora los atajos rápidos y casi todo el mundo responde impulsivamente «10 céntimos». Pero si la pelota cuesta **0,05 €**, el bate cuesta **1,05 €** (1 € más), sumando exactamente **1,10 €**."},{"id":"tm3","titulo":"Trampa 3: La Falacia del Jugador en la Ruleta","planteamiento":"En una mesa de ruleta de casino perfectamente equilibrada, la bola ha caído en la casilla **ROJO 7 veces consecutivas**.\n\nLos jugadores a tu alrededor comienzan a apostar grandes sumas al **NEGRO**, argumentando que «por estadística ya toca que salga negro para compensar la racha».\n\n¿Cuál es la probabilidad real de que en la siguiente tirada salga NEGRO?","pistas":["Pista 1: ¿Tiene la ruleta memoria de los giros anteriores?","Pista 2: Cada tirada es un evento estadístico completamente independiente."],"opciones":[{"id":"mayor","texto":"Mucho mayor que el 50%, la ley de los grandes números debe equilibrar la racha.","correcta":false},{"id":"exacta","texto":"Exactamente la misma de siempre (~48.6% por la presencia del cero verde).","correcta":true},{"id":"menor","texto":"Menor, porque la mesa está 'en racha caliente' de rojo.","correcta":false}],"explicacion":"¡Correcto! Esta es la clásica **Falacia del Jugador**. La bola de la ruleta no tiene memoria ni conciencia; cada giro es 100% independiente. Creer que una racha anterior 'fuerza' un resultado futuro ha arruinado a miles de apostadores en la historia."},{"id":"tm4","titulo":"Trampa 4: La Paradoja de Linda (Falacia de Conjunción)","planteamiento":"Linda tiene 31 años, es soltera, abierta de mente y muy brillante. Estudió filosofía. Como estudiante, estuvo profundamente preocupada por los problemas de discriminación y justicia social, y participó en manifestaciones antinucleares.\n\n¿Cuál de las siguientes afirmaciones es **estadísticamente más probable**?","pistas":["Pista 1: Fíjate en los conjuntos matemáticos, no en la descripción narrativa del personaje.","Pista 2: La probabilidad de que ocurra un evento A siempre es mayor o igual a que ocurran A y B al mismo tiempo."],"opciones":[{"id":"a","texto":"Linda es cajera de un banco.","correcta":true},{"id":"b","texto":"Linda es cajera de un banco y está activa en el movimiento feminista.","correcta":false}],"explicacion":"¡Brillante! Esta es la famosa paradoja de Kahneman y Tversky. Aunque la descripción nos empuje a elegir la opción B, **un solo evento (ser cajera) SIEMPRE es más probable que dos eventos simultáneos (ser cajera Y además feminista)**. El subconjunto de cajeras feministas está contenido dentro del conjunto total de cajeras."},{"id":"tm5","titulo":"Trampa 5: Las 5 Máquinas de la Fábrica","planteamiento":"Si **5 máquinas** tardan **5 minutos** en fabricar **5 piezas de motor**...\n\n¿Cuánto tiempo tardarán **100 máquinas** en fabricar **100 piezas de motor**?","pistas":["Pista 1: Calcula cuánto tarda UNA sola máquina en fabricar UNA sola pieza.","Pista 2: Cada máquina trabaja en paralelo e independiente de las demás."],"opciones":[{"id":"cien","texto":"100 minutos","correcta":false},{"id":"cinco","texto":"5 minutos","correcta":true},{"id":"uno","texto":"1 minuto","correcta":false},{"id":"veinte","texto":"20 minutos","correcta":false}],"explicacion":"¡Acertaste! Si 5 máquinas hacen 5 piezas en 5 minutos, significa que **cada máquina tarda 5 minutos en completar 1 pieza**. Por tanto, 100 máquinas trabajando al unísono producirán 100 piezas en exactamente los mismos **5 minutos**."},{"id":"tm6","titulo":"Trampa 6: El Sesgo de Supervivencia","planteamiento":"Durante la Segunda Guerra Mundial, los ingenieros analizaron los aviones que regresaban del combate llenos de agujeros de bala para reforzarlos con blindaje adicional. Los impactos se concentraban en **las alas y el fuselaje central**, mientras que los motores apenas tenían impactos.\n\n¿Dónde recomendó el estadístico Abraham Wald colocar el blindaje?","pistas":["Pista 1: Recuerda que solo estaban analizando los aviones que LOGRABAN REGRESAR a la base.","Pista 2: ¿Qué pasó con los aviones a los que dispararon en los motores?"],"opciones":[{"id":"alas","texto":"En las alas y el fuselaje, donde había más impactos visibles.","correcta":false},{"id":"motores","texto":"En los motores y cabina, donde NO había impactos en los aviones que volvían.","correcta":true},{"id":"repartido","texto":"Repartido uniformemente por todo el avión a partes iguales.","correcta":false}],"explicacion":"¡Extraordinario! Wald identificó el **Sesgo del Superviviente**: los aviones con disparos en las alas podían volar de vuelta a la base; los aviones que recibían impactos en los motores caían al mar y jamás eran examinados. Había que proteger las partes 'sin agujeros'."}]},"viajero-del-tiempo":{"id":"viajero-del-tiempo","slug":"viajero-del-tiempo","titulo":"¿Qué Tipo de Viajero del Tiempo Serías?","subtitulo":"Paradojas temporales, historia alternativa y dilemas cronológicos: descubre tu rol en el continuo espacio-tiempo.","descripcionCorta":"8 decisiones frente a saltos de época, efectos mariposa y líneas temporales rotas. ¿Eres Observador, Ingeniero, Guardián o Nómada?","tipo":"personalidad","categoria":"personalidad","categoriaLabel":"Personalidad & Arquetipos","icono":"⏳","tiempoMin":4,"color":"#f59e0b","preguntas":[{"id":"v1","texto":"Acabas de aterrizar con tu máquina temporal en la biblioteca de Alejandría, exactamente tres horas antes de que comience el gran incendio histórico. ¿Cuál es tu primera acción?","opciones":[{"texto":"Instalar escáneres cuánticos ocultos para digitalizar cada papiro sin que nadie note mi presencia ni alterar el fuego.","arquetipo":"observador"},{"texto":"Activar un extintor criogénico futurista para apagar el fuego y ver cómo avanza la ciencia si Alejandría sobrevive.","arquetipo":"ingeniero"},{"texto":"Avisar discretamente a los sabios y organizar la evacuación clandestina de las obras más valiosas a un refugio seguro.","arquetipo":"guardian"},{"texto":"Colarme en el banquete privado del Gran Bibliotecario con una copa de vino milenario para disfrutar del ambiente clásico.       formatMarkdown(text) {
        if (!text) return '';
        const blocks = text.split(/\n\s*\n/);
        return blocks.map(block => {
          const trimmed = block.trim();
          let formatted = trimmed
            .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
            .replace(/\*(.*?)\*/g, '<em>$1</em>')
            .replace(/\n/g, '<br>');

          if (trimmed.startsWith('>')) {
            const quote = formatted.replace(/^>\s*/gm, '');
            return '<blockquote>' + quote + '</blockquote>';
          }
          if (trimmed.startsWith('- ') || trimmed.startsWith('• ') || trimmed.startsWith('* ')) {
            const items = trimmed.split(/\n/).map(line => {
              const clean = line.replace(/^[-•*]\s*/, '')
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>');
              return '<li style="margin-bottom:0.4rem;">' + clean + '</li>';
            }).join('');
            return '<ul style="margin:0.75rem 0; padding-left:1.4rem; list-style-type:disc;">' + items + '</ul>';
          }
          return '<p style="margin-bottom:0.85rem;">' + formatted + '</p>';
        }).join('');

                  <p style="font-size:0.85rem; color:var(--text-muted); line-height:1.5;">Viajes al subconsciente para descubrir tus rasgos ocultos, sombras psicológicas y criaturas míticas que definen tu carácter ante la adversidad.</p>
                </div>

                <div style="padding:1.25rem; background:rgba(255, 255, 255, 0.03); border-radius:var(--radius-md); border:1px solid rgba(6, 182, 212, 0.25);">
                  <div style="font-size:1.5rem; margin-bottom:0.5rem;">🧩</div>
                  <h3 style="font-size:1.05rem; font-weight:700; color:#38bdf8; margin-bottom:0.4rem; font-family:var(--font-display);">Lógica & Paradojas</h3>
                  <p style="font-size:0.85rem; color:var(--text-muted); line-height:1.5;">Enigmas deductivos progresivos con pistas graduales y trampas de sesgos cognitivos para desafiar tu intuición y razonamiento analítico.</p>
                </div>

                <div style="padding:1.25rem; background:rgba(255, 255, 255, 0.03); border-radius:var(--radius-md); border:1px solid rgba(239, 68, 68, 0.25);">
                  <div style="font-size:1.5rem; margin-bottom:0.5rem;">🤪</div>
                  <h3 style="font-size:1.05rem; font-weight:700; color:#f87171; margin-bottom:0.4rem; font-family:var(--font-display);">Humor & Supervivencia</h3>
                  <p style="font-size:0.85rem; color:var(--text-muted); line-height:1.5;">Cuestionarios hilarantes para medir tu temperatura de cordura o calcular tus probabilidades reales de sobrevivir a un colapso zombi.</p>
                </div>

                <div style="padding:1.25rem; background:rgba(255, 255, 255, 0.03); border-radius:var(--radius-md); border:1px solid rgba(245, 158, 11, 0.25);">
                  <div style="font-size:1.5rem; margin-bottom:0.5rem;">🌍</div>
                  <h3 style="font-size:1.05rem; font-weight:700; color:#fbbf24; margin-bottom:0.4rem; font-family:var(--font-display);">Curiosidades & Trivia</h3>
                  <p style="font-size:0.85rem; color:var(--text-muted); line-height:1.5;">Hechos asombrosos del mundo real donde deberás discernir entre la verdad científica, mitos urbanos arraigados y auténticos desvaríos.</p>

            <!-- SEO FAQ Accordion -->
            <section style="margin-top:3.5rem; padding:2.5rem 1.75rem; background:var(--bg-surface-elevated); border:1px solid var(--border-subtle); border-radius:var(--radius-lg);">
              <div style="display:flex; align-items:center; gap:0.75rem; margin-bottom:1.5rem;">
                <span style="font-size:1.5rem;">❓</span>
                <h2 style="font-size:1.35rem; font-weight:700; color:#fff; font-family:var(--font-display);">Preguntas Frecuentes sobre Desvaríos Mentales</h2>
              </div>

              <div style="display:flex; flex-direction:column; gap:1.25rem;">
                <details style="background:rgba(255, 255, 255, 0.03); padding:1rem 1.25rem; border-radius:var(--radius-md); border:1px solid var(--border-subtle); cursor:pointer;">
                  <summary style="font-weight:600; color:#f1f5f9; font-size:0.98rem;">¿Qué tipo de tests encontraré en Desvaríos Mentales?</summary>
                  <p style="margin-top:0.75rem; font-size:0.88rem; color:var(--text-secondary); line-height:1.6;">Encontrarás una cuidada selección de 8 cuestionarios únicos: desde diagnósticos psicológicos de arquetipos oscuros y monstruos interiores, pasando por dilemas morales clásicos, hasta acertijos de lógica con pistas interactivas y simuladores tácticos de supervivencia.</p>

                <details style="background:rgba(255, 255, 255, 0.03); padding:1rem 1.25rem; border-radius:var(--radius-md); border:1px solid var(--border-subtle); cursor:pointer;">
                  <summary style="font-weight:600; color:#f1f5f9; font-size:0.98rem;">¿Los tests son totalmente gratuitos y anónimos?</summary>
                  <p style="margin-top:0.75rem; font-size:0.88rem; color:var(--text-secondary); line-height:1.6;">Sí, 100%. No recopilamos ningún dato personal, no exigimos registro ni correos electrónicos, y no hay micropagos. Todo el contenido está abierto y disponible para disfrutarlo de inmediato.</p>
